    const RULES = [
      "Facebook Page၊ YouTube Account၊ TikTok Account စသည့် အကောင့်/ပိုင်ဆိုင်မှု ရောင်းဝယ်မှုများကိုသာ တင်ရမည်။ အဝတ်အစားနှင့် မသက်ဆိုင်သော ရုပ်ပိုင်းဆိုင်ရာပစ္စည်းများ ခွင့်မပြုပါ။",
      "အမျိုးအစားအလိုက် #youtube၊ #facebook၊ #tiktok စသဖြင့် # ခံပြီး ထည့်သွင်းပါက Category မှ တစ်ချက်နှိပ်ပြီး ရှာဖွေနိုင်မည်။",
      "Blue Mark (အတည်ပြု အမှတ်အသား) ကို လူတိုင်းအား အလိုအလျောက် မပေးပါ — ယုံကြည်ရကြောင်း အထောက်အထား / ဝယ်ယူအတည်ပြုမှုဖြင့် ကိုပိုင်ဇော်ထက်ထံ Settings မှတစ်ဆင့် လျှောက်ထား/အယူခံဝင်ရမည်။",
      "မက်ဆေ့ချ်ထဲတွင် Online/Last Seen၊ Seen ပြ/မပြ၊ ✓ / ✓✓ နှင့် မိမိဘက်ဖျက် / Everyone ဖျက်စနစ်များ ထည့်သွင်းထားသည်။",
      "ပို့စ်တစ်ခုတွင် Reaction နှင့် မှတ်ချက် (Comment) များလေ လူတွေဆီ ပိုမိုရောက်ရှိမည်။"
    ];

    function getUser() {
      const keys = [ACCOUNT_KEY, "ppw_user_v6", "ppw_user_v5", "ppw_user_v4", "ppw_user_v3", "ppw_user_v2", "ppw_user_v1"];
      for (const k of keys) {
        try {
          const s = JSON.parse(localStorage.getItem(k));
          if (s && s.id) {
            const norm = {
              id: s.id,
              name: s.name || ("အသုံးပြုသူ #" + String(s.id).slice(-4)),
              bio: s.bio || "ဖြေးဖြေး ဝယ် မှာ Page / Account များ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။",
              phone: s.phone || "",
              photo: s.photo || "",
              blueMark: !!s.blueMark,
              appealStatus: s.appealStatus || "none",
              isAdmin: !!s.isAdmin,
              hideSeen: !!s.hideSeen,
              color: s.color || COLORS[0],
              friends: Array.isArray(s.friends) ? s.friends : [],
              following: Array.isArray(s.following) ? s.following : [],
              createdAt: s.createdAt || Date.now()
            };
            try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(norm)); } catch (e) {}
            return norm;
          }
        } catch (e) {}
      }
      const n = Math.floor(100000 + Math.random() * 900000);
      const u = {
        id: "PPW-" + n,
        name: "အသုံးပြုသူ #" + String(n).slice(-4),
        bio: "ဖြေးဖြေး ဝယ် မှာ Page / Account များ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။",
        phone: "",
        photo: "",
        blueMark: false,
        appealStatus: "none",
        isAdmin: false,
        hideSeen: false,
        color: COLORS[n % COLORS.length],
        friends: [],
        following: [],
        createdAt: Date.now()
      };
      try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(u)); } catch (e) {}
      return u;
    }

    let st = {
      tab: "home",
      profileTab: "posts",
      me: getUser(),
      posts: [],
      myday: [],
      users: {},
      presence: {},
      reviews: {},
      appeals: {},
      notifs: [],
      chats: {},
      typing: {},
      calls: {},
      cat: "အားလုံး",
      q: "",
      fq: "",
      openCmt: {},
      replyTo: {},
      img: null,
      mydayImg: null,
      chatImg: null,
      chatVideo: null,
      chatUid: null,
      activeCall: null,
      showStickers: false,
      nightMode: false,
      soundOn: true,
      audioCtx: null,
      ringTimer: null,
      seenMsgIds: {},
      seenNotifIds: {},
      seenCallIds: {},
      firstSync: true,
      urlUserHandled: false,
      recorder: null,
      audioChunks: []
    };

    const saveMe = () => { try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(st.me)); } catch (e) {} };
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast"); el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.add("hidden"), 2400);
    }
    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }
    function formatExactTime(ts) {
      if (!ts) return "မသိရသေး";
      const dt = new Date(Number(ts));
      return dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " • " + dt.toLocaleDateString();
    }
    function onlineText(uid) {
      if (uid === st.me.id) return "🟢 Online (ယခုအွန်လိုင်း)";
      const ts = Number(st.presence[uid] || 0);
      if (ts && (Date.now() - ts < 10000)) return "🟢 Online ရှိနေသည်";
      if (ts) return "⚫ ဆင်းသွားချိန်: " + formatExactTime(ts);
      return "⚫ Offline";
    }

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!st.audioCtx) st.audioCtx = new AC();
        if (st.audioCtx.state === "suspended") st.audioCtx.resume().catch(() => {});
        return st.audioCtx;
      } catch (e) { return null; }
    }

    document.addEventListener("pointerdown", () => { if (st.soundOn) ensureAudio(); }, { passive: true });

    function stopRingLoop() {
      if (st.ringTimer) { clearInterval(st.ringTimer); st.ringTimer = null; }
    }

    function startRingLoop(mode) {
      stopRingLoop();
      const ringOnce = () => {
        if (!st.soundOn) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const freqs = mode === "incoming" ? [880, 1174.66, 880, 1174.66] : [587.33, 587.33];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = mode === "incoming" ? "triangle" : "sine";
            osc.frequency.setValueAtTime(f, now + i * 0.14);
            g.gain.setValueAtTime(0.001, now + i * 0.14);
            g.gain.exponentialRampToValueAtTime(mode === "incoming" ? 0.22 : 0.14, now + i * 0.14 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.13);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + i * 0.14);
            osc.stop(now + i * 0.14 + 0.14);
          });
        } catch (e) {}
      };
      ringOnce();
      st.ringTimer = setInterval(ringOnce, mode === "incoming" ? 1300 : 1800);
    }

    function toggleNightMode() {
      st.nightMode = !st.nightMode;
      const ov = document.getElementById("nightOverlay");
      if (ov) ov.classList.toggle("hidden", !st.nightMode);
      playSong("notif");
      toast(st.nightMode ? "Night Mode ဖွင့်ပြီး" : "ပုံမှန် အမည်းအောက်ခံသို့ ပြန်ပြောင်းပြီး");
    }

    function toggleSound() {
      st.soundOn = !st.soundOn;
      document.getElementById("soundBtn").textContent = st.soundOn ? "🔊" : "🔇";
      if (!st.soundOn) stopRingLoop();
      else { ensureAudio(); playSong("notif"); }
      toast(st.soundOn ? "အသံပိုင်း ဖွင့်ပြီး" : "အသံပိုင်း ပိတ်ပြီး");
    }

    function playSong(kind) {
      if (!st.soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const seq =
          kind === "message" ? [659.25, 880, 1046.5] :
          kind === "like" ? [587.33, 880] :
          kind === "haha" ? [698.46, 880, 1174.66] :
          kind === "love" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "angry" ? [220.0, 164.81] :
          [523.25, 783.99];
        const wave = kind === "angry" ? "sawtooth" : (kind === "haha" || kind === "like" ? "triangle" : "sine");
        seq.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.001, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.08 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.27);
        });
      } catch (e) {}
    }

    const uInfo = id => id === st.me.id ? st.me : (st.users[id] || { id, name: id, bio: "", photo: "", blueMark: false, friends: [], following: [], color: "from-slate-500 to-slate-600", createdAt: Date.now() });
    const isNewUser = id => (Date.now() - (uInfo(id).createdAt || Date.now())) < 7 * 86400000;
    function blueBadge(u) {
      if (!u || !u.blueMark) return "";
      return `<span title="အတည်ပြု ယုံကြည်စိတ်ချရသူ" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-sky-500 text-white text-xs font-bold shrink-0">✓</span>`;
    }
    function uRating(id) {
      const l = Object.values(st.reviews || {}).filter(r => r.targetId === id);
      if (!l.length) return { avg: "0.0", count: 0, list: [] };
      return { avg: (l.reduce((a, b) => a + (Number(b.rating) || 5), 0) / l.length).toFixed(1), count: l.length, list: l };
    }
    function followersCount(id) {
      let c = 0;
      Object.values(st.users || {}).forEach(u => {
        if (u && u.id !== id && Array.isArray(u.following) && u.following.includes(id)) c++;
      });
      return c;
    }
    function avatar(u, sz = "w-11 h-11 text-base") {
      const x = typeof u === "string" ? uInfo(u) : u;
      if (x && x.photo) {
        return `<img src="${x.photo}" alt="${esc(x.name || "U")}" class="${sz} rounded-full object-cover shrink-0 shadow-sm border-2 border-emerald-500/50 bg-slate-800"/>`;
      }
      return `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shrink-0 shadow-sm">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
    }

    function totalReactions(p) {
      const rx = p.reactions || {};
      let sum = Object.keys(p.likes || {}).length;
      Object.values(rx).forEach(map => { sum += Object.keys(map || {}).length; });
      return sum;
    }

    function userReaction(p) {
      const rx = p.reactions || {};
      for (const r of REACTIONS) {
        if (rx[r.key] && rx[r.key][st.me.id]) return r.key;
      }
      if (p.likes && p.likes[st.me.id]) return "like";
      return null;
    }

    function engagementScore(p) {
      const rCnt = totalReactions(p);
      const cCnt = Object.keys(p.comments || {}).length;
      return rCnt * 3 + cCnt * 5;
    }

    function feedScore(p) {
      const eng = engagementScore(p);
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      const recencyBoost = 24 / (1 + ageHours * 0.25);
      const newMemberBoost = isNewUser(p.authorId) ? 6 : 0;
      return eng * 2.5 + recencyBoost + newMemberBoost;
    }

    function matchesCategoryOrTag(p, filterVal) {
      if (!filterVal || filterVal === "အားလုံး" || filterVal === "စိတ်ဝင်စားမှုများ" || filterVal === "အသစ်ရောက်သူများ") return true;
      const txt = ((p.text || "") + " " + (p.tags || "")).toLowerCase();
      if (filterVal === "YouTube Account") return p.category === "YouTube Account" || txt.includes("#youtube");
      if (filterVal === "Facebook Page") return p.category === "Facebook Page" || txt.includes("#facebook") || txt.includes("#fb");
      if (filterVal === "TikTok Account") return p.category === "TikTok Account" || txt.includes("#tiktok");
      return p.category === filterVal;
    }

    function hasBlockedClothing(str) {
      const low = String(str || "").toLowerCase();
      return BLOCKED_PHYSICAL.some(k => low.includes(k));
    }

    const fbGet = p => fetch(`${DB}/${p}.json`).then(r => r.json());
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    function heartbeat() {
      fbPut(`presence/${st.me.id}`, Date.now()).catch(() => {});
    }

    async function sync(init = false) {
      try {
        heartbeat();
        if (init) await fbPut(`users/${st.me.id}`, st.me);
        const [po, md, us, pr, rv, ap, no, ch, ty, cl] = await Promise.all([
          fbGet("posts"),
          fbGet("myday"),
          fbGet("users"),
          fbGet("presence"),
          fbGet("reviews"),
          fbGet("appeals"),
          fbGet(`notifications/${st.me.id}`),
          fbGet("chats"),
          fbGet("typing"),
          fbGet("calls")
        ]);
        const rawPosts = po ? Object.values(po) : [];
        st.posts = rawPosts.filter(p => p && TRADE_CATS.includes(p.category) && !hasBlockedClothing(p.text) && (p.text || p.image));
        const dayCutoff = Date.now() - 24 * 3600000;
        st.myday = md ? Object.values(md).filter(d => d && (d.createdAt || 0) >= dayCutoff).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        st.users = us || {};
        st.presence = pr || {};
        if (st.users[st.me.id]) {
          st.me.blueMark = !!st.users[st.me.id].blueMark;
          st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
          st.me.isAdmin = !!st.users[st.me.id].isAdmin;
          if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
          saveMe();
        }
        st.users[st.me.id] = st.me;
        st.reviews = rv || {};
        st.appeals = ap || {};
        st.typing = ty || {};
        st.calls = cl || {};

        if (!st.urlUserHandled) {
          st.urlUserHandled = true;
          const uidParam = new URLSearchParams(location.search).get("u");
          if (uidParam && st.users[uidParam]) {
            setTimeout(() => openUserModal(uidParam), 250);
          }
        }

        const nextNotifs = no ? Object.values(no).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        let newNotifSong = false;
        nextNotifs.forEach(n => {
          if (!st.seenNotifIds[n.id]) {
            st.seenNotifIds[n.id] = true;
            if (!st.firstSync && !n.read) newNotifSong = true;
          }
        });
        st.notifs = nextNotifs;

        const nextChats = ch || {};
        let newMsgSong = false;
        Object.entries(nextChats).forEach(([rk, mObj]) => {
          if (!rk.includes(st.me.id)) return;
          Object.values(mObj || {}).forEach(m => {
            if (!st.seenMsgIds[m.id]) {
              st.seenMsgIds[m.id] = true;
              if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true;
            }
          });
        });
        st.chats = nextChats;

        let incomingCall = null;
        Object.values(st.calls || {}).forEach(c => {
          if (!c) return;
          if (c.status === "ringing" && c.toId === st.me.id && !st.seenCallIds[c.id]) {
            st.seenCallIds[c.id] = true;
            if (!st.firstSync) incomingCall = c;
          }
          if (st.activeCall && st.activeCall.id === c.id) {
            st.activeCall = c;
            if (c.status !== "ringing") stopRingLoop();
          }
        });

        st.firstSync = false;

        if (incomingCall && !st.activeCall) {
          st.activeCall = incomingCall;
          startRingLoop("incoming");
          openCallModal(incomingCall.id);
        } else if (newMsgSong) {
          playSong("message");
        } else if (newNotifSong) {
          playSong("notif");
        }

        if (st.chatUid && !st.me.hideSeen) {
          markRoomSeen(st.chatUid);
        }

        document.getElementById("syncDot").className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        document.getElementById("syncText").textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";
        const unread = st.notifs.filter(n => !n.read).length;
        const nb = document.getElementById("notifBadge");
        if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden");

        const activeEl = document.activeElement;
        const tag = activeEl ? activeEl.tagName : "";
        const isTypingMsg = activeEl && activeEl.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) {
          render();
          if (st.chatUid) renderMsgs();
        } else if (st.chatUid && !isTypingMsg) {
          renderMsgs();
        } else if (st.chatUid) {
          renderTypingBanner();
        }
      } catch (e) {
        document.getElementById("syncDot").className = "w-2.5 h-2.5 rounded-full bg-amber-400";
        document.getElementById("syncText").textContent = "ချိတ်ဆက်နေဆဲ...";
      }
    }

    function notify(toId, text) {
      if (!toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function switchTab(t) {
      st.tab = t;
      playSong("notif");
      document.querySelectorAll(".nav-btn").forEach(b => { b.classList.remove("text-emerald-400"); b.classList.add("text-slate-400"); });
      const a = document.getElementById("nav-" + t);
      if (a) { a.classList.remove("text-slate-400"); a.classList.add("text-emerald-400"); }
      if (t === "notifications") {
        st.notifs.filter(n => !n.read).forEach(n => { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); });
        document.getElementById("notifBadge").classList.add("hidden");
      }
      render();
    }

    function getFilteredPosts() {
      let list = [...st.posts];
      if (st.cat === "စိတ်ဝင်စားမှုများ") {
        list.sort((a, b) => engagementScore(b) - engagementScore(a) || (b.createdAt || 0) - (a.createdAt || 0));
      } else if (st.cat === "အသစ်ရောက်သူများ") {
        list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (st.cat !== "အားလုံး") {
        list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      } else {
        list.sort((a, b) => feedScore(b) - feedScore(a));
      }
      return list;
    }

      const u = uInfo(uid);
      const fIds = Array.isArray(u.friends) ? u.friends : [];
      const shown = fIds.slice(0, limit);

              </div>`;

        </div>`;
    }

              <span class="text-xs font-bold text-emerald-300">MyDay</span>
            </button>
            ${st.myday.map(d => {

                <button onclick="viewMyDay('${d.id}')" class="flex flex-col items-center gap-1.5 shrink-0 max-w-[72px]">

                    ${avatar(du, "w-14 h-14 text-base")}

                  <span class="text-xs font-semibold text-slate-200 truncate w-full text-center">${esc(du.name)}</span>
                </button>`;
            }).join("")}
          </div>
        </div>`;

        el.innerHTML = `

          </div>

          </div>

          <div class="p-3 space-y-3.5">${list.length ? list.map(postCard).join("") : `<div class="bg-[#0f172a] rounded-2xl p-8 text-center border border-slate-800 text-sm text-slate-400">ဤကဏ္ဍတွင် Account ရောင်းဝယ်မှုပို့စ် မရှိသေးပါ — ပထမဆုံး ပို့စ်တင်ကြည့်ပါ!</div>`}</div>`;
      } else if (st.tab === "explore") {

        el.innerHTML = `

            <div class="space-y-2.5">${users.length ? users.map(u => {
              const isF = (st.me.friends || []).includes(u.id);
              return `<div class="bg-[#0f172a] p-3 rounded-2xl border border-slate-800 flex items-center justify-between gap-2">
                <div onclick="openUserModal('${u.id}')" class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0">${avatar(u, "w-12 h-12 text-base")}<div class="min-w-0"><div class="text-sm font-bold text-white truncate flex items-center gap-1">${esc(u.name)} ${blueBadge(u)}</div><div class="text-xs text-slate-400 font-mono">${esc(u.id)}</div></div></div>
