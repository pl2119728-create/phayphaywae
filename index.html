<body class="bg-slate-100">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl flex flex-col relative pb-20">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-bold text-slate-900 leading-tight">ဖြေးဖြေး ဝယ်</h1>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">APK WEB</span>
          </div>

            <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>

      <div class="flex items-center gap-1.5">
        <button onclick="toggleSound()" id="soundBtn" class="p-2 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700" title="အသံဖွင့်/ပိတ်">🔊</button>
        <button onclick="openRulesModal()" class="p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700" title="စည်းမျဉ်းစည်းကမ်း">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </button>
        <button onclick="switchTab('chats')" class="relative p-2 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700" title="မက်ဆေ့ချ်များ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </button>
        <button onclick="switchTab('notifications')" class="relative p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700" title="အကြောင်းကြားစာ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-1 py-1.5 flex items-center justify-around z-30">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

      <button onclick="switchTab('explore')" id="nav-explore" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="text-[10px] font-medium">ရှာဖွေရန်</span>
      </button>
      <button onclick="openComposerModal()" class="flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md shadow-emerald-200 active:scale-95 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
      <button onclick="switchTab('chats')" id="nav-chats" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span class="text-[10px] font-medium">စာတို</span>
      </button>
      <button onclick="switchTab('friends')" id="nav-friends" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[10px] font-medium">သူငယ်ချင်း</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-medium">ပရိုဖိုင်</span>
      </button>
    </nav>

    <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap"></div>
    <div id="modalRoot"></div>
  </div>

  <script>
    const DB = "https://phay-phay-wae-default-rtdb.asia-southeast1.firebasedatabase.app";
    const ADMIN_NAME = "ပိုင်ဇော်ထက် (Paing Zaw Htet)";
    const TRADE_CATS = ["ဖုန်းနှင့်အီလက်ထရောနစ်", "ဖက်ရှင်နှင့်အလှကုန်", "အိမ်သုံးပစ္စည်း", "အစားအသောက်", "ကား/ဆိုင်ကယ်", "ဝန်ဆောင်မှု"];
    const FEED_FILTERS = ["အားလုံး", "စိတ်ဝင်စားမှုများ", "အသစ်ရောက်သူများ", ...TRADE_CATS];
    const COLORS = ["from-emerald-500 to-teal-600", "from-blue-500 to-indigo-600", "from-amber-500 to-orange-600", "from-rose-500 to-pink-600", "from-purple-500 to-violet-600"];
    const RULES = [
      "ရောင်းဝယ်မှုနှင့် ပစ္စည်းအကြောင်း ပို့စ်များကိုသာ တင်ရမည်။ ရောင်းဝယ်မှုနှင့် မသက်ဆိုင်သော Spam / အကြောင်းမဲ့ပို့စ်များ ခွင့်မပြုပါ။",
      "ပစ္စည်းအခြေအနေ (အသစ် / တစ်ပတ်ရစ်)၊ ဈေးနှုန်းနှင့် ဆက်သွယ်ရန် အချက်အလက် မှန်ကန်ရမည်။",
      "လိမ်လည်မှု၊ အတုအပပစ္စည်း၊ တရားမဝင်ပစ္စည်းနှင့် ယုံကြည်မှုပျက်စီးစေသော အပြုအမူများ လုံးဝခွင့်မပြုပါ။",
      "Blue Mark (အတည်ပြု အမှတ်အသား) ကို လူတိုင်းအား အလိုအလျောက် မပေးပါ — ယုံကြည်ရကြောင်း အထောက်အထားဖြင့် ကိုပိုင်ဇော်ထက်ထံ အယူခံဝင် စစ်ဆေးခံရမည်။",
      "ပို့စ်တစ်ခုတွင် စိတ်ဝင်စားမှု (Like) နှင့် မှတ်ချက် (Comment) များလေ လူတွေဆီ ပိုမိုရောက်ရှိမည်။"
    ];

    function getUser() {
      try {
        const s = JSON.parse(localStorage.getItem("ppw_user_v3"));
        if (s && s.id) return s;
      } catch (e) {}
      const n = Math.floor(100000 + Math.random() * 900000);
      const u = {
        id: "PPW-" + n,
        name: "အသုံးပြုသူ #" + String(n).slice(-4),
        bio: "ဖြေးဖြေး ဝယ် မှာ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။",
        phone: "",
        photo: "",
        blueMark: false,
        appealStatus: "none",
        isAdmin: false,
        color: COLORS[n % COLORS.length],
        friends: [],
        createdAt: Date.now()
      };
      try { localStorage.setItem("ppw_user_v3", JSON.stringify(u)); } catch (e) {}
      return u;
    }

    let st = {
      tab: "home",
      me: getUser(),
      posts: [],
      users: {},
      reviews: {},
      appeals: {},
      notifs: [],
      chats: {},
      typing: {},
      cat: "အားလုံး",
      q: "",
      fq: "",
      openCmt: {},
      replyTo: {},
      img: null,
      chatImg: null,
      chatUid: null,
      soundOn: true,
      seenMsgIds: {},
      seenNotifIds: {},
      firstSync: true,
      recorder: null,
      audioChunks: []
    };

    const saveMe = () => { try { localStorage.setItem("ppw_user_v3", JSON.stringify(st.me)); } catch (e) {} };
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast"); el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.add("hidden"), 2400);
    }
    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }

    function toggleSound() {
      st.soundOn = !st.soundOn;
      document.getElementById("soundBtn").textContent = st.soundOn ? "🔊" : "🔇";
      toast(st.soundOn ? "Noti Song အသံ ဖွင့်လိုက်ပါပြီ" : "Noti Song အသံ ပိတ်လိုက်ပါပြီ");
      if (st.soundOn) playSong("notif");
    }

    function playSong(kind) {
      if (!st.soundOn) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const now = ctx.currentTime;
        const notes = kind === "message" ? [659.25, 880, 1046.5] : [523.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = kind === "message" ? "sine" : "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.001, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.09 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.09 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.3);
        });
      } catch (e) {}
    }

    const uInfo = id => id === st.me.id ? st.me : (st.users[id] || { id, name: id, bio: "", photo: "", blueMark: false, color: "from-slate-500 to-slate-600", createdAt: Date.now() });
    const isNewUser = id => (Date.now() - (uInfo(id).createdAt || Date.now())) < 7 * 86400000;
    function blueBadge(u) {
      if (!u || !u.blueMark) return "";
      return `<span title="အတည်ပြု ယုံကြည်စိတ်ချရသူ" class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-sky-500 text-white text-[10px] font-bold shrink-0">✓</span>`;
    }
    function uRating(id) {
      const l = Object.values(st.reviews || {}).filter(r => r.targetId === id);
      if (!l.length) return { avg: "0.0", count: 0, list: [] };
      return { avg: (l.reduce((a, b) => a + (Number(b.rating) || 5), 0) / l.length).toFixed(1), count: l.length, list: l };
    }
    function avatar(u, sz = "w-10 h-10 text-sm") {
      const x = typeof u === "string" ? uInfo(u) : u;
      if (x && x.photo) {
        return `<img src="${x.photo}" alt="${esc(x.name || "U")}" class="${sz} rounded-full object-cover shrink-0 shadow-sm border-2 border-emerald-500/40 bg-slate-100"/>`;
      }
      return `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shrink-0 shadow-sm">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
    }

    function engagementScore(p) {
      const lCnt = Object.keys(p.likes || {}).length;
      const cCnt = Object.keys(p.comments || {}).length;
      return lCnt * 3 + cCnt * 5;
    }

    function feedScore(p) {
      const eng = engagementScore(p);
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      const recencyBoost = 24 / (1 + ageHours * 0.25);
      const newMemberBoost = isNewUser(p.authorId) ? 6 : 0;
      return eng * 2.5 + recencyBoost + newMemberBoost;
    }

    const fbGet = p => fetch(`${DB}/${p}.json`).then(r => r.json());
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    async function sync(init = false) {
      try {
        if (init) await fbPut(`users/${st.me.id}`, st.me);
        const [po, us, rv, ap, no, ch, ty] = await Promise.all([
          fbGet("posts"),
          fbGet("users"),
          fbGet("reviews"),
          fbGet("appeals"),
          fbGet(`notifications/${st.me.id}`),
          fbGet("chats"),
          fbGet("typing")
        ]);
        const rawPosts = po ? Object.values(po) : [];
        st.posts = rawPosts.filter(p => p && TRADE_CATS.includes(p.category) && (p.text || p.image));
        st.users = us || {};
        if (st.users[st.me.id]) {
          st.me.blueMark = !!st.users[st.me.id].blueMark;
          st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
          st.me.isAdmin = !!st.users[st.me.id].isAdmin;
          if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
          saveMe();
        }
        st.users[st.me.id] = st.me;
        st.reviews = rv || {};
        st.appeals = ap || {};
        st.typing = ty || {};

        const nextNotifs = no ? Object.values(no).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        let newNotifSong = false;
        nextNotifs.forEach(n => {
          if (!st.seenNotifIds[n.id]) {
            st.seenNotifIds[n.id] = true;
            if (!st.firstSync && !n.read) newNotifSong = true;
          }
        });
        st.notifs = nextNotifs;

        const nextChats = ch || {};
        let newMsgSong = false;
        Object.entries(nextChats).forEach(([rk, mObj]) => {
          if (!rk.includes(st.me.id)) return;
          Object.values(mObj || {}).forEach(m => {
            if (!st.seenMsgIds[m.id]) {
              st.seenMsgIds[m.id] = true;
              if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true;
            }
          });
        });
        st.chats = nextChats;
        st.firstSync = false;

        if (newMsgSong) playSong("message");
        else if (newNotifSong) playSong("notif");

        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-emerald-500";
        document.getElementById("syncText").textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";
        const unread = st.notifs.filter(n => !n.read).length;
        const nb = document.getElementById("notifBadge");
        if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden");

        const activeEl = document.activeElement;
        const tag = activeEl ? activeEl.tagName : "";
        const isTypingMsg = activeEl && activeEl.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) {
          render();
          if (st.chatUid) renderMsgs();
        } else if (st.chatUid && !isTypingMsg) {
          renderMsgs();
        } else if (st.chatUid) {
          renderTypingBanner();
        }
      } catch (e) {
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-amber-500";
        document.getElementById("syncText").textContent = "ချိတ်ဆက်နေဆဲ...";
      }
    }

    function notify(toId, text) {
      if (!toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function switchTab(t) {
      st.tab = t;
      document.querySelectorAll(".nav-btn").forEach(b => { b.classList.remove("text-emerald-600"); b.classList.add("text-slate-500"); });
      const a = document.getElementById("nav-" + t);
      if (a) { a.classList.remove("text-slate-500"); a.classList.add("text-emerald-600"); }
      if (t === "notifications") {

    function onPickAvatar(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), sz = 240;
          const minSide = Math.min(im.width, im.height);
          const sx = Math.floor((im.width - minSide) / 2);
          const sy = Math.floor((im.height - minSide) / 2);
          c.width = sz; c.height = sz;
          c.getContext("2d").drawImage(im, sx, sy, minSide, minSide, 0, 0, sz, sz);
          st.me.photo = c.toDataURL("image/jpeg", 0.78);
          saveMe(); st.users[st.me.id] = st.me; render(); toast("ပရိုဖိုင်ပုံ ပြောင်းလဲပြီးပါပြီ");
          fbPut(`users/${st.me.id}`, st.me).catch(() => {});
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.img = c.toDataURL("image/jpeg", 0.72);
          document.getElementById("imgPrev").src = st.img;
          document.getElementById("imgBox").classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

      const category = document.getElementById("postCat").value;

      if (!text && !st.img) return toast("ပစ္စည်းအကြောင်း သို့မဟုတ် ဓာတ်ပုံ ထည့်ပေးပါ");
      const id = "P-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      const p = { id, authorId: st.me.id, text, image: st.img || "", price, condition, category, likes: {}, comments: {}, createdAt: Date.now() };

    function likePost(id) {
      const p = st.posts.find(x => x.id === id); if (!p) return; if (!p.likes) p.likes = {};

      else { p.likes[st.me.id] = true; notify(p.authorId, "က သင့်ပို့စ်ကို စိတ်ဝင်စားပါသည်"); fbPut(`posts/${id}/likes/${st.me.id}`, true).catch(() => {}); }
      render();
    }

            ${!own ? `<div class="grid grid-cols-2 gap-2">
              <button onclick="toggleFriend('${u.id}');openUserModal('${u.id}')" class="py-2 rounded-xl text-xs font-bold ${isF ? "bg-slate-100 text-slate-700" : "bg-emerald-600 text-white"}">${isF ? "သူငယ်ချင်း ✓" : "+ သူငယ်ချင်းအပ်"}</button>
              <button onclick="openChat('${u.id}')" class="py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">💬 စာပို့မည်</button>
            </div>` : ""}
            <div class="pt-2 border-t border-slate-100 space-y-2">
              <div class="text-xs font-bold">သုံးသပ်ချက်များ (★ ${r.avg} • ${r.count} ခု)</div>
              ${!own ? `<div class="flex gap-1.5">
                <select id="rvStar" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-amber-600"><option value="5">5★</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option><option value="1">1★</option></select>
                <input id="rvTxt" type="text" placeholder="သုံးသပ်ချက်ရေးရန်..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs"/>
                <button onclick="addReview('${u.id}')" class="px-3 py-1.5 rounded-xl bg-amber-500 text-white text-xs font-bold">ပို့</button>
              </div>` : ""}
              <div class="space-y-1.5 max-h-36 overflow-y-auto">${r.list.map(x => `<div class="bg-slate-50 p-2 rounded-xl text-xs"><span class="font-bold">${esc(uInfo(x.authorId).name)}</span> <span class="text-amber-500">${"★".repeat(x.rating || 5)}</span><div class="text-slate-600">${esc(x.text)}</div></div>`).join("")}</div>
            </div>
          </div>
        </div>`;
    }

    function addReview(tid) {
      const rating = Number(document.getElementById("rvStar").value) || 5, text = document.getElementById("rvTxt").value.trim() || "ယုံကြည်စိတ်ချရပါတယ်";
      const id = "R-" + Date.now(), rv = { id, targetId: tid, authorId: st.me.id, rating, text, createdAt: Date.now() };
      st.reviews[id] = rv; openUserModal(tid); toast("သုံးသပ်ချက် ပေးပို့ပြီးပါပြီ"); notify(tid, `က သင့်ကို ${rating}★ သုံးသပ်ချက် ပေးခဲ့သည်`);
      fbPut(`reviews/${id}`, rv).catch(() => {});
    }

    const roomId = (a, b) => [a, b].sort().join("__");

    function sendTyping(oid) {
      const rid = roomId(st.me.id, oid);
      if (!st.typing[rid]) st.typing[rid] = {};
      st.typing[rid][st.me.id] = Date.now();
      fbPut(`typing/${rid}/${st.me.id}`, Date.now()).catch(() => {});
    }

    function renderTypingBanner() {
      const tb = document.getElementById("typingBanner");
      if (!tb || !st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid);
      const tObj = st.typing[rid] || {};
      const active = Object.entries(tObj).some(([uid, ts]) => uid !== st.me.id && (Date.now() - Number(ts || 0) < 4500));
      if (active) {
        tb.innerHTML = `<span class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full"><span>${esc(uInfo(st.chatUid).name)}</span><span>စာရိုက်နေပါသည်...</span></span>`;
        tb.classList.remove("hidden");
      } else {
        tb.classList.add("hidden");
      }
    }

    function openChat(oid) {
      st.chatUid = oid; st.chatImg = null; const o = uInfo(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl flex flex-col h-[84vh] animate-slide-up overflow-hidden">
            <div class="p-3.5 border-b border-slate-200 flex items-center justify-between">
              <div class="flex items-center gap-2.5">${avatar(o, "w-9 h-9 text-xs")}<div><div class="text-xs font-bold flex items-center gap-1">${esc(o.name)} ${blueBadge(o)}</div><div class="text-[10px] text-slate-400 font-mono">${esc(o.id)}</div></div></div>
              <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button>
            </div>
            <div id="msgBox" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 bg-slate-50"></div>
            <div id="typingBanner" class="hidden px-3.5 py-1 bg-slate-50"></div>
            <div id="chatImgPreview" class="hidden px-3.5 py-2 bg-white border-t border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-2"><img id="chatImgThumb" src="" class="w-11 h-11 rounded-lg object-cover border"/><span class="text-xs text-slate-600 font-medium">ဓာတ်ပုံ ပို့ရန် အဆင်သင့်</span></div>
              <button onclick="st.chatImg=null;document.getElementById('chatImgPreview').classList.add('hidden')" class="text-xs text-rose-500 font-bold">ဖျက်</button>
            </div>
            <div class="p-2.5 bg-white border-t border-slate-200 flex items-center gap-1.5">
              <label class="p-2 rounded-full bg-slate-100 text-slate-700 cursor-pointer text-sm" title="ပုံပို့ရန်">
                📷<input type="file" accept="image/*" onchange="onPickChatImg(event)" class="hidden"/>
              </label>
              <button onclick="toggleVoiceRec()" id="voiceBtn" class="p-2 rounded-full bg-slate-100 text-slate-700 text-sm" title="အသံမက်ဆေ့ချ်">🎙️</button>
              <input id="msgInp" type="text" placeholder="စာရိုက်ပါ..." oninput="sendTyping('${oid}')" onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 bg-slate-100 rounded-full px-3.5 py-2 text-xs focus:outline-none"/>
              <button onclick="sendMsg()" class="px-3.5 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold">ပို့</button>
            </div>
          </div>
        </div>`;
      renderMsgs();
    }

    function onPickChatImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 640;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.chatImg = c.toDataURL("image/jpeg", 0.72);
          document.getElementById("chatImgThumb").src = st.chatImg;
          document.getElementById("chatImgPreview").classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    async function toggleVoiceRec() {
      const btn = document.getElementById("voiceBtn");
      if (st.recorder && st.recorder.state === "recording") {
        st.recorder.stop();
        if (btn) btn.className = "p-2 rounded-full bg-slate-100 text-slate-700 text-sm";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return toast("ဤ Browser တွင် အသံသွင်းစနစ် မရနိုင်ပါ");
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = [];
        const rec = new MediaRecorder(stream);
        st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(st.audioChunks, { type: "audio/webm" });
          const reader = new FileReader();
          reader.onloadend = () => {
            if (!st.chatUid) return;
            sendChatPayload({ text: "", image: "", audio: reader.result });
          };
          reader.readAsDataURL(blob);
        };
        rec.start();
        toast("အသံသွင်းနေပါသည်... ပို့ရန် 🎙️ ကို ထပ်နှိပ်ပါ");
        if (btn) btn.className = "p-2 rounded-full bg-rose-500 text-white text-sm animate-pulse";
      } catch (e) {
        toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်");
      }
    }

    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).sort((a, b) => a.createdAt - b.createdAt);
      box.innerHTML = ms.length ? ms.map((m, i) => {
        const me = m.senderId === st.me.id;
        return `
          <div class="flex items-end gap-1.5 ${me ? "justify-end" : "justify-start"}">
            ${!me ? `<span class="w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}
            <div class="max-w-[78%] px-3.5 py-2 rounded-2xl text-xs space-y-1.5 ${me ? "bg-emerald-600 text-white" : "bg-white border border-slate-200 text-slate-800"}">
              ${m.image ? `<img src="${m.image}" class="rounded-xl max-h-48 object-cover bg-slate-100"/>` : ""}
              ${m.audio ? `<audio controls src="${m.audio}" class="w-48 h-8"></audio>` : ""}
              ${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}
            </div>
            ${me ? `<span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}
          </div>`;
      }).join("") : `<p class="text-xs text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;
      renderTypingBanner();
    }

    function sendChatPayload({ text, image, audio }) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), mid = "M-" + Date.now();
      const m = { id: mid, senderId: st.me.id, text: text || "", image: image || "", audio: audio || "", createdAt: Date.now() };
      if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
      st.chatImg = null;
      const prev = document.getElementById("chatImgPreview"); if (prev) prev.classList.add("hidden");
      fbPut(`typing/${rid}/${st.me.id}`, 0).catch(() => {});
      renderMsgs();
      const notiLabel = text ? text.slice(0, 20) : (audio ? "🎙️ အသံမက်ဆေ့ချ်" : "📷 ဓာတ်ပုံ");
      notify(st.chatUid, "က စာပို့လိုက်သည်: " + notiLabel);
      fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }

    function sendMsg() {
      const inp = document.getElementById("msgInp"); if (!inp || !st.chatUid) return;
      const text = inp.value.trim();
      if (!text && !st.chatImg) return;
      sendChatPayload({ text, image: st.chatImg || "", audio: "" });
      inp.value = "";
    }

    function closeModal() {
      if (st.chatUid) {
        fbPut(`typing/${roomId(st.me.id, st.chatUid)}/${st.me.id}`, 0).catch(() => {});
      }
      if (st.recorder && st.recorder.state === "recording") {
        try { st.recorder.stop(); } catch (e) {}
      }
      st.chatUid = null;
      document.getElementById("modalRoot").innerHTML = "";
    }

    render();
    sync(true);
    setInterval(() => sync(false), 2000);
  </script>
</body>
</html>
