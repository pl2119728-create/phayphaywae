  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, 'Noto Sans Myanmar', 'Myanmar Text', 'Pyidaungsu', sans-serif; font-size: 15px; background: #05080f; color: #f8fafc; margin: 0; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp .18s ease-out forwards; }
    @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    .animate-slide-right { animation: slideRight .2s cubic-bezier(.16,1,.3,1) forwards; }

    .market-dock {position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:28rem;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:8px 8px calc(6px + env(safe-area-inset-bottom));background:#101829;border-top:1px solid #334155;box-shadow:0 -6px 24px #03071255}
    #app {padding-bottom:calc(94px + env(safe-area-inset-bottom))}
    .market-dock .nav-btn {display:flex;min-width:0;min-height:54px;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#bac4d3;font-size:11px;font-weight:600}
    .market-dock button:focus-visible {outline:2px solid #fff;outline-offset:2px}
    .dock-orb {position:relative;display:grid;place-items:center;width:37px;height:37px;border-radius:50%;color:#fff;background:radial-gradient(circle at 28% 18%,hsl(var(--h) 88% 76%),transparent 50%),linear-gradient(135deg,hsl(var(--h) 72% 49%),hsl(calc(var(--h) + 34) 75% 30%));box-shadow:inset 0 0 0 1px #ffffff45;filter:saturate(.62);transition:transform .35s cubic-bezier(.2,1.7,.4,1),filter .2s}
    .dock-orb svg {width:20px;height:20px;filter:drop-shadow(0 1px 2px #0006)}
    .nav-btn[aria-current=page] {color:#fff}
    .nav-btn[aria-current=page] .dock-orb {transform:translateY(-3px) scale(1.1);filter:saturate(1.1);box-shadow:0 0 0 2px #101829,0 0 0 3px hsl(var(--h) 76% 70%)}
    .dock-wave {display:none;position:absolute;bottom:-2px;align-items:center;gap:2px;border-radius:5px;background:#0e1729;padding:2px 3px}
    .nav-btn[aria-current=page] .dock-wave {display:flex}
    .dock-wave i {height:4px;width:2px;background:#fff;animation:dock-wave .55s ease-in-out 2 alternate}
    .dock-wave i:nth-child(2n){height:7px;animation-delay:.09s}
    @keyframes dock-wave {from{transform:scaleY(.45)}to{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.dock-orb,.dock-wave i{animation:none;transition:none}}
  </style>

    const SB_HEADERS = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };

    function parsePath(path) {
      const parts = String(path || "").split("/").filter(Boolean).map(p => decodeURIComponent(p));
      return { bucket: parts[0] || "", itemId: parts[1] || "", sub: parts.slice(2) };
    }

    async function fbGet(path, signal) {
      const { bucket, itemId, sub } = parsePath(path);
      let url = `${SUPABASE_URL}/rest/v1/ppw_kv?bucket=eq.${encodeURIComponent(bucket)}&select=item_id,data`;
      if (itemId) url += `&item_id=eq.${encodeURIComponent(itemId)}`;
      const response = await fetch(url, { headers: SB_HEADERS, signal });
      if (!response.ok) throw new Error("Supabase HTTP " + response.status);
      const rows = await response.json();
      if (!itemId) {
        const out = {};
        for (const r of rows) out[r.item_id] = r.data;
        return out;
      }
      let val = rows.length ? rows[0].data : null;
      for (const k of sub) val = (val && typeof val === "object") ? val[k] : null;
      return val;
    }

    function fbPut(path, data) {
      const { bucket, itemId, sub } = parsePath(path);
      return fetch(`${SUPABASE_URL}/rest/v1/rpc/ppw_set`, {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({ p_bucket: bucket, p_item_id: itemId, p_subpath: sub, p_val: data === undefined ? null : data })
      });
    }

    function fbDel(path) {
      const { bucket, itemId, sub } = parsePath(path);
      return fetch(`${SUPABASE_URL}/rest/v1/rpc/ppw_del`, {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({ p_bucket: bucket, p_item_id: itemId, p_subpath: sub })
      });
    }

    let syncRunning = false;
    let syncTimer = 0;
    let nextSyncDelay = 4000;
    const loaded = new Set();
    const slowReads = new Set(["posts","myday","users","reviews","appeals","boostRequests"]);
    const lastRead = new Map();
    const failedReads = new Set();

    function showSyncStatus(text, live = false) {
      const dot = document.getElementById("syncDot");
      const label = document.getElementById("syncText");
      if (dot) dot.className = "w-2 h-2 rounded-full " + (live ? "bg-emerald-400" : "bg-amber-400");
      if (label) label.textContent = text;
    }

    function scheduleSync(delay) {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => sync(), delay);
    }

    async function sync(init = false) {
      if (syncRunning) return;
      syncRunning = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      const noticePath = `notifications/${st.me.id}`;
      try {
        fbPut(`presence/${st.me.id}`, Date.now()).catch(() => {});
        if (init) fbPut(`users/${st.me.id}`, st.me).catch(() => {});
        const readVersion = dayReactionVersion;
        const paths = ["posts","myday","users","presence","reviews","appeals","boostRequests",
          noticePath,"chats","typing","calls"].filter(path =>
            !slowReads.has(path) || !lastRead.has(path) || Date.now() - lastRead.get(path) >= 15000);
        const data = Object.create(null);
        await Promise.all(paths.map(async path => {
          try {
            data[path] = await fbGet(path, controller.signal);
            lastRead.set(path, Date.now());
            failedReads.delete(path);
          } catch {
            failedReads.add(path);
          }
        }));
        if (!Object.keys(data).length) {
          nextSyncDelay = Math.min(30000, nextSyncDelay * 2);
          showSyncStatus("ဒေတာ ရယူမရသေးပါ။ ပြန်ချိတ်နေသည်…");
          return;
        }
        nextSyncDelay = 4000;
        if ("posts" in data) {
          st.posts = Object.values(data.posts || {}).filter(p => p && TRADE_CATS.includes(p.category) &&
            !hasBlockedClothing(p.text) && (p.text || p.image));
        }
        if ("myday" in data && readVersion === dayReactionVersion) {
          const cutoff = Date.now() - 24 * 3600000;
          st.myday = Object.values(data.myday || {}).filter(d => d && (d.createdAt || 0) >= cutoff)
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          refreshDayReactions();
        }
        for (const key of ["users","presence","reviews","appeals","boostRequests","typing","calls"]) {
          if (key in data) st[key] = data[key] || {};
        }
        if (st.users[st.me.id]) {
          st.me.blueMark = st.me.id === OWNER_ID ? true : !!st.users[st.me.id].blueMark;
          st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
          if (st.users[st.me.id].isAdmin || st.me.id === OWNER_ID) st.me.isAdmin = true;
          if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
          if (!st.me.coverPhoto && st.users[st.me.id].coverPhoto) st.me.coverPhoto = st.users[st.me.id].coverPhoto;
          saveMe();
        }
        st.users[st.me.id] = st.me;
        if ("users" in data || "posts" in data || "myday" in data) saveFastCache();

        let newNotifSong = false;
        if (noticePath in data) {
          st.notifs = Object.values(data[noticePath] || {}).filter(Boolean).sort((a,b) => b.createdAt - a.createdAt);
          for (const n of st.notifs) {
            if (!st.seenNotifIds[n.id] && loaded.has(noticePath) && !n.read) newNotifSong = true;
            st.seenNotifIds[n.id] = true;
          }
        }
        let newMsgSong = false;
        if ("chats" in data) {
          st.chats = data.chats || {};
          for (const [rk, room] of Object.entries(st.chats)) {
            if (!rk.includes(st.me.id)) continue;
            for (const m of Object.values(room || {})) {
              if (!m) continue;
              if (!st.seenMsgIds[m.id] && loaded.has("chats") && m.senderId !== st.me.id) newMsgSong = true;
              st.seenMsgIds[m.id] = true;
            }
          }
        }

        let incomingCall = null;
        Object.values(data.calls || {}).forEach(c => {
          if (!c) return;
          if (c.status === "ringing" && c.toId === st.me.id && !st.seenCallIds[c.id]) { st.seenCallIds[c.id] = true; if (loaded.has("calls")) incomingCall = c; }
          if (st.activeCall && st.activeCall.id === c.id) { st.activeCall = c; if (c.status !== "ringing") stopRingLoop(); }
        });
        for (const path of Object.keys(data)) loaded.add(path);
        st.firstSync = !loaded.has("posts");

        if (incomingCall && !st.activeCall) { st.activeCall = incomingCall; startRingLoop("incoming"); openCallModal(incomingCall.id); }
        else if (newMsgSong) playSong("message");
        else if (newNotifSong) playSong("notif");

        if (st.chatUid && !st.me.hideSeen) markRoomSeen(st.chatUid);

        collectMatches();
        const unread = st.notifs.filter(n => !n.read).length + matches.filter(m => !m.read).length;
        const nb = document.getElementById("notifBadge");
        if (nb) { if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden"); }

        const activeEl = document.activeElement;
        const tag = activeEl ? activeEl.tagName : "";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) render();
        if (st.chatUid) renderMsgs();
        if (failedReads.size) showSyncStatus("ဒေတာအချို့ ရရှိပြီး။ ကျန်တာ ပြန်ယူနေသည်…");
        else showSyncStatus("တိုက်ရိုက်ချိတ်ဆက်ပြီး", true);
      } catch (error) {
        console.error("Sync update failed", error);
        showSyncStatus("ရရှိထားသော ဒေတာကို ပြသရာတွင် အမှားရှိသည်");
      } finally {
        clearTimeout(timeout);
        controller.abort();
        syncRunning = false;
        scheduleSync(nextSyncDelay);
      }
    }

    function notify(toId, text) {
      if (!toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function switchTab(t) {
      if (st.tab === "listing" && t !== "listing") {
        const url = new URL(location.href); url.searchParams.delete("post"); history.replaceState(null,"",url);
      }
      st.tab = t; playSong("notif");

      const a = document.getElementById("nav-" + t);

      else if (st.cat === "အသစ်ရောက်သူများ") list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      else list.sort((a, b) => feedScore(b) - feedScore(a));
      // Boosted posts (24h active) always stay at the very TOP

    const explore = { category: "", condition: "", price: "", available: false };
    function filterOptions(items, selected) {
      return '<option value="">အားလုံး</option>' + items.map(item =>
        `<option ${item === selected ? "selected" : ""}>${esc(item)}</option>`
      ).join("");
    }
    function parseKyat(input) {
      const digits = "၀၁၂၃၄၅၆၇၈၉";
      const text = String(input ?? "").replace(/[၀-၉]/g, d => digits.indexOf(d)).trim()
        .replace(/^(?:mmk|ကျပ်)\s*/i, "").replace(/\s*(?:ကျပ်|mmk)$/i, "").trim();
      const m = text.match(/^(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?\s*(သိန်း|သန်း|ထောင်)?$/);
      if (!m) return null;
      const units = { "ထောင်": 1000, "သိန်း": 100000, "သန်း": 1000000 };
      const value = Number(m[1].replace(/,/g, "") + (m[2] || "")) * (units[m[3]] || 1);
      return Number.isSafeInteger(value) ? value : null;
    }
    function searchMatches(post, filters) {
      if (filters.category && !matchesCategoryOrTag(post, filters.category)) return false;
      if (filters.condition && post.condition !== filters.condition) return false;
      if (filters.available && post.sold) return false;
      if (filters.price.trim()) {
        const limit = parseKyat(filters.price), price = parseKyat(post.price);
        if (price === null || limit === null || price > limit) return false;
      }
      return [post.text, post.tags, post.category, post.price, uInfo(post.authorId).name]
        .join(" ").toLowerCase().includes(filters.query.trim().toLowerCase());
    }

    function refreshExplore() {
      const invalid = explore.price.trim() !== "" && parseKyat(explore.price) === null;
      const filters = {...explore, query: st.q};
      const results = invalid ? [] : st.posts.filter(post => searchMatches(post, filters))
        .sort((a,b) => Number(isBoosted(b)) - Number(isBoosted(a)) || b.createdAt - a.createdAt);
      document.getElementById("resultCount").textContent = invalid
        ? "အများဆုံးဈေးကို 500,000 သို့မဟုတ် ၅ သိန်း လို့ ရိုက်ထည့်ပါ။"

    const watchKey = "ppw-searches-" + st.me.id;

      matches = Array.isArray(saved.matches) ? saved.matches : [];
    } catch {}
    function persistSearches() {
      try { localStorage.setItem(watchKey, JSON.stringify({watches, matches})); }
      catch { toast("ဒီဖုန်းမှာ ရှာဖွေမှုကို သိမ်းမရပါ။"); }

    }
    function saveSearch() {
      const filters = {...explore, query: st.q.trim()};
      const label = searchLabel(filters);
      if (!label) return toast("ရှာမယ့်စာသား သို့မဟုတ် စစ်ထုတ်ချက် ရွေးပါ။");
      if (filters.price.trim() && parseKyat(filters.price) === null) return toast("ဈေးနှုန်း ပြန်စစ်ပေးပါ။");
      if (watches.some(w => JSON.stringify(w.filters) === JSON.stringify(filters))) return toast("ဒီရှာဖွေမှုကို သိမ်းထားပြီးပါပြီ။");
      watches.push({filters, since: Date.now()}); persistSearches(); render();
    }
    function openSavedSearch(index) {
      const {query, ...filters} = watches[index].filters;

      if (!fresh.length) return;
      matches.unshift(...fresh.map(p => ({id:p.id, title:p.text || p.category, read:st.tab === "notifications"})));
      persistSearches();

    function verifyGpsLocation() {
      if (!navigator.geolocation) return toast("GPS မရနိုင်ပါ — မြို့နယ်ကို ကိုယ်တိုင်ရွေးပေးပါ");
      toast("Location စစ်ဆေးနေပါသည်...");
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        let guess = "အခြား";
        if (lat >= 16.5 && lat <= 17.3 && lon >= 95.8 && lon <= 96.6) guess = "ရန်ကုန်";
        else if (lat >= 21.7 && lat <= 22.3 && lon >= 95.8 && lon <= 96.4) guess = "မန္တလေး";
        else if (lat >= 20.5 && lat <= 21.1 && lon >= 96.8 && lon <= 97.4) guess = "တောင်ကြီး";
        else if (lat >= 21.1 && lat <= 21.6 && lon >= 99.4 && lon <= 99.9) guess = "ကျိုင်းတုံ";
        else if (lat >= 19.5 && lat <= 20.0 && lon >= 95.9 && lon <= 96.4) guess = "နေပြည်တော်";
        const sel = document.getElementById("pCity"); if (sel) sel.value = guess;
        toast("Location အတည်ပြုပြီး: " + guess);
      }, () => toast("Location ခွင့်ပြုချက် ပိတ်ထားပါသည်"));
    }

    function onPickCover(e) {

      const r = new FileReader();
      r.onload = ev => {

        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.me.coverPhoto = c.toDataURL("image/jpeg", 0.72);
          saveMe(); st.users[st.me.id] = st.me; playSong("like"); render(); toast("Cover ပုံ ပြောင်းပြီးပါပြီ");

        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);

    function setReaction(pid, rKey) {
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const prev = userReaction(p);
      REACTIONS.forEach(r => { if (p.reactions[r.key] && p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (p.likes && p.likes[st.me.id]) { delete p.likes[st.me.id]; fbDel(`posts/${pid}/likes/${st.me.id}`).catch(() => {}); }
      if (prev !== rKey) {

    async function changeDayReaction(id, key) {
      const day = st.myday.find(item => item.id === id);
      if (!day || day.authorId === st.me.id || Date.now() >= day.createdAt + 86400000 ||
          dayReactionPending.has(id) || !dayReactions.some(r => r.key === key)) return;
      const next = (day.reactions || {})[st.me.id] === key ? null : key;
      dayReactionPending.add(id);
      refreshDayReactions();
      try {
        const response = await fbPut(`myday/${encodeURIComponent(id)}/reactions/${encodeURIComponent(st.me.id)}`, next);
        if (!response.ok) throw new Error("write failed");
        dayReactionVersion++;
        const current = st.myday.find(item => item.id === id);
        if (current) {
          if (!current.reactions) current.reactions = {};
          if (next) current.reactions[st.me.id] = next;
          else delete current.reactions[st.me.id];
          saveFastCache();
        }
      } catch (error) {
        toast("Reaction သိမ်းမရသေးပါ။ ပြန်နှိပ်ကြည့်ပါ။");

        dayReactionPending.delete(id);
        refreshDayReactions();
      }
    }

    if(!grip)return;
    if(e.touches.length!==1 || !eligible()){cancel();return;}
    const p=e.touches[0], dy=p.clientY-grip.y, dx=Math.abs(p.clientX-grip.x);
    if(dy < -5 || (dx>8 && dx>dy)){cancel();return;}
    if(dy<=4){distance=0;indicator.hidden=true;return;}
    if(!e.cancelable){cancel();return;}
    e.preventDefault(); distance=dy; paint(distance);
  },{passive:false});
  main.addEventListener("touchend",()=>{
    const ready=grip && distance>=limit && eligible();
    cancel(); if(ready && !loading)refresh();
  },{passive:true});
  main.addEventListener("touchcancel",cancel,{passive:true});
})();
</script>
</body>
</html>
