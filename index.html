<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, 'Noto Sans Myanmar', 'Myanmar Text', 'Pyidaungsu', sans-serif; font-size: 16px; background: #05080f; color: #f8fafc; margin: 0; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp .18s ease-out forwards; }
    @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    .animate-slide-right { animation: slideRight .2s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes popIn { from { transform: scale(.75) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .animate-pop { animation: popIn .15s ease-out forwards; }

    .market-dock { position:fixed; bottom:0; left:0; right:0; z-index:30; width:100%; max-width:36rem; margin:auto; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center; padding:8px 8px calc(6px + env(safe-area-inset-bottom)); background:#101829; border-top:1px solid #334155; box-shadow:0 -6px 24px #03071255; }
    #app { padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
    .market-dock .nav-btn { position:relative; display:flex; min-width:0; min-height:56px; align-items:center; justify-content:center; flex-direction:column; gap:3px; color:#bac4d3; font-size:12px; font-weight:600; }
    .dock-orb { position:relative; display:grid; place-items:center; width:38px; height:38px; border-radius:50%; color:#fff; background:radial-gradient(circle at 28% 18%,hsl(var(--h) 88% 76%),transparent 50%),linear-gradient(135deg,hsl(var(--h) 72% 49%),hsl(calc(var(--h) + 34) 75% 30%)); box-shadow:inset 0 0 0 1px #ffffff45; filter:saturate(.62); transition:transform .3s ease,filter .2s; }
    .nav-btn[aria-current=page] { color:#fff; }
    .nav-btn[aria-current=page] .dock-orb { transform:translateY(-3px) scale(1.1); filter:saturate(1.1); box-shadow:0 0 0 2px #101829,0 0 0 3px hsl(var(--h) 76% 70%); }
    .rx-item { transition: transform .12s ease; user-select: none; -webkit-user-select: none; }
    .rx-item.rx-hover { transform: scale(1.45) translateY(-6px); }
    .story-ring { padding: 2.5px; border-radius: 9999px; background: linear-gradient(135deg, #34d399, #38bdf8, #f59e0b); box-shadow: 0 0 0 2px #0f172a; }
  </style>
</head>
<body class="bg-[#05080f] text-slate-100">

  <script>
    const DB = "https://phay-phay-wae-default-rtdb.asia-southeast1.firebasedatabase.app";
    const APP_URL = "https://pl2119728-create.github.io/phayphaywae/";
    const OWNER_ID = "PPW-565435";
    const ADMIN_NAME = "ပိုင်ဇော်ထက် (Paing Zaw Htet)";
    const ADMIN_PIN = "2026";
    const BOOST_PRICE_TEXT = "၂၀,၀၀၀ ကျပ် (၂၄ နာရီ Top တင်မည်)";
    const PAY_ACCOUNT_NAME = "ပိုင်ဇော်ထက် (Paing Zaw Htet)";
    const TELEGRAM_HANDLE = "@snap105";
    const TELEGRAM_URL = "https://t.me/snap105";
    const ACCOUNT_KEY = "ppw_main_account";
    const CACHE_KEY = "ppw_fast_cache_v7";

    const TRADE_CATS = ["Facebook Page", "YouTube Account", "TikTok Account", "Instagram / RedNote", "Monetized Page / Channel"];
    const FEED_FILTERS = ["အားလုံး", "စိတ်ဝင်စားမှုများ", "အသစ်ရောက်သူများ", ...TRADE_CATS];
    const QUICK_TAGS = ["#facebook", "#youtube", "#tiktok", "#monetized"];
    const QUICK_CHATS = ["ရှိသေးလား?", "နောက်ဆုံးဈေး ဘယ်လောက်လဲ?", "Insights ပုံပြပေးပါ", "Admin ကြားခံနဲ့ ယူမယ်"];
    const CITIES = ["ရန်ကုန်", "မန္တလေး", "တောင်ကြီး", "ကျိုင်းတုံ", "နေပြည်တော်", "ပဲခူး", "မော်လမြိုင်", "အခြား"];
    const COLORS = ["from-emerald-500 to-teal-600", "from-blue-500 to-indigo-600", "from-amber-500 to-orange-600", "from-rose-500 to-pink-600", "from-purple-500 to-violet-600"];
    const PRIVACY_OPTS = [
      { key: "everyone", icon: "🌍", label: "Everyone (အားလုံး)" },
      { key: "friends", icon: "👥", label: "Friends (မိတ်ဆွေများ)" },
      { key: "onlyme", icon: "🔒", label: "Only Me (မိမိတစ်ဦးတည်း)" }
    ];
    const REACTIONS = [
      { key: "like", icon: "👍", label: "Like", textClass: "text-blue-400" },
      { key: "love", icon: "❤️", label: "Love", textClass: "text-rose-400" },
      { key: "haha", icon: "😂", label: "Haha", textClass: "text-amber-400" },
      { key: "angry", icon: "😡", label: "Angry", textClass: "text-orange-400" }
    ];
    const MYDAY_REACTIONS = [
      { key: "like", icon: "👍", label: "Like" },
      { key: "love", icon: "❤️", label: "Love" },
      { key: "haha", icon: "😂", label: "Haha" }
    ];
    const STICKER_ICONS = ["🛍️", "✨", "🎉", "🙏", "🚀", "💙", "🤝", "🎁", "🥰", "🔥", "💯", "👍"];
    const BLOCKED_PHYSICAL = ["အဝတ်အစား", "ရှပ်အင်္ကျီ", "ဘောင်းဘီ", "ဖိနပ်", "ထဘီ", "ပုဆိုး", "shirt", "pants", "clothes", "dress", "shoes"];
    const RULES = [
      "Facebook Page၊ YouTube Account၊ TikTok Account စသည့် အကောင့်/ပိုင်ဆိုင်မှု ရောင်းဝယ်မှုများကိုသာ တင်ရမည်။ အဝတ်အစားနှင့် မသက်ဆိုင်သော ပစ္စည်းများ ခွင့်မပြုပါ။",
      "MyDay ကို တင်မည့်အချိန် (၆ နာရီ မှ ၄၈ နာရီ) ရွေးချယ်တင်နိုင်ပြီး ဝင်ကြည့်သူစာရင်း (Views)၊ Reaction နှင့် ဖျက်ခလုတ် (Delete) ပါဝင်သည်။",
      "Blue Mark (အတည်ပြု အမှတ်အသား) ကို Menu ထဲမှတစ်ဆင့် အခမဲ့ လျှောက်ထားနိုင်ပြီး Admin (ကိုပိုင်ဇော်ထက်) စိစစ်အတည်ပြုပေးပါမည်။",
      "Boost တင်လိုပါက တစ်ရက် (၂၄ နာရီ) ၂၀,၀၀၀ ကျပ်ဖြင့် KPay/Wave (ပိုင်ဇော်ထက်) သို့ လွှဲပြီး ပြေစာကို @snap105 Telegram သို့ ပို့ရမည်။"
    ];

    function normalizeUser(s) {
      if (!s || !s.id) return null;
      const isOwner = s.id === OWNER_ID;
      return {
        id: s.id,
        name: s.name || ("အသုံးပြုသူ #" + String(s.id).slice(-4)),
        bio: s.bio || "ဖြေးဖြေး ဝယ် မှာ Page / Account များ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။",
        telegram: s.telegram || "",
        phone: s.phone || "",
        password: s.password || "",
        photo: s.photo || "",
        coverPhoto: s.coverPhoto || "",
        note: s.note || "",
        noteAt: s.noteAt || 0,
        city: s.city || "",
        gender: s.gender || "",
        age: s.age || "",
        blueMark: isOwner ? true : !!s.blueMark,
        appealStatus: s.appealStatus || "none",
        isAdmin: isOwner ? true : !!s.isAdmin,
        color: s.color || COLORS[0],
        friends: Array.isArray(s.friends) ? s.friends : [],
        following: Array.isArray(s.following) ? s.following : [],
        createdAt: s.createdAt || Date.now()
      };
    }

    function getStoredUser() {
      const keys = [ACCOUNT_KEY, "ppw_user_v6", "ppw_user_v5", "ppw_user_v4", "ppw_user_v3", "ppw_user_v2", "ppw_user_v1"];
      for (const k of keys) {
        try {
          const s = JSON.parse(localStorage.getItem(k));
          const norm = normalizeUser(s);
          if (norm) {
            try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(norm)); } catch (e) {}
            return norm;
          }
        } catch (e) {}
      }
      return null;
    }

    let cached = { posts: [], myday: [], users: {} };
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)) || cached; } catch (e) {}

    let st = {
      tab: "home",
      viewProfileUid: null,
      adminFilter: "pending",
      authMode: "login",
      me: getStoredUser(),
      posts: Array.isArray(cached.posts) ? cached.posts : [],
      myday: Array.isArray(cached.myday) ? cached.myday : [],
      users: cached.users || {},
      presence: {}, reviews: {}, appeals: {}, boostRequests: {},
      notifs: [], chats: {}, typing: {},
      cat: "အားလုံး", q: "", fq: "",
      openCmt: {}, deletedIds: {}, viewedThisSession: {},
      img: null, mydayImg: null, chatImg: null,
      chatUid: null, showStickers: false,
      nightMode: false, soundOn: true, audioCtx: null,
      seenMsgIds: {}, seenNotifIds: {}, firstSync: true,
      recorder: null, audioChunks: [],
      rxTimer: null, rxActivePid: null, rxHovered: null, rxTriggered: false
    };

    const saveMe = () => { if (st.me) try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(st.me)); } catch (e) {} };
    function saveFastCache() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          posts: st.posts.slice(0, 35),
          myday: st.myday.slice(0, 15),
          users: st.users
        }));
      } catch (e) {}
    }
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt);
      window._tt = setTimeout(() => el.classList.add("hidden"), 2500);

    // =========================================================================
    // AUTHENTICATION (Phone Number OR User ID + Password)

    function cleanPhone(raw) { return String(raw || "").replace(/[^0-9]/g, ""); }
    function setAuthMode(mode) {
      st.authMode = mode;
      const isReg = mode === "register";
      document.getElementById("authNameWrap").classList.toggle("hidden", !isReg);
      document.getElementById("authPhoneLabel").textContent = isReg ? "ဖုန်းနံပါတ်" : "ဖုန်းနံပါတ် (သို့) User ID";
      document.getElementById("authPhone").placeholder = isReg ? "09xxxxxxxxx" : "09xxxxxxxxx သို့မဟုတ် PPW-xxxxxx";
      document.getElementById("authSubmitBtn").textContent = isReg ? "အကောင့်အသစ် ဖွင့်မည်" : "ဝင်ရောက်မည်";
      document.getElementById("authTabLogin").className = `py-2.5 rounded-xl text-sm font-bold transition ${!isReg ? "bg-emerald-600 text-white" : "text-slate-400"}`;
      document.getElementById("authTabReg").className = `py-2.5 rounded-xl text-sm font-bold transition ${isReg ? "bg-emerald-600 text-white" : "text-slate-400"}`;

    }
    function showAuthErr(msg) {
      const el = document.getElementById("authErr");
      el.textContent = msg;
      el.classList.remove("hidden");
    }
    async function submitAuth() {
      const rawInput = (document.getElementById("authPhone").value || "").trim();
      const phone = cleanPhone(rawInput);
      const upperId = rawInput.toUpperCase();
      const pass = (document.getElementById("authPass").value || "").trim();
      const name = (document.getElementById("authName").value || "").trim();
      const btn = document.getElementById("authSubmitBtn");

      const isIdLogin = st.authMode === "login" && upperId.startsWith("PPW-");
      if (!isIdLogin && phone.length < 7) return showAuthErr("ဖုန်းနံပါတ် (သို့) User ID မှန်ကန်စွာ ထည့်ပေးပါ");
      if (pass.length < 4) return showAuthErr("Password အနည်းဆုံး ၄ လုံး ထည့်ပေးပါ");
      if (st.authMode === "register" && !name) return showAuthErr("သင့်နာမည် ထည့်ပေးပါ");

      btn.disabled = true;
      btn.textContent = "စစ်ဆေးနေသည်...";
      document.getElementById("authErr").classList.add("hidden");

      try {
        const allUsers = (await fbGet("users")) || {};
        st.users = allUsers;
        const userList = Object.values(allUsers).filter(Boolean);

        if (st.authMode === "register") {
          const exists = userList.find(u => cleanPhone(u.phone) === phone);
          if (exists) {
            btn.disabled = false; btn.textContent = "အကောင့်အသစ် ဖွင့်မည်";
            return showAuthErr("ဤဖုန်းနံပါတ်ဖြင့် အကောင့်ဖွင့်ပြီးသား ရှိနေပါသည် — အကောင့်ဝင်ရန် မှ ဝင်ပါ");
          }
          const n = Math.floor(100000 + Math.random() * 900000);
          const newUser = normalizeUser({
            id: "PPW-" + n, name, phone, password: pass,
            color: COLORS[n % COLORS.length], createdAt: Date.now()
          });
          await fbPut(`users/${newUser.id}`, newUser);
          st.me = newUser;
          st.users[newUser.id] = newUser;
          saveMe();
          document.getElementById("authScreen").classList.add("hidden");
          playSong("upload");
          toast("✓ အကောင့်အသစ် ဖွင့်ပြီးပါပြီ");
          render();
          sync(true);
        } else {
          let matches = isIdLogin
            ? userList.filter(u => u.id === upperId)
            : userList.filter(u => cleanPhone(u.phone) === phone);

          if (!matches.length) {
            btn.disabled = false; btn.textContent = "ဝင်ရောက်မည်";
            return showAuthErr("အကောင့်မတွေ့ပါ — ဖုန်းနံပါတ် ပြန်စစ်ပါ (သို့) အကောင့်အသစ်ဖွင့်ပါ");
          }

          matches.sort((a, b) => {
            const pScore = (u) => (u.password === pass ? 1000 : 0) + (u.id === OWNER_ID ? 500 : 0) + (u.isAdmin ? 200 : 0) + (u.blueMark ? 100 : 0) + ((u.friends || []).length * 10);
            return pScore(b) - pScore(a);
          });
          const matched = matches[0];

          if (matched.password && matched.password !== pass) {
            btn.disabled = false; btn.textContent = "ဝင်ရောက်မည်";
            return showAuthErr("Password မှားယွင်းနေပါသည်");
          }
          const loggedIn = normalizeUser({ ...matched, password: matched.password || pass });
          if (!matched.password) await fbPut(`users/${loggedIn.id}/password`, pass).catch(() => {});
          st.me = loggedIn;
          saveMe();
          document.getElementById("authScreen").classList.add("hidden");
          playSong("like");
          toast(`မင်္ဂလာပါ ${loggedIn.name} ✓`);
          render();
          sync(true);
        }
      } catch (e) {
        showAuthErr("အင်တာနက် ချိတ်ဆက်မှု စစ်ဆေးပြီး ပြန်စမ်းပေးပါ");
      } finally {
        btn.disabled = false;
        btn.textContent = st.authMode === "register" ? "အကောင့်အသစ် ဖွင့်မည်" : "ဝင်ရောက်မည်";
      }
    }
    function logoutAccount() {
      if (!confirm("အကောင့်မှ ထွက် (Logout) မှာ သေချာပါသလား?")) return;
      updateMyPresence(false);
      localStorage.removeItem(ACCOUNT_KEY);
      st.me = null;
      closeSideMenu();
      closeModal();
      document.getElementById("authScreen").classList.remove("hidden");
      setAuthMode("login");
    }

    function formatTelegramUrl(raw) {
      const v = String(raw || "").trim();
      if (!v) return "";
      if (v.startsWith("http://") || v.startsWith("https://")) return v;
      if (v.startsWith("t.me/")) return "https://" + v;
      return "https://t.me/" + v.replace(/^@+/, "");
    }
    function formatTelegramDisplay(raw) {
      const v = String(raw || "").trim();
      if (!v) return "";
      if (v.startsWith("http")) return v.replace(/^https?:\/\/(www\.)?/, "");
      return v.startsWith("@") ? v : "@" + v.replace(/^t\.me\//, "");
    }

    function setUploadStatus(show, text = "ပို့စ်တင်နေသည်...") {
      const bar = document.getElementById("uploadStatusBar");
      const txt = document.getElementById("uploadStatusText");
      if (!bar) return;
      if (txt) txt.textContent = text;

    function copyText(text, successMsg) {
      const done = () => { playSong("notif"); toast(successMsg || "Copy ကူးပြီးပါပြီ"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else fallbackCopy(text, done);
    }
    function fallbackCopy(text, cb) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); cb();
      } catch (e) { prompt("Copy ကူးရန်:", text); }
    }
    function copyUserId(id) { copyText(id || (st.me && st.me.id) || "", `ID (${id || (st.me && st.me.id)}) ကူးပြီးပါပြီ ✓`); }

    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }
    function remainingHours(untilTs) {
      const ms = Number(untilTs || 0) - Date.now();
      return ms <= 0 ? "" : Math.ceil(ms / 3600000) + " နာရီကျန်";
    }
    function formatClock(ts) {
      if (!ts) return "";
      return new Date(Number(ts)).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    // Active Story Helper (for double ring on avatars)
    function getActiveMyDay(uid) {
      const now = Date.now();
      return st.myday.find(d => d && d.authorId === uid && Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000)) > now) || null;
    }

    // Exact Online / Offline with Offline Time
    function parsePresence(uid) {
      if (st.me && uid === st.me.id) return { online: true, lastSeen: Date.now() };
      const raw = st.presence[uid];
      if (!raw) return { online: false, lastSeen: 0 };
      if (typeof raw === "number") return { online: (Date.now() - raw < 18000), lastSeen: raw };
      const lastSeen = Number(raw.lastSeen || 0);
      const online = raw.online !== false && lastSeen > 0 && (Date.now() - lastSeen < 18000);
      return { online, lastSeen };
    }
    function isOnline(uid) { return parsePresence(uid).online; }
    function onlineText(uid) {
      const p = parsePresence(uid);
      if (p.online) return "🟢 Active Now";
      if (p.lastSeen) return `⚫ Offline • ဆင်းချိန် ${formatClock(p.lastSeen)} (${ago(p.lastSeen)})`;
      return "⚫ Offline";
    }
    function updateMyPresence(isOnlineNow) {
      if (!st.me) return;

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!st.audioCtx) st.audioCtx = new AC();
        if (st.audioCtx.state === "suspended") st.audioCtx.resume().catch(() => {});
        return st.audioCtx;
      } catch (e) { return null; }
    }
    document.addEventListener("pointerdown", () => { if (st.soundOn) ensureAudio(); }, { passive: true });
    function playSong(kind) {
      if (!st.soundOn) return;
      const ctx = ensureAudio(); if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const seq =
          kind === "upload" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "message" ? [659.25, 880, 1046.5] :
          kind === "love" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "angry" ? [220, 165] : [523.25, 783.99];
        seq.forEach((f, idx) => {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = kind === "upload" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          g.gain.setValueAtTime(0.001, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.08 + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.2);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.22);
        });
      } catch (e) {}
    }

    function engagementScore(p) { return totalReactions(p) * 3 + Object.keys((p && p.comments) || {}).length * 5; }
    function feedScore(p) {
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      return engagementScore(p) * 2.5 + (24 / (1 + ageHours * 0.25)) + (isNewUser(p.authorId) ? 6 : 0);
    }
    function matchesCategoryOrTag(p, f) {
      if (!f || f === "အားလုံး" || f === "စိတ်ဝင်စားမှုများ" || f === "အသစ်ရောက်သူများ") return true;
      const txt = ((p.text || "") + " " + (p.tags || "")).toLowerCase();
      if (f === "YouTube Account") return p.category === "YouTube Account" || txt.includes("#youtube");
      if (f === "Facebook Page") return p.category === "Facebook Page" || txt.includes("#facebook") || txt.includes("#fb");
      if (f === "TikTok Account") return p.category === "TikTok Account" || txt.includes("#tiktok");
      return p.category === f;
    }
    function hasBlockedClothing(str) {
      const low = String(str || "").toLowerCase();
      return BLOCKED_PHYSICAL.some(k => low.includes(k));
    }

    async function fbGet(path, query = "") {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      try {
        const res = await fetch(`${DB}/${path}.json${query}`, { signal: controller.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    function countUnreadChats() {
      if (!st.me) return 0;
      let unreadMsgs = 0;
      Object.entries(st.chats || {}).forEach(([rk, mObj]) => {
        if (!rk.includes(st.me.id)) return;
        const oid = rk.split("__").find(x => x !== st.me.id);
        if (st.chatUid && st.chatUid === oid) return;
        Object.values(mObj || {}).forEach(m => {
          if (m && m.senderId !== st.me.id && !m.seenAt && !(m.deletedFor && m.deletedFor[st.me.id])) {
            unreadMsgs++;
          }
        });
      });
      return unreadMsgs;
    }

    let syncBusy = false;
    async function sync(init = false) {
      if (!st.me || syncBusy) return;
      syncBusy = true;
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncText");
      try {
        updateMyPresence(true);
        if (init) fbPut(`users/${st.me.id}`, st.me).catch(() => {});

        const [ch, no, ty, po] = await Promise.all([
          fbGet("chats").catch(() => null),
          fbGet(`notifications/${st.me.id}`).catch(() => null),
          fbGet("typing").catch(() => null),
          fbGet("posts", '?orderBy="$key"&limitToLast=45').catch(() => null)
        ]);

        if (ch) {
          let newMsgSong = false;
          Object.entries(ch).forEach(([rk, mObj]) => {
            if (!rk.includes(st.me.id)) return;
            Object.values(mObj || {}).forEach(m => {
              if (m && !st.seenMsgIds[m.id]) {
                st.seenMsgIds[m.id] = true;
                if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true;
              }
            });
          });
          st.chats = ch;
          if (newMsgSong) playSong("message");
        }

        if (no) {
          const nextNotifs = Object.values(no).filter(Boolean).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          let newNotifSong = false;
          nextNotifs.forEach(n => { if (!st.seenNotifIds[n.id]) { st.seenNotifIds[n.id] = true; if (!st.firstSync && !n.read) newNotifSong = true; } });
          st.notifs = nextNotifs;
          if (newNotifSong) playSong("notif");
        }

        if (ty) st.typing = ty;

        if (po) {
          const rawPosts = Object.values(po);
          const localPending = st.posts.filter(p => p && p._uploading && !po[p.id]);
          const serverPosts = rawPosts.filter(p => p && !st.deletedIds[p.id] && TRADE_CATS.includes(p.category) && !hasBlockedClothing(p.text) && (p.text || p.image));
          st.posts = [...localPending, ...serverPosts];
        }

        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-400";
        if (txt) txt.textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";

        const pendingTags = st.posts.filter(p => p && p.taggedUserId === st.me.id && p.tagStatus === "pending").length;
        const unreadNotif = st.notifs.filter(n => !n.read).length + pendingTags;
        const nb = document.getElementById("notifBadge");
        if (nb) { if (unreadNotif > 0) { nb.textContent = unreadNotif > 99 ? "99+" : unreadNotif; nb.classList.remove("hidden"); } else nb.classList.add("hidden"); }

        const unreadChat = countUnreadChats();
        const cb = document.getElementById("chatBadge");
        if (cb) { if (unreadChat > 0) { cb.textContent = unreadChat > 99 ? "99+" : unreadChat; cb.classList.remove("hidden"); } else cb.classList.add("hidden"); }

        if (st.chatUid) markRoomSeen(st.chatUid);

        const activeNow = document.activeElement;
        const tag = activeNow ? activeNow.tagName : "";
        const isTypingMsg = activeNow && activeNow.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag) && !st.rxActivePid) {
          render();
          if (st.chatUid) renderMsgs();
        } else if (st.chatUid && !isTypingMsg) {
          renderMsgs();
        } else if (st.chatUid) {
          renderTypingBanner();
        }

        const [md, us, pr, rv, ap, br] = await Promise.all([
          fbGet("myday", '?orderBy="$key"&limitToLast=25').catch(() => null),
          fbGet("users").catch(() => null),
          fbGet("presence").catch(() => null),
          fbGet("reviews").catch(() => null),
          fbGet("appeals").catch(() => null),
          fbGet("boostRequests").catch(() => null)
        ]);

        const now = Date.now();
        if (md) {
          st.myday = Object.values(md).filter(d => {
            if (!d) return false;
            const exp = Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000));
            return exp > now;
          }).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }
        if (us) {
          st.users = us;
          if (st.users[st.me.id]) {
            st.me.blueMark = st.me.id === OWNER_ID ? true : !!st.users[st.me.id].blueMark;
            st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
            if (st.users[st.me.id].isAdmin || st.me.id === OWNER_ID) st.me.isAdmin = true;
            if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
            if (!st.me.coverPhoto && st.users[st.me.id].coverPhoto) st.me.coverPhoto = st.users[st.me.id].coverPhoto;
            if (!st.me.telegram && st.users[st.me.id].telegram) st.me.telegram = st.users[st.me.id].telegram;
            if (Array.isArray(st.users[st.me.id].friends) && st.users[st.me.id].friends.length > (st.me.friends || []).length) {
              st.me.friends = st.users[st.me.id].friends;
            }
            saveMe();
          }
        }
        st.users[st.me.id] = st.me;
        if (pr) st.presence = pr;
        if (rv) st.reviews = rv;
        if (ap) st.appeals = ap;
        if (br) st.boostRequests = br;
        st.firstSync = false;
        saveFastCache();
      } catch (e) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-400";
        if (txt) txt.textContent = "ချိတ်ဆက်မှု ပြန်စမ်းနေသည်…";
      } finally {
        syncBusy = false;
      }
    }

    function notify(toId, text) {
      if (!st.me || !toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function updateDockHighlight() {
      document.querySelectorAll(".nav-btn").forEach(b => { b.removeAttribute("aria-current"); b.classList.remove("text-emerald-400"); b.classList.add("text-slate-400"); });
      const a = document.getElementById("nav-" + st.tab);
      if (a) { a.setAttribute("aria-current", "page"); a.classList.remove("text-slate-400"); a.classList.add("text-emerald-400"); }
    }

    function switchTab(t) {
      st.tab = t; st.viewProfileUid = null; playSong("notif"); updateDockHighlight();
      if (t === "notifications") {
        st.notifs.filter(n => !n.read).forEach(n => { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); });
        const nb = document.getElementById("notifBadge"); if (nb) nb.classList.add("hidden");
      }
      render(); window.scrollTo(0, 0);
    }

    function openUserProfile(uid) {
      if (!st.me) return;
      closeModal(); closeSideMenu();
      if (uid === st.me.id) { switchTab("profile"); return; }
      st.viewProfileUid = uid; st.tab = "userProfile";
      updateDockHighlight(); render(); window.scrollTo(0, 0);

    // Click avatar on Newsfeed: opens Story if active, otherwise opens Profile
    function onFeedAvatarClick(uid) {
      const md = getActiveMyDay(uid);
      if (md) viewMyDay(md.id);
      else openUserProfile(uid);
    }

    function getFilteredPosts() {
      let list = st.posts.filter(canSeePost);
      if (st.cat === "စိတ်ဝင်စားမှုများ") list.sort((a, b) => engagementScore(b) - engagementScore(a));
      else if (st.cat === "အသစ်ရောက်သူများ") list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      else if (st.cat !== "အားလုံး") list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      list.sort((a, b) => (isBoosted(b) ? 1 : 0) - (isBoosted(a) ? 1 : 0));
      return list;
    }

      const allFri = Array.isArray(u.friends) ? u.friends : [];

        </div>

    }

    function renderMyDayStrip() {
      const now = Date.now();
      const activeDays = st.myday.filter(d => d && Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000)) > now);
      return `<div class="bg-[#0f172a] px-3.5 py-3 border-b border-slate-800"><div class="flex items-center gap-3.5 overflow-x-auto no-scrollbar"><button onclick="openMyDayModal()" class="flex flex-col items-center gap-1.5 shrink-0"><div class="w-[60px] h-[60px] rounded-full bg-emerald-500/20 border-2 border-dashed border-emerald-400 text-emerald-300 flex items-center justify-center text-2xl font-bold">+</div><span class="text-xs font-bold text-emerald-300">MyDay</span></button>${activeDays.map(d => { const du = uInfo(d.authorId); const vCnt = Object.keys(d.viewers || {}).length; return `<button onclick="viewMyDay('${d.id}')" class="flex flex-col items-center gap-1 shrink-0 max-w-[76px] relative"><div class="story-ring">${avatar(du, "w-14 h-14 text-base", false, false)}</div>${vCnt > 0 ? `<span class="absolute top-0 right-0 px-1.5 rounded-full bg-black/80 text-[10px] text-emerald-300 font-bold border border-emerald-500/40">👁️${vCnt}</span>` : ""}<span class="text-xs font-semibold text-slate-200 truncate w-full text-center">${esc(du.name)}</span></button>`; }).join("")}</div></div>`;
    }

    function onQuickGalleryPost(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          openComposerModal(c.toDataURL("image/jpeg", 0.74));
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
      e.target.value = "";
    }

                </div>`}
            </div>
          </div>

    function hideAllRxPickers() {

    function onLikeTouchStart(e, pid) {
      st.rxTriggered = false; clearTimeout(st.rxTimer);
      st.rxTimer = setTimeout(() => { st.rxTriggered = true; showRxPicker(pid); if (navigator.vibrate) navigator.vibrate(20); }, 280);
    }
    function onLikeTouchMove(e) {
      if (!st.rxActivePid || !e.touches || !e.touches[0]) return;
      e.preventDefault();
      const t = e.touches[0], target = document.elementFromPoint(t.clientX, t.clientY), item = target ? target.closest(".rx-item") : null;
      document.querySelectorAll(".rx-hover").forEach(el => el.classList.remove("rx-hover"));
      if (item && item.dataset.rx) { item.classList.add("rx-hover"); st.rxHovered = item.dataset.rx; } else st.rxHovered = null;
    }
    function onLikeTouchEnd(e, pid) {
      clearTimeout(st.rxTimer);
      if (st.rxTriggered) { e.preventDefault(); if (st.rxHovered) { const chosen = st.rxHovered; hideAllRxPickers(); setReaction(pid, chosen); } return; }
      const p = st.posts.find(x => x.id === pid);
      setReaction(pid, userReaction(p) || "like");
    }

      if (e.button !== 0) return;

    function onLikeMouseUp(e, pid) {

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.img = c.toDataURL("image/jpeg", 0.74);
          const area = document.getElementById("largePhotoArea");
          if (area) area.innerHTML = `<div class="relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-900"><img id="imgPrev" src="${st.img}" class="w-full max-h-56 object-contain mx-auto"/><button onclick="clearComposerImg()" class="absolute top-2 right-2 px-3 py-1.5 rounded-full bg-black/80 text-white text-sm font-bold border border-white/20">✕ ပုံဖျက်</button></div>`;
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    function verifyGpsLocation() {
      if (!navigator.geolocation) return toast("GPS မရနိုင်ပါ — မြို့နယ်ကို ကိုယ်တိုင်ရွေးပေးပါ");
      toast("Location စစ်ဆေးနေပါသည်...");
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        let guess = "အခြား";
        if (lat >= 16.5 && lat <= 17.3 && lon >= 95.8 && lon <= 96.6) guess = "ရန်ကုန်";
        else if (lat >= 21.7 && lat <= 22.3 && lon >= 95.8 && lon <= 96.4) guess = "မန္တလေး";
        else if (lat >= 20.5 && lat <= 21.1 && lon >= 96.8 && lon <= 97.4) guess = "တောင်ကြီး";
        else if (lat >= 21.1 && lat <= 21.6 && lon >= 99.4 && lon <= 99.9) guess = "ကျိုင်းတုံ";
        else if (lat >= 19.5 && lat <= 20.0 && lon >= 95.9 && lon <= 96.4) guess = "နေပြည်တော်";
        const sel = document.getElementById("pCity"); if (sel) sel.value = guess;
        toast("Location အတည်ပြုပြီး: " + guess);
      }, () => toast("Location ခွင့်ပြုချက် ပိတ်ထားပါသည်"));
    }

      markRoomSeen(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center">
          <div class="bg-[#0b1120] border border-slate-700 w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col h-[92vh] animate-slide-up overflow-hidden">
            <div class="px-3.5 py-3 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between gap-2">
              <div onclick="openUserProfile('${o.id}')" class="flex items-center gap-2.5 cursor-pointer min-w-0">
                ${avatar(o, "w-11 h-11 text-base", true, true)}
                <div class="min-w-0">
                  <div class="text-base font-bold text-white truncate flex items-center gap-1">${esc(o.name)} ${blueBadge(o)}</div>
                  <div class="text-xs font-semibold truncate ${isOnline(o.id) ? "text-emerald-400" : "text-slate-400"}">${esc(onlineText(o.id))}</div>
                </div>
              </div>
              <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold shrink-0">✕</button>
            </div>
            <div id="msgBox" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 bg-[#05080f]"></div>
            <div id="typingBanner" class="hidden px-3 py-1 bg-[#05080f]"></div>
            <div id="msgActionBar"></div>
            <div class="px-3 py-2 bg-[#0b1120] border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto no-scrollbar">
              ${QUICK_CHATS.map(q => `<button onclick="sendQuickChat('${q}')" class="px-3 py-1.5 rounded-full bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 text-xs text-slate-200 whitespace-nowrap shrink-0">${q}</button>`).join("")}
            </div>
            <div id="stickerBar" class="hidden p-2.5 bg-[#0f172a] border-t border-slate-800 grid grid-cols-6 gap-2">${STICKER_ICONS.map(ic => `<button onclick="sendStickerIcon('${ic}')" class="bg-slate-900 border border-slate-700 rounded-xl py-2.5 text-2xl">${ic}</button>`).join("")}</div>
            <div id="chatAttachPreview" class="hidden px-3 py-2 bg-[#0f172a] border-t border-slate-800 flex items-center justify-between"><div id="chatAttachLabel" class="flex items-center gap-2 text-xs text-emerald-300 font-bold"></div><button onclick="clearChatAttach()" class="text-sm text-rose-400 font-bold">✕</button></div>
            <div class="p-2.5 bg-[#0f172a] border-t border-slate-800 flex items-center gap-2">
              <label class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center cursor-pointer shrink-0 active:scale-95 transition">🖼️<input type="file" accept="image/*" onchange="onPickChatImg(event)" class="hidden"/></label>
              <button onclick="toggleVoiceRec()" id="voiceBtn" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center shrink-0 active:scale-95 transition">🎙️</button>
              <div class="flex-1 min-w-0 h-11 bg-slate-900 border border-slate-700 rounded-full flex items-center pl-4 pr-1.5 gap-1">
                <input id="msgInp" type="text" placeholder="Message..." oninput="sendTyping('${oid}')" onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 min-w-0 bg-transparent text-white text-base focus:outline-none"/>
                <button onclick="toggleStickerBar()" class="w-9 h-9 rounded-full hover:bg-slate-800 text-sky-400 text-xl flex items-center justify-center shrink-0">😄</button>
              </div>
              <button onclick="sendMsg()" class="h-11 px-4 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shrink-0 active:scale-95 transition">ပို့</button>
            </div>
          </div>
        </div>`;
      renderMsgs();
    }

    function clearChatAttach() { st.chatImg = null; const p = document.getElementById("chatAttachPreview"); if (p) p.classList.add("hidden"); }
    function onPickChatImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), mw = 640; let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; } c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h); st.chatImg = c.toDataURL("image/jpeg", 0.72); document.getElementById("chatAttachLabel").innerHTML = `<img src="${st.chatImg}" class="w-10 h-10 rounded-lg object-cover"/><span>ဓာတ်ပုံ</span>`; document.getElementById("chatAttachPreview").classList.remove("hidden"); }; im.src = ev.target.result; };
      r.readAsDataURL(f);
    }
    async function toggleVoiceRec() {
      const btn = document.getElementById("voiceBtn");
      if (st.recorder && st.recorder.state === "recording") { st.recorder.stop(); if (btn) btn.className = "w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center shrink-0"; return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("အသံသွင်းစနစ် မရနိုင်ပါ");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = []; const rec = new MediaRecorder(stream); st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); const r = new FileReader(); r.onloadend = () => { if (st.chatUid) sendChatPayload({ text: "", image: "", audio: r.result }); }; r.readAsDataURL(new Blob(st.audioChunks, { type: "audio/webm" })); };
        rec.start(); toast("အသံသွင်းနေပါသည်... ပို့ရန် 🎙️ ကို ထပ်နှိပ်ပါ");
        if (btn) btn.className = "w-11 h-11 rounded-full bg-rose-600 text-white text-xl flex items-center justify-center animate-pulse shrink-0";
      } catch (e) { toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်"); }
    }
    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).filter(m => m && !(m.deletedFor && m.deletedFor[st.me.id])).sort((a, b) => a.createdAt - b.createdAt);
      box.innerHTML = ms.length ? ms.map(m => {
        const me = m.senderId === st.me.id, isPureSticker = !m.deletedForAll && !m.image && !m.audio && STICKER_ICONS.includes((m.text || "").trim());
        const tick = me ? (m.seenAt ? `<span class="text-sky-200 font-bold">✓✓</span>` : `<span class="text-emerald-200/80 font-bold">✓</span>`) : "";
        return `<div class="flex items-end ${me ? "justify-end" : "justify-start"}"><div onclick="openDeleteMsgMenu('${m.id}')" class="cursor-pointer ${isPureSticker ? "text-5xl py-1 px-2" : `max-w-[82%] px-4 py-2.5 rounded-2xl text-base space-y-1 ${me ? "bg-emerald-600 text-white" : "bg-[#0f172a] border border-slate-800 text-slate-100"}`}">${m.deletedForAll ? `<div class="italic text-xs opacity-75">🚫 ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ</div>` : `${m.image ? `<img onclick="event.stopPropagation();openImageViewer(this.src)" src="${m.image}" class="rounded-xl max-h-56 object-cover cursor-zoom-in"/>` : ""}${m.audio ? `<audio controls src="${m.audio}" class="w-52 h-9"></audio>` : ""}${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}`}${me ? `<div class="text-[11px] text-right leading-none">${tick}</div>` : ""}</div></div>`;
      }).join("") : `<p class="text-sm text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;
      renderTypingBanner();
    }
    function sendChatPayload({ text, image, audio }) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), mid = "M-" + Date.now();
      const m = { id: mid, senderId: st.me.id, text: text || "", image: image || "", audio: audio || "", seenAt: 0, deletedFor: {}, deletedForAll: false, createdAt: Date.now() };
      if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
      clearChatAttach(); fbPut(`typing/${rid}/${st.me.id}`, 0).catch(() => {}); renderMsgs();
      notify(st.chatUid, "က စာပို့လိုက်သည်"); fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }
    function sendMsg() {
      const inp = document.getElementById("msgInp"); if (!inp || !st.chatUid) return;
      const text = inp.value.trim(); if (!text && !st.chatImg) return;
      sendChatPayload({ text, image: st.chatImg || "", audio: "" }); inp.value = "";
    }
    function closeModal() {
      if (st.chatUid && st.me) fbPut(`typing/${roomId(st.me.id, st.chatUid)}/${st.me.id}`, 0).catch(() => {});
      if (st.recorder && st.recorder.state === "recording") { try { st.recorder.stop(); } catch (e) {} }
      st.chatUid = null; st.showStickers = false;
      document.getElementById("modalRoot").innerHTML = "";
    }

    if (!st.me) {
      document.getElementById("authScreen").classList.remove("hidden");
      setAuthMode("login");
    } else {
      render();
      sync(true);
    }
    setInterval(() => { if (st.me) sync(false); }, 1500);
  </script>
</body>
</html>
