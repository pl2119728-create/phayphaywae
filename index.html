    // Swipeable Full-Screen Image Gallery (No Arrow Buttons)
    function openGalleryViewer(pid, startIdx = 0) {
      const p = st.posts.find(x => x.id === pid), imgs = getPostImages(p); if (!imgs.length) return;

    function renderGalleryModal() {
      const g = window._gal; if (!g) return;
      document.getElementById("modalRoot").innerHTML = `<div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-between p-4 select-none"><div class="w-full max-w-lg flex items-center justify-between text-white"><span class="text-sm font-bold bg-slate-800/90 px-3 py-1 rounded-full">${g.idx + 1} / ${g.imgs.length}</span><button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-800 text-white text-sm font-bold">✕</button></div><div id="ppwSwipeStage" onclick="event.stopPropagation()" class="w-full max-w-lg flex-1 flex items-center justify-center overflow-hidden touch-pan-y"><img id="ppwSwipeImg" src="${g.imgs[g.idx]}" class="max-w-full max-h-[76vh] object-contain rounded-2xl transition-transform duration-150"/></div><div class="flex flex-col items-center gap-2 pb-2" onclick="event.stopPropagation()">${g.imgs.length > 1 ? `<div class="flex items-center gap-1.5">${g.imgs.map((_, i) => `<span class="h-1.5 rounded-full transition-all ${i === g.idx ? "w-5 bg-emerald-400" : "w-1.5 bg-slate-600"}"></span>`).join("")}</div><div class="text-[11px] text-slate-400">← လက်ဖြင့် ဘေးဆွဲပြီး ပုံပြောင်းကြည့်ပါ →</div>` : ""}</div></div>`;
      const stage = document.getElementById("ppwSwipeStage"), imgEl = document.getElementById("ppwSwipeImg");
      if (!stage || g.imgs.length <= 1) return;
      let sx = 0, dx = 0;
      stage.addEventListener("touchstart", ev => { sx = ev.touches[0].clientX; dx = 0; }, { passive: true });
      stage.addEventListener("touchmove", ev => { dx = ev.touches[0].clientX - sx; if (imgEl) imgEl.style.transform = `translateX(${dx * 0.35}px)`; }, { passive: true });
      stage.addEventListener("touchend", () => { if (imgEl) imgEl.style.transform = ""; if (dx < -45) { g.idx = (g.idx + 1) % g.imgs.length; renderGalleryModal(); } else if (dx > 45) { g.idx = (g.idx - 1 + g.imgs.length) % g.imgs.length; renderGalleryModal(); } }, { passive: true });

    function showRxPicker(pid) { hideAllRxPickers(); const el = document.getElementById("rx-picker-" + pid); if (el) { el.classList.remove("hidden"); st.rxActivePid = pid; st.rxHovered = null; } }
    function hideAllRxPickers() { document.querySelectorAll('[id^="rx-picker-"]').forEach(el => el.classList.add("hidden")); document.querySelectorAll(".rx-hover").forEach(el => el.classList.remove("rx-hover")); st.rxActivePid = null; st.rxHovered = null; }
    window._lastTouchRxAt = 0;
    function onLikeTouchStart(e, pid) { window._lastTouchRxAt = Date.now(); st.rxTriggered = false; clearTimeout(st.rxTimer); st.rxTimer = setTimeout(() => { st.rxTriggered = true; showRxPicker(pid); if (navigator.vibrate) navigator.vibrate(20); }, 280); }
    function onLikeTouchMove(e) { if (!st.rxActivePid || !e.touches || !e.touches[0]) return; e.preventDefault(); const t = e.touches[0], target = document.elementFromPoint(t.clientX, t.clientY), item = target ? target.closest(".rx-item") : null; document.querySelectorAll(".rx-hover").forEach(el => el.classList.remove("rx-hover")); if (item && item.dataset.rx) { item.classList.add("rx-hover"); st.rxHovered = item.dataset.rx; } else st.rxHovered = null; }
    function onLikeTouchEnd(e, pid) { window._lastTouchRxAt = Date.now(); clearTimeout(st.rxTimer); if (e && e.cancelable) e.preventDefault(); if (st.rxTriggered) { if (st.rxHovered) { const ch = st.rxHovered; hideAllRxPickers(); setReaction(pid, ch); } return; } const p = st.posts.find(x => x.id === pid); setReaction(pid, userReaction(p) || "like"); }
    function onLikeMouseDown(e, pid) { if (Date.now() - window._lastTouchRxAt < 700 || e.button !== 0) return; st.rxTriggered = false; clearTimeout(st.rxTimer); st.rxTimer = setTimeout(() => { st.rxTriggered = true; showRxPicker(pid); }, 300); }
    function onLikeMouseUp(e, pid) { if (Date.now() - window._lastTouchRxAt < 700) return; clearTimeout(st.rxTimer); if (!st.rxTriggered) { const p = st.posts.find(x => x.id === pid); setReaction(pid, userReaction(p) || "like"); } }
    function pickRx(pid, rKey) { hideAllRxPickers(); setReaction(pid, rKey); }
    document.addEventListener("click", e => { if (st.rxActivePid && !e.target.closest('[id^="rx-picker-"]')) hideAllRxPickers(); });

    function setReaction(pid, rKey) {
      recordRealView(pid);
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const prev = userReaction(p);
      REACTIONS.forEach(r => { if (p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (p.likes && p.likes[st.me.id]) { delete p.likes[st.me.id]; fbDel(`posts/${pid}/likes/${st.me.id}`).catch(() => {}); }
      if (prev !== rKey) { p.reactions[rKey][st.me.id] = true; playSong(rKey); notify(p.authorId, "က သင့်ပို့စ်ကို Reaction ပေးလိုက်ပါသည်"); fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {}); }
      updateLiveLikeCounters(); saveFastCache();

          const dy = t.clientY - startY;
          if (dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) {
            curDx = Math.min(62, dx);
            activeBubble.style.transform = `translateX(${curDx}px)`;
          }
        }, { passive: true });

        box.addEventListener("touchend", () => {
          if (!activeBubble) return;
          activeBubble.style.transition = "transform 0.16s ease-out";
          activeBubble.style.transform = "translateX(0px)";
          if (curDx >= 42 && activeMid && st.chatUid) {
            setReplyTarget(roomId(st.me.id, st.chatUid), activeMid);
          }
          activeBubble = null;
          activeMid = "";
          curDx = 0;
        }, { passive: true });
      }

      // Include replyTo in outgoing messages
      sendChatPayload = async function ({ text, image, audio }) {
        if (!st.chatUid || !st.me) return;
        const rid = roomId(st.me.id, st.chatUid), mid = `M-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        const dur = audio ? (st.chatAudioDur || Math.max(1, Math.round((Date.now() - (window._recAt || Date.now())) / 1000))) : 0;
        st.chatAudioDur = 0;
        const replyData = st.replyTarget ? { ...st.replyTarget } : null;
        clearReplyTarget();

        const m = {
          id: mid, senderId: st.me.id, text: text || "", image: image || "", audio: audio || "",
          audioDur: dur, replyTo: replyData, seenAt: 0, deletedFor: {}, deletedForAll: false,
          createdAt: Date.now(), _status: navigator.onLine ? "sending" : "queued"
        };
        if (!pendingChats[rid]) pendingChats[rid] = {}; pendingChats[rid][mid] = m; savePending();
        if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
        clearChatAttach();
        if (navigator.onLine) fbPut(`typing/${rid}/${st.me.id}`, 0).catch(() => {});
        st.lastMsgHtmlSig = "";
        renderMsgs();
        await pushMessageToServer(rid, mid);
      };

      // Render messages with Quoted Reply Box + V3 Waveform + V4 Reactions & Forward
      renderMsgs = function () {
        const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
        bindSwipeReply();
        const rid = roomId(st.me.id, st.chatUid); mergeRoomSafe(rid, null);
        const ms = Object.values(st.chats[rid] || {}).filter(m => m && !(m.deletedFor && m.deletedFor[st.me.id])).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        const sig = ms.map(m => {
          const rxSig = m.reactions ? Object.values(m.reactions).sort().join("") : "";
          return `${m.id}_${m._status || "sent"}_${m.seenAt ? 1 : 0}_${m.deletedForAll ? 1 : 0}_${rxSig}`;
        }).join("|");

        if (sig !== st.lastMsgHtmlSig) {
          st.lastMsgHtmlSig = sig;
          box.innerHTML = ms.length ? ms.map(m => {
            const me = m.senderId === st.me.id;
            const isPureSticker = !m.deletedForAll && !m.image && !m.audio && !m.replyTo && STICKER_ICONS.includes((m.text || "").trim());
            let tick = "";
            if (me) {
              if (m._status === "sending") tick = `<span class="text-emerald-100/80 text-[10px]">⏳ ပို့နေဆဲ...</span>`;
              else if (m._status === "queued") tick = `<span class="text-amber-200 text-[10px]">🕒 Offline</span>`;
              else if (m._status === "failed") tick = `<button type="button" onclick="event.stopPropagation();retryChatMsg('${rid}','${m.id}')" class="text-rose-200 underline text-[10px] font-bold">⚠️ ပြန်ပို့ရန်</button>`;
              else if (m.seenAt) tick = `<span class="text-sky-200 font-bold">✓✓</span>`;
              else tick = `<span class="text-emerald-200/90 font-bold">✓</span>`;
            }
            let audioHtml = "";
            if (m.audio) {
              const dur = Number(m.audioDur || (window._ppwDurCache && window._ppwDurCache[m.id]) || 0);
              const barsHtml = WAVE_H.map(h => `<span class="w-[3px] rounded-full bg-white transition-opacity duration-150" style="height:${Math.round(h * 0.26)}px;opacity:0.4"></span>`).join("");
              audioHtml = `<div onclick="event.stopPropagation();toggleVoicePlay('${m.id}','${rid}')" class="flex items-center gap-2.5 py-0.5 min-w-[215px]">
                <button id="aud-btn-${m.id}" type="button" class="w-9 h-9 rounded-full bg-black/25 text-white flex items-center justify-center text-sm font-bold shrink-0 pl-0.5">▶</button>
                <div id="aud-wave-${m.id}" class="flex-1 flex items-center justify-between gap-[2px] h-7 px-1">${barsHtml}</div>
                <span id="aud-time-${m.id}" class="text-xs font-mono font-bold text-white/95 shrink-0 min-w-[34px] text-right">${dur > 0 ? fmtS(dur) : "0:01"}</span>
              </div>`;
            }
            let replyHtml = "";
            if (m.replyTo && !m.deletedForAll) {
              const rt = m.replyTo;
              const rPrev = rt.audio ? "🎙️ အသံမက်ဆေ့ချ်" : (rt.image ? "🖼️ ဓာတ်ပုံ" : (rt.text || ""));
              replyHtml = `<div class="mb-1.5 px-2.5 py-1.5 rounded-xl ${me ? "bg-black/20 border-l-2 border-emerald-200" : "bg-slate-800/90 border-l-2 border-sky-400"} text-xs">
                <div class="font-bold opacity-90 truncate">↩️ ${esc(rt.senderName || "")}</div>
                <div class="opacity-80 truncate">${esc(rPrev)}</div>
              </div>`;
            }
            const rxVals = m.reactions ? Object.values(m.reactions).filter(Boolean) : [];
            const uniqRx = [...new Set(rxVals)].slice(0, 3).join("");
            const rxBadge = rxVals.length
              ? `<div class="absolute -bottom-3 ${me ? "left-2" : "right-2"} px-1.5 py-0.5 rounded-full bg-[#1e293b] border border-slate-600 shadow-md text-xs flex items-center gap-0.5 leading-none"><span>${uniqRx}</span>${rxVals.length > 1 ? `<span class="text-[10px] text-slate-300 font-bold">${rxVals.length}</span>` : ""}</div>`
              : "";

            return `<div class="flex items-end ${me ? "justify-end" : "justify-start"} ${rxVals.length ? "mb-3.5" : ""}">
              <div data-mid="${m.id}" onclick="openDeleteMsgMenu('${m.id}')" class="relative cursor-pointer ${isPureSticker ? "text-6xl py-1 px-2" : `max-w-[85%] px-3.5 py-2.5 rounded-2xl text-base space-y-1 ${me ? "bg-emerald-600 text-white" : "bg-[#0f172a] border border-slate-800 text-slate-100"}`}">
                ${m.forwarded && !m.deletedForAll ? `<div class="text-[10px] opacity-80 font-bold flex items-center gap-1">↪️ Forwarded</div>` : ""}
                ${replyHtml}
                ${m.deletedForAll ? `<div class="italic text-xs opacity-75">🚫 ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ</div>` : `${m.image ? `<img onclick="event.stopPropagation();openImageViewer(this.src)" src="${m.image}" class="rounded-xl max-h-56 object-cover cursor-zoom-in"/>` : ""}${audioHtml}${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}`}
                ${me ? `<div class="text-[11px] text-right leading-none pt-0.5">${tick}</div>` : ""}
                ${rxBadge}
              </div>
            </div>`;
          }).join("") : `<p class="text-sm text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
          box.scrollTop = box.scrollHeight;
        }
        renderTypingBanner();
      };

      const _origCloseV6 = closeModal;
      closeModal = function () {
        st.replyTarget = null;
        return _origCloseV6();
      };
    })();
    // =========================================================================
    // UPGRADE V7: Threaded Post Comment Replies (Facebook-Style)
    // =========================================================================
    (function () {
      if (window.__PPW_UPGRADE_V7__) return;
      window.__PPW_UPGRADE_V7__ = true;

      st.cmtReply = {};

      window.startCmtReply = function (pid, parentId, uid, name) {
        st.cmtReply[pid] = { parentId, replyToUid: uid, replyToName: name };
        playSong("like");
        safeRender(true);
        setTimeout(() => {
          const inp = document.getElementById("ci-" + pid);
          if (inp) inp.focus();
        }, 40);
      };

      window.cancelCmtReply = function (pid) {
        delete st.cmtReply[pid];
        safeRender(true);
      };

      // Override addCmt to support threaded replies
      addCmt = async function (id) {
        const inp = document.getElementById("ci-" + id);
        if (!inp) return;
        const text = inp.value.trim();
        if (!text) return;
        const p = st.posts.find(x => x.id === id);
        if (!p) return;
        if (!p.comments) p.comments = {};

        const rep = st.cmtReply[id] || null;
        const cid = "C-" + Date.now() + "-" + Math.floor(Math.random() * 999);
        const c = {
          id: cid,
          authorId: st.me.id,
          text,
          parentId: rep ? rep.parentId : "",
          replyToUid: rep ? rep.replyToUid : "",
          replyToName: rep ? rep.replyToName : "",
          createdAt: Date.now()
        };

        p.comments[cid] = c;
        inp.value = "";
        delete st.cmtReply[id];
        playSong("notif");
        saveFastCache();
        safeRender(true);

        if (rep && rep.replyToUid && rep.replyToUid !== st.me.id) {
          notify(rep.replyToUid, "က သင့်မှတ်ချက်ကို Reply ပြန်လိုက်သည်: " + text.slice(0, 20));
        }
        if (p.authorId !== st.me.id && (!rep || rep.replyToUid !== p.authorId)) {
          notify(p.authorId, "က မှတ်ချက်ရေးခဲ့သည်: " + text.slice(0, 20));
        }
        await fbPut(`posts/${id}/comments/${cid}`, c).catch(() => {});
      };

      function renderSingleCmt(p, c, rootParentId, isReply) {
        const cu = uInfo(c.authorId);
        const own = p.authorId === st.me.id;
        const canEditC = c.authorId === st.me.id;
        const canDelC = canEditC || own;
        const safeName = esc(cu.name).replace(/'/g, "\\'");
        const tagTo = (isReply && c.replyToName)
          ? `<span onclick="openUserProfile('${c.replyToUid}')" class="text-sky-400 font-bold cursor-pointer mr-1">@${esc(c.replyToName)}</span>`
          : "";

        return `
          <div class="bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-sm flex items-start gap-2.5">
            <div onclick="openUserProfile('${cu.id}')" class="cursor-pointer shrink-0">${avatar(cu, isReply ? "w-7 h-7 text-[11px]" : "w-8 h-8 text-xs", true, true)}</div>
            <div class="text-sm text-slate-100 min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <span onclick="openUserProfile('${cu.id}')" class="font-bold text-white cursor-pointer inline-flex items-center gap-1 truncate">${esc(cu.name)} ${blueBadge(cu)}</span>
                <div class="flex items-center gap-2 shrink-0">
                  <button type="button" onclick="startCmtReply('${p.id}','${rootParentId}','${cu.id}','${safeName}')" class="text-[11px] font-bold text-emerald-400">Reply</button>
                  ${canEditC ? `<button type="button" onclick="openEditCmtModal('${p.id}','${c.id}')" class="text-[11px] font-bold text-sky-400">ပြင်</button>` : ""}
                  ${canDelC ? `<button type="button" onclick="delCmt('${p.id}','${c.id}')" class="text-[11px] font-bold text-rose-400">ဖျက်</button>` : ""}
                </div>
              </div>
              <div class="mt-0.5 whitespace-pre-line">${tagTo}${esc(c.text)} ${c.editedAt ? `<span class="text-[10px] text-slate-500">(ပြင်ပြီး)</span>` : ""}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">${ago(c.createdAt)}</div>
            </div>
          </div>`;
      }

      // Enhance postCard comment section with threaded replies
      const _basePostCardV7 = postCard;
      postCard = function (p) {
        let html = _basePostCardV7(p);
        if (!p || !st.openCmt[p.id]) return html;

        const marker = `<div class="bg-slate-900/90 px-3.5 py-3 border-t border-slate-800 rounded-b-2xl space-y-2.5">`;
        const idx = html.lastIndexOf(marker);
        if (idx === -1) return html;

        const allCmts = p.comments ? Object.values(p.comments).filter(c => c && !isBlockedPair(c.authorId)).sort((a, b) => a.createdAt - b.createdAt) : [];
        const topCmts = allCmts.filter(c => !c.parentId || !p.comments[c.parentId]);
        const repliesByParent = {};
        allCmts.forEach(c => {
          if (c.parentId && p.comments[c.parentId]) {
            if (!repliesByParent[c.parentId]) repliesByParent[c.parentId] = [];
            repliesByParent[c.parentId].push(c);
          }
        });

        const rep = st.cmtReply[p.id];
        const repBanner = rep
          ? `<div class="flex items-center justify-between gap-2 px-3 py-1.5 rounded-xl bg-emerald-950/70 border border-emerald-500/40 text-xs text-emerald-300">
               <span class="truncate font-bold">↩️ ${esc(rep.replyToName)} ကို Reply ပြန်နေသည်</span>
               <button type="button" onclick="cancelCmtReply('${p.id}')" class="text-slate-300 font-bold px-1">✕</button>
             </div>`
          : "";

        const threadedHtml = `
          ${marker}
            ${topCmts.map(c => {
              const reps = repliesByParent[c.id] || [];
              return `<div class="space-y-1.5">
                ${renderSingleCmt(p, c, c.id, false)}
                ${reps.length ? `<div class="ml-7 pl-2.5 border-l-2 border-slate-700/80 space-y-1.5">${reps.map(r => renderSingleCmt(p, r, c.id, true)).join("")}</div>` : ""}
              </div>`;
            }).join("")}
            ${repBanner}
            <div class="flex items-center gap-2">
              <input id="ci-${p.id}" type="text" placeholder="${rep ? `${esc(rep.replyToName)} ကို Reply ပြန်ရန်...` : "မှတ်ချက်ရေးရန်..."}" onkeydown="if(event.key==='Enter')addCmt('${p.id}')" class="flex-1 min-w-0 bg-slate-800 text-white border border-slate-700 rounded-full px-4 py-2.5 text-sm"/>
              <button onclick="addCmt('${p.id}')" class="px-4 py-2.5 rounded-full bg-emerald-600 text-white text-sm font-bold shrink-0">ပို့</button>
            </div>
          </div>
        </article>`;

        return html.slice(0, idx) + threadedHtml;
      };
    })();
    // =========================================================================
    // UPGRADE V8: Smart Notification -> Jump Directly to Mentioned / Target Post
    // =========================================================================
    (function () {
      if (window.__PPW_UPGRADE_V8__) return;
      window.__PPW_UPGRADE_V8__ = true;

      st.focusPostId = null;

      // 1. Attach postId & kind to notifications automatically
      const _origNotifyV8 = notify;
      notify = function (toId, text, postId = "", kind = "") {
        if (!st.me || !toId || toId === st.me.id || isBlockedPair(toId)) return;
        const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
        const autoPostId = postId || st.focusPostId || ((st.posts && st.posts[0] && st.posts[0].authorId === st.me.id) ? st.posts[0].id : "");
        fbPut(`notifications/${toId}/${id}`, {
          id,
          fromId: st.me.id,
          fromName: st.me.name,
          text,
          postId: autoPostId,
          kind,
          read: false,
          createdAt: Date.now()
        }).catch(() => {});
      };

      // Tag exact postId when sending mention notifications
      const _origSubmitV8 = submitPost;
      submitPost = async function () {
        const mentionsCopy = { ...(st.postMentions || {}) };
        const txt = (document.getElementById("postTxt") && document.getElementById("postTxt").value) || "";
        const res = await _origSubmitV8.apply(this, arguments);
        const latest = st.posts[0];
        if (latest && latest.authorId === st.me.id && Object.keys(mentionsCopy).length) {
          Object.entries(mentionsCopy).forEach(([name, uid]) => {
            if (txt.includes("@" + name)) {
              const nid = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
              fbPut(`notifications/${uid}/${nid}`, {
                id: nid,
                fromId: st.me.id,
                fromName: st.me.name,
                text: "က ပို့စ်ထဲတွင် သင့်ကို @Mention ခေါ်ထားပါသည်",
                postId: latest.id,
                kind: "mention",
                read: false,
                createdAt: Date.now()
              }).catch(() => {});
            }
          });
        }
        return res;
      };

      // 2. Jump directly to target post when clicking a notification
      window.openNotifTarget = async function (notifIdx, fallbackFromId) {
        const list = (st.notifs || []).filter(n => n && !isBlockedPair(n.fromId));
        const n = list[notifIdx];
        if (!n) {
          if (fallbackFromId) openUserProfile(fallbackFromId);
          return;
        }

        let pid = n.postId || "";
        let targetPost = pid ? st.posts.find(x => x && x.id === pid) : null;

        // Fetch post from Firebase if not currently in memory
        if (!targetPost && pid && navigator.onLine) {
          try {
            const fetched = await fbGet(`posts/${pid}`).catch(() => null);
            if (fetched && isValidPostObj(fetched)) {
              mergeServerPosts({ [pid]: fetched });
              targetPost = st.posts.find(x => x && x.id === pid);
            }
          } catch (e) {}
        }

        // Fallback match by authorId + approximate timestamp if postId wasn't stored
        if (!targetPost && n.fromId && n.createdAt) {
          targetPost = st.posts.find(p => p && p.authorId === n.fromId && Math.abs((p.createdAt || 0) - n.createdAt) < 120000);
          if (targetPost) pid = targetPost.id;
        }

        if (!targetPost) {
          if (n.text && (n.text.includes("@Mention") || n.text.includes("မှတ်ချက်") || n.text.includes("Reaction") || n.text.includes("ပို့စ်"))) {
            toast("ဤပို့စ်ကို ဖျက်လိုက်ပါပြီ သို့မဟုတ် မတွေ့ပါ");
          }
          if (n.fromId) openUserProfile(n.fromId);
          return;
        }

        pauseAllVideos(null);
        pushNavStep("notifications", null);
        st.tab = "home";
        st.viewProfileUid = null;
        st.cat = "အားလုံး";
        st.focusPostId = targetPost.id;
        if (n.text && (n.text.includes("မှတ်ချက်") || n.text.includes("Reply"))) {
          st.openCmt[targetPost.id] = true;
        }
        updateDockHighlight();
        st.lastRenderSig = "";
        render();

        setTimeout(() => {
          const el = document.getElementById("post-card-" + targetPost.id);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("ring-2", "ring-sky-400");
            setTimeout(() => {
              el.classList.remove("ring-2", "ring-sky-400");
              st.focusPostId = null;
            }, 2400);
          }
        }, 80);
      };

      // 3. Add id="post-card-..." on each post card + make notifications jump to post
      const _origPostCardV8 = postCard;
      postCard = function (p) {
        const html = _origPostCardV8(p);
        if (!p || !p.id) return html;
        return html.replace("<article ", `<article id="post-card-${p.id}" `);
      };

      const _origRenderV8 = render;
      render = function () {
        _origRenderV8();
        if (!st.me || st.tab !== "notifications") return;
        const el = document.getElementById("mainContent");
        if (!el) return;
        const visNotifs = (st.notifs || []).filter(n => n && !isBlockedPair(n.fromId));
        if (!visNotifs.length) return;

        const rows = el.querySelectorAll(".p-3\\.5.space-y-3 > div.cursor-pointer");
        rows.forEach((row, idx) => {
          const n = visNotifs[idx];
          if (!n) return;
          row.setAttribute("onclick", `openNotifTarget(${idx}, '${n.fromId}')`);
          const isMention = (n.text || "").includes("@Mention");
          if (isMention && !row.querySelector("[data-mention-pill]")) {
            const pill = document.createElement("span");
            pill.dataset.mentionPill = "1";
            pill.className = "ml-auto px-2.5 py-1 rounded-full bg-sky-500/20 border border-sky-500/40 text-sky-300 text-[11px] font-bold shrink-0";
            pill.textContent = "ပို့စ်ကြည့် ›";
            row.appendChild(pill);
          }
        });
      };
    })();

    if (!st.me) {
      document.getElementById("authScreen").classList.remove("hidden");
      setAuthMode("login");
    } else {
      bootApp();
    }

    setInterval(() => { if (st.me && !document.hidden && navigator.onLine) updateMyPresence(true); }, 10000);
    setInterval(() => { if (st.me && !document.hidden && navigator.onLine) sync(false); }, 12000);
  </script>
</body>
