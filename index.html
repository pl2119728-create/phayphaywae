<!DOCTYPE html>

</head>
<body class="bg-[#05080f] text-slate-100">
  <div id="nightOverlay" class="hidden fixed inset-0 z-40 pointer-events-none bg-black/35 transition-opacity"></div>
  <div id="app" class="max-w-md mx-auto min-h-screen bg-[#0b1120] shadow-2xl flex flex-col relative pb-24 border-x border-slate-800/80">
    <header class="sticky top-0 z-30 bg-[#0b1120]/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-bold text-white leading-tight">ဖြေးဖြေး ဝယ်</h1>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">APK</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span id="syncText" class="text-xs text-slate-400 font-medium">ချိတ်ဆက်ပြီး</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleNightMode()" id="nightBtn" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-amber-300 text-sm" title="Night Mode">🌙</button>
        <button onclick="toggleSound()" id="soundBtn" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-emerald-300 text-sm" title="အသံဖွင့်/ပိတ်">🔊</button>
        <button onclick="openRulesModal()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200" title="စည်းမျဉ်းစည်းကမ်း">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </button>
        <button onclick="switchTab('chats')" class="relative p-2 rounded-full bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300" title="မက်ဆေ့ချ်များ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </button>
        <button onclick="switchTab('notifications')" class="relative p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200" title="အကြောင်းကြားစာ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 w-5 h-5 rounded-full bg-rose-500 text-white text-xs font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0f172a] border-t border-slate-800 px-1 py-2 flex items-center justify-around z-30 shadow-lg">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-emerald-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-xs font-bold">ပင်မ</span>
      </button>
      <button onclick="switchTab('explore')" id="nav-explore" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="text-xs font-semibold">ရှာဖွေ</span>
      </button>
      <button onclick="openComposerModal()" class="flex items-center justify-center w-11 h-11 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md shadow-emerald-950 active:scale-95 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
      <button onclick="switchTab('chats')" id="nav-chats" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span class="text-xs font-semibold">စာတို</span>
      </button>
      <button onclick="switchTab('friends')" id="nav-friends" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-xs font-semibold">မိတ်ဆွေ</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs font-semibold">ပရိုဖိုင်</span>
      </button>
    </nav>

    <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white text-sm font-semibold px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap"></div>
    <div id="modalRoot"></div>
  </div>

  <script>
    const DB = "https://phay-phay-wae-default-rtdb.asia-southeast1.firebasedatabase.app";
    const ADMIN_NAME = "ပိုင်ဇော်ထက် (Paing Zaw Htet)";
    const TRADE_CATS = ["Facebook Page", "YouTube Account", "TikTok Account", "Instagram / RedNote", "Monetized Page / Channel"];
    const FEED_FILTERS = ["အားလုံး", "စိတ်ဝင်စားမှုများ", "အသစ်ရောက်သူများ", ...TRADE_CATS];
    const COLORS = ["from-emerald-500 to-teal-600", "from-blue-500 to-indigo-600", "from-amber-500 to-orange-600", "from-rose-500 to-pink-600", "from-purple-500 to-violet-600"];
    const REACTIONS = [
      { key: "like", icon: "👍", label: "ကြိုက်တယ်", activeClass: "text-blue-200 bg-blue-900/70 border-blue-400/50" },
      { key: "haha", icon: "😂", label: "Haha", activeClass: "text-amber-200 bg-amber-900/70 border-amber-400/50" },
      { key: "love", icon: "❤️", label: "အသည်း", activeClass: "text-rose-200 bg-rose-900/70 border-rose-400/50" },
      { key: "angry", icon: "😡", label: "စိတ်ဆိုး", activeClass: "text-orange-200 bg-orange-900/70 border-orange-400/50" }
    ];
    const STICKER_ICONS = ["🛍️", "✨", "🎉", "🙏", "🚀", "💙", "🤝", "🎁", "🥰", "🔥", "💯", "👍"];
    const BLOCKED_PHYSICAL = ["အဝတ်အစား", "ရှပ်အင်္ကျီ", "ဘောင်းဘီ", "ဖိနပ်", "ထဘီ", "ပုဆိုး", "shirt", "pants", "clothes", "dress", "shoes"];
    const RULES = [
      "Facebook Page၊ YouTube Account၊ TikTok Account စသည့် အကောင့်/ပိုင်ဆိုင်မှု ရောင်းဝယ်မှုများကိုသာ တင်ရမည်။ အဝတ်အစားနှင့် မသက်ဆိုင်သော ရုပ်ပိုင်းဆိုင်ရာပစ္စည်းများ ခွင့်မပြုပါ။",
      "အမျိုးအစားအလိုက် #youtube၊ #facebook၊ #tiktok စသဖြင့် # ခံပြီး ထည့်သွင်းပါက Category မှ တစ်ချက်နှိပ်ပြီး ရှာဖွေနိုင်မည်။",
      "အကောင့်လွှဲပြောင်းမှု (Admin/Email/Recovery) နှင့် လိမ်လည်မှု/ယုံကြည်မှုပျက်စီးစေသော အပြုအမူများ လုံးဝခွင့်မပြုပါ။",
      "Blue Mark (အတည်ပြု အမှတ်အသား) ကို လူတိုင်းအား အလိုအလျောက် မပေးပါ — ယုံကြည်ရကြောင်း အထောက်အထားဖြင့် ကိုပိုင်ဇော်ထက်ထံ အယူခံဝင် စစ်ဆေးခံရမည်။",
      "ပို့စ်တစ်ခုတွင် Reaction နှင့် မှတ်ချက် (Comment) များလေ လူတွေဆီ ပိုမိုရောက်ရှိမည်။"
    ];

    function getUser() {
      try {
        const s = JSON.parse(localStorage.getItem("ppw_user_v6"));
        if (s && s.id) return s;
      } catch (e) {}
      const n = Math.floor(100000 + Math.random() * 900000);
      const u = {
        id: "PPW-" + n,
        name: "အသုံးပြုသူ #" + String(n).slice(-4),
        bio: "ဖြေးဖြေး ဝယ် မှာ Page / Account များ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။",
        phone: "",
        photo: "",
        blueMark: false,
        appealStatus: "none",
        isAdmin: false,
        color: COLORS[n % COLORS.length],
        friends: [],
        following: [],
        createdAt: Date.now()
      };
      try { localStorage.setItem("ppw_user_v6", JSON.stringify(u)); } catch (e) {}
      return u;
    }

    let st = {
      tab: "home",
      me: getUser(),
      posts: [],
      myday: [],
      users: {},
      reviews: {},
      appeals: {},
      notifs: [],
      chats: {},
      typing: {},
      calls: {},
      cat: "အားလုံး",
      q: "",
      fq: "",
      openCmt: {},
      replyTo: {},
      img: null,
      mydayImg: null,
      chatImg: null,
      chatVideo: null,
      chatUid: null,
      activeCall: null,
      showStickers: false,
      nightMode: false,
      soundOn: true,
      audioCtx: null,
      seenMsgIds: {},
      seenNotifIds: {},
      seenCallIds: {},
      firstSync: true,
      recorder: null,
      audioChunks: []
    };

    const saveMe = () => { try { localStorage.setItem("ppw_user_v6", JSON.stringify(st.me)); } catch (e) {} };
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast"); el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.add("hidden"), 2400);
    }
    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!st.audioCtx) st.audioCtx = new AC();
        if (st.audioCtx.state === "suspended") st.audioCtx.resume().catch(() => {});
        return st.audioCtx;
      } catch (e) { return null; }
    }

    document.addEventListener("pointerdown", () => { if (st.soundOn) ensureAudio(); }, { passive: true });

    function toggleNightMode() {
      st.nightMode = !st.nightMode;
      const ov = document.getElementById("nightOverlay");
      if (ov) ov.classList.toggle("hidden", !st.nightMode);
      playSong("notif");
      toast(st.nightMode ? "Night Mode ဖွင့်ပြီး" : "ပုံမှန် အမည်းအောက်ခံသို့ ပြန်ပြောင်းပြီး");
    }

    function toggleSound() {
      st.soundOn = !st.soundOn;
      document.getElementById("soundBtn").textContent = st.soundOn ? "🔊" : "🔇";
      if (st.soundOn) { ensureAudio(); playSong("notif"); }
      toast(st.soundOn ? "အသံပိုင်း ဖွင့်ပြီး" : "အသံပိုင်း ပိတ်ပြီး");
    }

    function playSong(kind) {
      if (!st.soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const seq =
          kind === "message" ? [659.25, 880, 1046.5] :
          kind === "like" ? [587.33, 880] :
          kind === "haha" ? [698.46, 880, 1174.66] :
          kind === "love" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "angry" ? [220.0, 164.81] :
          kind === "call" ? [783.99, 1046.5, 783.99, 1046.5] :
          [523.25, 783.99];
        const wave = kind === "angry" ? "sawtooth" : (kind === "haha" || kind === "like" ? "triangle" : "sine");
        seq.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.001, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.08 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.27);
        });
      } catch (e) {}
    }

    const uInfo = id => id === st.me.id ? st.me : (st.users[id] || { id, name: id, bio: "", photo: "", blueMark: false, friends: [], following: [], color: "from-slate-500 to-slate-600", createdAt: Date.now() });
    const isNewUser = id => (Date.now() - (uInfo(id).createdAt || Date.now())) < 7 * 86400000;
    function blueBadge(u) {
      if (!u || !u.blueMark) return "";
      return `<span title="အတည်ပြု ယုံကြည်စိတ်ချရသူ" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-sky-500 text-white text-xs font-bold shrink-0">✓</span>`;
    }
    function uRating(id) {
      const l = Object.values(st.reviews || {}).filter(r => r.targetId === id);
      if (!l.length) return { avg: "0.0", count: 0, list: [] };
      return { avg: (l.reduce((a, b) => a + (Number(b.rating) || 5), 0) / l.length).toFixed(1), count: l.length, list: l };
    }
    function followersCount(id) {
      let c = 0;
      Object.values(st.users || {}).forEach(u => {
        if (u && u.id !== id && Array.isArray(u.following) && u.following.includes(id)) c++;
      });
      return c;
    }
    function avatar(u, sz = "w-11 h-11 text-base") {
      const x = typeof u === "string" ? uInfo(u) : u;
      if (x && x.photo) {
        return `<img src="${x.photo}" alt="${esc(x.name || "U")}" class="${sz} rounded-full object-cover shrink-0 shadow-sm border-2 border-emerald-500/50 bg-slate-800"/>`;
      }
      return `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shrink-0 shadow-sm">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
    }

    function totalReactions(p) {
      const rx = p.reactions || {};
      let sum = Object.keys(p.likes || {}).length;
      Object.values(rx).forEach(map => { sum += Object.keys(map || {}).length; });
      return sum;
    }

    function userReaction(p) {
      const rx = p.reactions || {};
      for (const r of REACTIONS) {
        if (rx[r.key] && rx[r.key][st.me.id]) return r.key;
      }
      if (p.likes && p.likes[st.me.id]) return "like";
      return null;
    }

    function engagementScore(p) {
      const rCnt = totalReactions(p);
      const cCnt = Object.keys(p.comments || {}).length;
      return rCnt * 3 + cCnt * 5;
    }

    function feedScore(p) {
      const eng = engagementScore(p);
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      const recencyBoost = 24 / (1 + ageHours * 0.25);
      const newMemberBoost = isNewUser(p.authorId) ? 6 : 0;
      return eng * 2.5 + recencyBoost + newMemberBoost;
    }

    function matchesCategoryOrTag(p, filterVal) {
      if (!filterVal || filterVal === "အားလုံး" || filterVal === "စိတ်ဝင်စားမှုများ" || filterVal === "အသစ်ရောက်သူများ") return true;
      const txt = ((p.text || "") + " " + (p.tags || "")).toLowerCase();
      if (filterVal === "YouTube Account") return p.category === "YouTube Account" || txt.includes("#youtube");
      if (filterVal === "Facebook Page") return p.category === "Facebook Page" || txt.includes("#facebook") || txt.includes("#fb");
      if (filterVal === "TikTok Account") return p.category === "TikTok Account" || txt.includes("#tiktok");
      return p.category === filterVal;
    }

    function hasBlockedClothing(str) {
      const low = String(str || "").toLowerCase();
      return BLOCKED_PHYSICAL.some(k => low.includes(k));
    }

    const fbGet = p => fetch(`${DB}/${p}.json`).then(r => r.json());
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    async function sync(init = false) {
      try {
        if (init) await fbPut(`users/${st.me.id}`, st.me);
        const [po, md, us, rv, ap, no, ch, ty, cl] = await Promise.all([
          fbGet("posts"),
          fbGet("myday"),
          fbGet("users"),
          fbGet("reviews"),
          fbGet("appeals"),
          fbGet(`notifications/${st.me.id}`),
          fbGet("chats"),
          fbGet("typing"),
          fbGet("calls")
        ]);
        const rawPosts = po ? Object.values(po) : [];
        st.posts = rawPosts.filter(p => p && TRADE_CATS.includes(p.category) && !hasBlockedClothing(p.text) && (p.text || p.image));
        const dayCutoff = Date.now() - 24 * 3600000;
        st.myday = md ? Object.values(md).filter(d => d && (d.createdAt || 0) >= dayCutoff).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        st.users = us || {};
        if (st.users[st.me.id]) {
          st.me.blueMark = !!st.users[st.me.id].blueMark;
          st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
          st.me.isAdmin = !!st.users[st.me.id].isAdmin;
          if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
          saveMe();
        }
        st.users[st.me.id] = st.me;
        st.reviews = rv || {};
        st.appeals = ap || {};
        st.typing = ty || {};
        st.calls = cl || {};

        const nextNotifs = no ? Object.values(no).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        let newNotifSong = false;
        nextNotifs.forEach(n => {
          if (!st.seenNotifIds[n.id]) {
            st.seenNotifIds[n.id] = true;
            if (!st.firstSync && !n.read) newNotifSong = true;
          }
        });
        st.notifs = nextNotifs;

        const nextChats = ch || {};
        let newMsgSong = false;
        Object.entries(nextChats).forEach(([rk, mObj]) => {
          if (!rk.includes(st.me.id)) return;
          Object.values(mObj || {}).forEach(m => {
            if (!st.seenMsgIds[m.id]) {
              st.seenMsgIds[m.id] = true;
              if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true;
            }
          });
        });
        st.chats = nextChats;

        let incomingCall = null;
        Object.values(st.calls || {}).forEach(c => {
          if (!c || c.status !== "ringing") return;
          if (c.toId === st.me.id && !st.seenCallIds[c.id]) {
            st.seenCallIds[c.id] = true;
            if (!st.firstSync) incomingCall = c;
          }
          if (st.activeCall && st.activeCall.id === c.id) {
            st.activeCall = c;
          }
        });

        st.firstSync = false;

        if (incomingCall && !st.activeCall) {
          st.activeCall = incomingCall;
          playSong("call");
          openCallModal(incomingCall.id);
        } else if (newMsgSong) {
          playSong("message");
        } else if (newNotifSong) {
          playSong("notif");
        }

        document.getElementById("syncDot").className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        document.getElementById("syncText").textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";
        const unread = st.notifs.filter(n => !n.read).length;
        const nb = document.getElementById("notifBadge");
        if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden");

        const activeEl = document.activeElement;
        const tag = activeEl ? activeEl.tagName : "";
        const isTypingMsg = activeEl && activeEl.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) {
          render();
          if (st.chatUid) renderMsgs();
        } else if (st.chatUid && !isTypingMsg) {
          renderMsgs();
        } else if (st.chatUid) {
          renderTypingBanner();
        }
      } catch (e) {
        document.getElementById("syncDot").className = "w-2.5 h-2.5 rounded-full bg-amber-400";
        document.getElementById("syncText").textContent = "ချိတ်ဆက်နေဆဲ...";
      }
    }

    function getFilteredPosts() {
      let list = [...st.posts];
      if (st.cat === "စိတ်ဝင်စားမှုများ") {
        list.sort((a, b) => engagementScore(b) - engagementScore(a) || (b.createdAt || 0) - (a.createdAt || 0));
      } else if (st.cat === "အသစ်ရောက်သူများ") {
        list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (st.cat !== "အားလုံး") {
        list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      } else {
        list.sort((a, b) => feedScore(b) - feedScore(a));
      }
      return list;
    }

    function postCard(p) {

      const totRx = Math.max(totalReactions(p), Object.values(rxCounts).reduce((a, b) => a + b, 0));
      const cmts = p.comments ? Object.values(p.comments).sort((a, b) => a.createdAt - b.createdAt) : [], exp = !!st.openCmt[p.id], own = p.authorId === st.me.id;

          ${totRx > 0 ? `<div class="px-3.5 py-1.5 text-xs text-slate-300 flex items-center gap-2 border-t border-slate-800">
            <span>${REACTIONS.map(r => rxCounts[r.key] ? `${r.icon} ${rxCounts[r.key]}` : "").filter(Boolean).join("  ")}</span>
            <span class="ml-auto font-semibold text-slate-400">စုစုပေါင်း ${totRx}</span>
          </div>` : ""}
          <div class="px-2 py-2 border-t border-slate-800 grid grid-cols-4 gap-1 text-xs">
            ${REACTIONS.map(r => {
              const active = myRx === r.key;
              return `<button onclick="setReaction('${p.id}','${r.key}')" class="py-2 px-1 rounded-xl font-bold border flex items-center justify-center gap-1 ${active ? r.activeClass : "bg-slate-800/80 text-slate-200 border-transparent"}">

              </button>`;

          <div class="px-3.5 pb-2.5">
            <button onclick="st.openCmt['${p.id}']=!st.openCmt['${p.id}'];playSong('notif');render()" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">💬 မှတ်ချက်များ ${cmts.length ? `(${cmts.length})` : ""}</button>

              <button onclick="addCmt('${p.id}')" class="px-4 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold">ပို့</button>
            </div>
          </div>` : ""}
        </article>`;
    }

    function setReaction(pid, rKey) {
      const p = st.posts.find(x => x.id === pid);
      if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const prev = userReaction(p);
      REACTIONS.forEach(r => {
        if (p.reactions[r.key] && p.reactions[r.key][st.me.id]) {
          delete p.reactions[r.key][st.me.id];
          fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {});
        }
      });
      if (p.likes && p.likes[st.me.id]) {
        delete p.likes[st.me.id];
        fbDel(`posts/${pid}/likes/${st.me.id}`).catch(() => {});
      }
      if (prev !== rKey) {
        p.reactions[rKey][st.me.id] = true;
        playSong(rKey);
        const rObj = REACTIONS.find(x => x.key === rKey);
        notify(p.authorId, `က သင့်ပို့စ်ကို ${rObj ? rObj.icon + " " + rObj.label : "Reaction"} ပေးလိုက်ပါသည်`);
        fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {});
      } else {
        playSong("notif");
      }
      render();
    }

    function onPickMyDayImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.mydayImg = c.toDataURL("image/jpeg", 0.72);
          document.getElementById("mdImgPrev").src = st.mydayImg;
          document.getElementById("mdImgBox").classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    function submitMyDay() {
      const text = (document.getElementById("mdTxt").value || "").trim();
      if (!text && !st.mydayImg) return toast("MyDay ပုံ သို့မဟုတ် စာသား ထည့်ပေးပါ");
      const id = "MD-" + Date.now();
      const d = { id, authorId: st.me.id, text, image: st.mydayImg || "", createdAt: Date.now() };
      st.myday.unshift(d);
      playSong("like");
      closeModal();
      render();
      toast("MyDay တင်ပြီးပါပြီ");
      fbPut(`myday/${id}`, d).catch(() => {});

    function onPickAvatar(e) {

      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), sz = 240;
          const minSide = Math.min(im.width, im.height);
          const sx = Math.floor((im.width - minSide) / 2);
          const sy = Math.floor((im.height - minSide) / 2);
          c.width = sz; c.height = sz;

        im.src = ev.target.result;
      };
      r.readAsDataURL(f);

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.img = c.toDataURL("image/jpeg", 0.72);
          document.getElementById("imgPrev").src = st.img;
          document.getElementById("imgBox").classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    }

    function sendTyping(oid) {
      const rid = roomId(st.me.id, oid);
      if (!st.typing[rid]) st.typing[rid] = {};
      st.typing[rid][st.me.id] = Date.now();
      fbPut(`typing/${rid}/${st.me.id}`, Date.now()).catch(() => {});
    }

    function renderTypingBanner() {
      const tb = document.getElementById("typingBanner");
      if (!tb || !st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid);
      const tObj = st.typing[rid] || {};
      const active = Object.entries(tObj).some(([uid, ts]) => uid !== st.me.id && (Date.now() - Number(ts || 0) < 4500));
      if (active) {
        tb.innerHTML = `<span class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-300 bg-emerald-500/15 border border-emerald-500/30 px-3 py-1 rounded-full"><span>${esc(uInfo(st.chatUid).name)}</span><span>စာရိုက်နေပါသည်...</span></span>`;
        tb.classList.remove("hidden");
      } else {
        tb.classList.add("hidden");
      }
    }

    function toggleStickerBar() {
      st.showStickers = !st.showStickers;
      playSong("notif");
      const sb = document.getElementById("stickerBar");
      if (sb) sb.classList.toggle("hidden", !st.showStickers);
    }

    function sendStickerIcon(icon) {
      if (!st.chatUid) return;
      playSong("love");
      sendChatPayload({ text: icon, image: "", audio: "", video: "" });
      st.showStickers = false;
      const sb = document.getElementById("stickerBar");
      if (sb) sb.classList.add("hidden");
    }

    function openChat(oid) {
      st.chatUid = oid; st.chatImg = null; st.chatVideo = null; st.showStickers = false; const o = uInfo(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center">
          <div class="bg-[#0b1120] border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl flex flex-col h-[86vh] animate-slide-up overflow-hidden">
            <div class="p-3.5 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between">
              <div onclick="openUserModal('${o.id}')" class="flex items-center gap-2.5 cursor-pointer">${avatar(o, "w-10 h-10 text-sm")}<div><div class="text-sm font-bold text-white flex items-center gap-1">${esc(o.name)} ${blueBadge(o)}</div><div class="text-xs text-slate-400 font-mono">${esc(o.id)}</div></div></div>
              <div class="flex items-center gap-2">
                <button onclick="startVoiceCall('${o.id}')" class="px-3 py-1.5 rounded-full bg-emerald-600 text-white text-xs font-bold">📞 ခေါ်မည်</button>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-white text-xs font-bold">✕</button>
              </div>
            </div>
            <div id="msgBox" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 bg-[#05080f]"></div>
            <div id="typingBanner" class="hidden px-3.5 py-1 bg-[#05080f]"></div>
            <div id="stickerBar" class="hidden p-2.5 bg-[#0f172a] border-t border-slate-800 grid grid-cols-6 gap-2">
              ${STICKER_ICONS.map(ic => `<button onclick="sendStickerIcon('${ic}')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-2xl py-2.5 text-2xl flex items-center justify-center">${ic}</button>`).join("")}
            </div>
            <div id="chatAttachPreview" class="hidden px-3.5 py-2 bg-[#0f172a] border-t border-slate-800 flex items-center justify-between">
              <div id="chatAttachLabel" class="flex items-center gap-2 text-xs text-emerald-300 font-bold"></div>
              <button onclick="clearChatAttach()" class="text-xs text-rose-400 font-bold">✕</button>
            </div>
            <div class="p-2.5 bg-[#0f172a] border-t border-slate-800 flex items-center gap-1.5">
              <button onclick="toggleStickerBar()" class="p-2 rounded-full bg-slate-800 text-amber-300 text-base font-bold" title="စတစ်ကာ">😄</button>
              <label class="p-2 rounded-full bg-slate-800 text-slate-200 cursor-pointer text-base" title="ပုံပို့ရန်">
                📷<input type="file" accept="image/*" onchange="onPickChatImg(event)" class="hidden"/>
              </label>
              <label class="p-2 rounded-full bg-slate-800 text-sky-300 cursor-pointer text-base" title="Short Video (၁၅စက္ကန့်)">
                🎬<input type="file" accept="video/*" onchange="onPickShortVideo(event)" class="hidden"/>
              </label>
              <button onclick="toggleVoiceRec()" id="voiceBtn" class="p-2 rounded-full bg-slate-800 text-emerald-300 text-base" title="အသံမက်ဆေ့ချ်">🎙️</button>
              <input id="msgInp" type="text" placeholder="စာရိုက်ပါ..." oninput="sendTyping('${oid}')" onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 bg-slate-900 text-white border border-slate-700 rounded-full px-3.5 py-2 text-sm focus:outline-none"/>
              <button onclick="sendMsg()" class="px-3.5 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold">ပို့</button>
            </div>
          </div>
        </div>`;
      renderMsgs();
    }

    function clearChatAttach() {
      st.chatImg = null;
      st.chatVideo = null;
      const p = document.getElementById("chatAttachPreview");
      if (p) p.classList.add("hidden");
    }

    function onPickChatImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      st.chatVideo = null;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 640;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.chatImg = c.toDataURL("image/jpeg", 0.72);
          const lbl = document.getElementById("chatAttachLabel");
          if (lbl) lbl.innerHTML = `<img src="${st.chatImg}" class="w-10 h-10 rounded-lg object-cover"/><span>ဓာတ်ပုံ ပို့ရန် အဆင်သင့်</span>`;
          const pv = document.getElementById("chatAttachPreview");
          if (pv) pv.classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    function onPickShortVideo(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (f.size > 4.5 * 1024 * 1024) {
        e.target.value = "";
        return toast("၁၅ စက္ကန့်အတွင်း Short Video သေးသေးသာ ပို့နိုင်ပါသည်");
      }
      const url = URL.createObjectURL(f);
      const vid = document.createElement("video");
      vid.preload = "metadata";
      vid.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        if (vid.duration > 15.5) {
          e.target.value = "";
          return toast("Short Video ကို ၁၅ စက္ကန့်စာပဲ လက်ခံပါသည်");
        }
        const reader = new FileReader();
        reader.onload = ev => {
          st.chatImg = null;
          st.chatVideo = ev.target.result;
          const lbl = document.getElementById("chatAttachLabel");
          if (lbl) lbl.innerHTML = `<span>🎬 Short Video (${Math.round(vid.duration)}s) အဆင်သင့်</span>`;
          const pv = document.getElementById("chatAttachPreview");
          if (pv) pv.classList.remove("hidden");
        };
        reader.readAsDataURL(f);
      };
      vid.src = url;
    }

    async function toggleVoiceRec() {
      const btn = document.getElementById("voiceBtn");
      if (st.recorder && st.recorder.state === "recording") {
        st.recorder.stop();
        if (btn) btn.className = "p-2 rounded-full bg-slate-800 text-emerald-300 text-base";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return toast("ဤ Browser တွင် အသံသွင်းစနစ် မရနိုင်ပါ");
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = [];
        const rec = new MediaRecorder(stream);
        st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(st.audioChunks, { type: "audio/webm" });
          const reader = new FileReader();
          reader.onloadend = () => {
            if (!st.chatUid) return;
            sendChatPayload({ text: "", image: "", audio: reader.result, video: "" });
          };
          reader.readAsDataURL(blob);
        };
        rec.start();
        toast("အသံသွင်းနေပါသည်... ပို့ရန် 🎙️ ကို ထပ်နှိပ်ပါ");
        if (btn) btn.className = "p-2 rounded-full bg-rose-600 text-white text-base animate-pulse";
      } catch (e) {
        toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်");
      }
    }

    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).sort((a, b) => a.createdAt - b.createdAt);
      box.innerHTML = ms.length ? ms.map((m, i) => {
        const me = m.senderId === st.me.id;
        const isPureSticker = !m.image && !m.audio && !m.video && STICKER_ICONS.includes((m.text || "").trim());
        return `
          <div class="flex items-end gap-1.5 ${me ? "justify-end" : "justify-start"}">
            ${!me ? `<span class="w-6 h-6 rounded-full bg-slate-800 text-slate-300 text-xs font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}
            ${isPureSticker
              ? `<div class="text-5xl py-1 px-2 select-none">${esc(m.text)}</div>`
              : `<div class="max-w-[78%] px-3.5 py-2.5 rounded-2xl text-sm space-y-1.5 ${me ? "bg-emerald-600 text-white" : "bg-[#0f172a] border border-slate-800 text-slate-100"}">
                  ${m.image ? `<img src="${m.image}" class="rounded-xl max-h-48 object-cover bg-slate-900"/>` : ""}
                  ${m.video ? `<video controls playsinline src="${m.video}" class="rounded-xl max-h-52 w-56 bg-black"></video>` : ""}
                  ${m.audio ? `<audio controls src="${m.audio}" class="w-48 h-8"></audio>` : ""}
                  ${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}
                </div>`}
            ${me ? `<span class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}
          </div>`;
      }).join("") : `<p class="text-sm text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;
      renderTypingBanner();
    }

    function sendChatPayload({ text, image, audio, video }) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), mid = "M-" + Date.now();
      const m = { id: mid, senderId: st.me.id, text: text || "", image: image || "", audio: audio || "", video: video || "", createdAt: Date.now() };
      if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
      clearChatAttach();
      fbPut(`typing/${rid}/${st.me.id}`, 0).catch(() => {});
      renderMsgs();
      const notiLabel = text ? text.slice(0, 20) : (video ? "🎬 Short Video" : (audio ? "🎙️ အသံမက်ဆေ့ချ်" : "📷 ဓာတ်ပုံ"));
      notify(st.chatUid, "က စာပို့လိုက်သည်: " + notiLabel);
      fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }

    function sendMsg() {
      const inp = document.getElementById("msgInp"); if (!inp || !st.chatUid) return;
      const text = inp.value.trim();
      if (!text && !st.chatImg && !st.chatVideo) return;
      sendChatPayload({ text, image: st.chatImg || "", audio: "", video: st.chatVideo || "" });
      inp.value = "";
    }

    function closeModal() {
      if (st.chatUid) {
        fbPut(`typing/${roomId(st.me.id, st.chatUid)}/${st.me.id}`, 0).catch(() => {});
      }
      if (st.recorder && st.recorder.state === "recording") {
        try { st.recorder.stop(); } catch (e) {}
      }
      st.chatUid = null;
      st.activeCall = null;
      st.showStickers = false;
      document.getElementById("modalRoot").innerHTML = "";
    }

    render();
    sync(true);
    setInterval(() => sync(false), 2000);
  </script>
</body>
</html>
