    function getUser() {

            const isOwner = s.id === OWNER_ID;
            const norm = {
              id: s.id,
              name: s.name || ("အသုံးပြုသူ #" + String(s.id).slice(-4)),

              gender: s.gender || "",

              blueMark: isOwner ? true : !!s.blueMark,

              friends: Array.isArray(s.friends) ? s.friends : [],
              following: Array.isArray(s.following) ? s.following : [],
              createdAt: s.createdAt || Date.now()
            };
            try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(norm)); } catch (e) {}
            return norm;
          }
        } catch (e) {}
      }
      const n = Math.floor(100000 + Math.random() * 900000);
      const u = {
        id: "PPW-" + n,
        name: "အသုံးပြုသူ #" + String(n).slice(-4),

      };

      return u;
    }

    let cached = { posts: [], myday: [], users: {} };
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)) || cached; } catch (e) {}

    let st = {
      tab: "home",
      profileSubTab: "posts",
      adminFilter: "pending",
      me: getUser(),
      posts: Array.isArray(cached.posts) ? cached.posts : [],
      myday: Array.isArray(cached.myday) ? cached.myday : [],
      users: cached.users || {},
      presence: {}, reviews: {}, appeals: {}, boostRequests: {},

      cat: "အားလုံး", q: "", fq: "",
      openCmt: {}, replyTo: {}, viewedPosts: {},
      img: null, mydayImg: null, chatImg: null, chatVideo: null,

    };

    }
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt);
      window._tt = setTimeout(() => el.classList.add("hidden"), 2400);
    }

    function copyText(text, successMsg) {
      const done = () => { playSong("notif"); toast(successMsg || "Copy ကူးပြီးပါပြီ"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else fallbackCopy(text, done);
    }
    function fallbackCopy(text, cb) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); cb();
      } catch (e) { prompt("Copy ကူးရန်:", text); }
    }
    function copyUserId(id) { copyText(id || st.me.id, `ID (${id || st.me.id}) ကူးပြီးပါပြီ ✓`); }
    function copyProfileLink() { copyText(`${APP_URL}?u=${st.me.id}`, "Profile Link ကူးပြီးပါပြီ ✓"); }

    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }
    function remainingHours(untilTs) {
      const ms = Number(untilTs || 0) - Date.now();
      return ms <= 0 ? "" : Math.ceil(ms / 3600000) + " နာရီကျန်";
    }
    function isOnline(uid) {
      if (uid === st.me.id) return true;
      const ts = Number(st.presence[uid] || 0);
      return !!(ts && (Date.now() - ts < 15000));
    }
    function onlineText(uid) {
      if (isOnline(uid)) return "🟢 Online";
      const ts = Number(st.presence[uid] || 0);
      return ts ? "⚫ ဆင်းချိန် " + new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "⚫ Offline";
    }
    const onlineFriendsCount = () => (st.me.friends || []).filter(fid => isOnline(fid)).length;
    const isBoosted = p => !!(p && Number(p.boostedUntil || 0) > Date.now());
    const isNewUser = id => (Date.now() - (uInfo(id).createdAt || Date.now())) < 7 * 86400000;

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!st.audioCtx) st.audioCtx = new AC();
        if (st.audioCtx.state === "suspended") st.audioCtx.resume().catch(() => {});
        return st.audioCtx;
      } catch (e) { return null; }
    }
    document.addEventListener("pointerdown", () => { if (st.soundOn) ensureAudio(); }, { passive: true });
    function stopRingLoop() { if (st.ringTimer) { clearInterval(st.ringTimer); st.ringTimer = null; } }
    function startRingLoop() { stopRingLoop(); playSong("message"); st.ringTimer = setInterval(() => playSong("message"), 1600); }
    function playSong(kind) {
      if (!st.soundOn) return;
      const ctx = ensureAudio(); if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const seq = kind === "message" ? [659, 880, 1046] : kind === "love" ? [523, 659, 784, 1046] : kind === "angry" ? [220, 165] : [523, 784];
        seq.forEach((f, idx) => {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          g.gain.setValueAtTime(0.14, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.22);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.24);
        });
      } catch (e) {}
    }

      st.soundOn = !st.soundOn;
      if (!st.soundOn) stopRingLoop(); else playSong("notif");
      toast(st.soundOn ? "အသံပိုင်း ဖွင့်ပြီး" : "အသံပိုင်း ပိတ်ပြီး");
    }

    const uInfo = id => {
      const base = id === st.me.id ? st.me : (st.users[id] || { id: id || "PPW", name: id || "User", bio: "", photo: "", coverPhoto: "", note: "", noteAt: 0, city: "", gender: "", age: "", blueMark: false, friends: [], following: [], color: COLORS[0], createdAt: Date.now() });
      if (base.id === OWNER_ID) { base.blueMark = true; base.isAdmin = true; }
      return base;
    };

    function blueBadge(u) {
      if (!u || !u.blueMark) return "";
      return `<svg class="w-4 h-4 text-sky-400 shrink-0 inline-block" viewBox="0 0 24 24" fill="currentColor"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.513 1.158-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"/></svg>`;
    }

    function uRating(id) {
      const l = Object.values(st.reviews || {}).filter(r => r && r.targetId === id);
      if (!l.length) return { avg: "0.0", count: 0, list: [] };
      return { avg: (l.reduce((a, b) => a + (Number(b.rating) || 5), 0) / l.length).toFixed(1), count: l.length, list: l };
    }
    function followersCount(id) {
      let c = 0;
      Object.values(st.users || {}).forEach(u => { if (u && u.id !== id && Array.isArray(u.following) && u.following.includes(id)) c++; });
      return c;
    }

    function avatar(u, sz = "w-11 h-11 text-base", showOnline = true) {
      const x = typeof u === "string" ? uInfo(u) : (u || st.me);
      const onlineDot = showOnline && x && isOnline(x.id) ? `<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#0f172a]"></span>` : "";
      const inner = (x && x.photo)
        ? `<img src="${x.photo}" class="${sz} rounded-full object-cover shadow-sm border-2 border-emerald-500/40 bg-slate-800"/>`
        : `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shadow-sm">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
      return `<div class="relative inline-block shrink-0">${inner}${onlineDot}</div>`;
    }

    function totalReactions(p) {
      const rx = (p && p.reactions) || {};
      let sum = Object.keys((p && p.likes) || {}).length;
      Object.values(rx).forEach(map => { sum += Object.keys(map || {}).length; });
      return sum;
    }
    function userReaction(p) {
      const rx = (p && p.reactions) || {};
      for (const r of REACTIONS) { if (rx[r.key] && rx[r.key][st.me.id]) return r.key; }
      if (p && p.likes && p.likes[st.me.id]) return "like";
      return null;
    }
    function engagementScore(p) { return totalReactions(p) * 3 + Object.keys((p && p.comments) || {}).length * 5; }
    function feedScore(p) {
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      return engagementScore(p) * 2.5 + (24 / (1 + ageHours * 0.25)) + (isNewUser(p.authorId) ? 6 : 0);
    }
    function matchesCategoryOrTag(p, f) {
      if (!f || f === "အားလုံး" || f === "စိတ်ဝင်စားမှုများ" || f === "အသစ်ရောက်သူများ") return true;
      const txt = ((p.text || "") + " " + (p.tags || "")).toLowerCase();
      if (f === "YouTube Account") return p.category === "YouTube Account" || txt.includes("#youtube");
      if (f === "Facebook Page") return p.category === "Facebook Page" || txt.includes("#facebook") || txt.includes("#fb");
      if (f === "TikTok Account") return p.category === "TikTok Account" || txt.includes("#tiktok");
      return p.category === f;
    }
    function hasBlockedClothing(str) {
      const low = String(str || "").toLowerCase();
      return BLOCKED_PHYSICAL.some(k => low.includes(k));
    }

    async function fbGet(path, query = "") {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      try {
        const res = await fetch(`${DB}/${path}.json${query}`, { signal: controller.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    let syncBusy = false;
    async function sync(init = false) {
      if (syncBusy) return;
      syncBusy = true;
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncText");
      try {
        fbPut(`presence/${st.me.id}`, Date.now()).catch(() => {});
        if (init) fbPut(`users/${st.me.id}`, st.me).catch(() => {});

        // 1. Fetch latest 35 posts first
        const po = await fbGet("posts", '?orderBy="$key"&limitToLast=35');
        const rawPosts = po ? Object.values(po) : [];
        st.posts = rawPosts.filter(p => p && TRADE_CATS.includes(p.category) && !hasBlockedClothing(p.text) && (p.text || p.image));

        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-400";
        if (txt) txt.textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";

        const activeEl = document.activeElement;
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(activeEl ? activeEl.tagName : "")) render();

        // 2. Fetch secondary nodes (including full chat history & users)
        const [md, us, pr, rv, ap, br, no, ch, ty, cl] = await Promise.all([
          fbGet("myday", '?orderBy="$key"&limitToLast=20').catch(() => null),
          fbGet("users").catch(() => null),
          fbGet("presence").catch(() => null),
          fbGet("reviews").catch(() => null),
          fbGet("appeals").catch(() => null),
          fbGet("boostRequests").catch(() => null),
          fbGet(`notifications/${st.me.id}`).catch(() => null),
          fbGet("chats").catch(() => null),
          fbGet("typing").catch(() => null),
          fbGet("calls").catch(() => null)
        ]);

        const dayCutoff = Date.now() - 24 * 3600000;
        if (md) st.myday = Object.values(md).filter(d => d && (d.createdAt || 0) >= dayCutoff).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        if (us) {
          st.users = us;
          if (st.users[st.me.id]) {
            st.me.blueMark = st.me.id === OWNER_ID ? true : !!st.users[st.me.id].blueMark;
            if (st.users[st.me.id].isAdmin || st.me.id === OWNER_ID) st.me.isAdmin = true;
            if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
            if (!st.me.coverPhoto && st.users[st.me.id].coverPhoto) st.me.coverPhoto = st.users[st.me.id].coverPhoto;
            if (Array.isArray(st.users[st.me.id].friends) && st.users[st.me.id].friends.length > (st.me.friends || []).length) {
              st.me.friends = st.users[st.me.id].friends;
            }
            saveMe();
          }
        }
        st.users[st.me.id] = st.me;
        if (pr) st.presence = pr;
        if (rv) st.reviews = rv;
        if (ap) st.appeals = ap;
        if (br) st.boostRequests = br;
        if (ty) st.typing = ty;
        if (cl) st.calls = cl;

        if (no) {
          const nextNotifs = Object.values(no).filter(Boolean).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          let newNotifSong = false;
          nextNotifs.forEach(n => { if (!st.seenNotifIds[n.id]) { st.seenNotifIds[n.id] = true; if (!st.firstSync && !n.read) newNotifSong = true; } });
          st.notifs = nextNotifs;
          if (newNotifSong) playSong("notif");
        }

        if (ch) {
          let newMsgSong = false;
          Object.entries(ch).forEach(([rk, mObj]) => {
            if (!rk.includes(st.me.id)) return;
            Object.values(mObj || {}).forEach(m => { if (m && !st.seenMsgIds[m.id]) { st.seenMsgIds[m.id] = true; if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true; } });
          });
          st.chats = ch;
          if (newMsgSong) playSong("message");
        }

        let incomingCall = null;
        Object.values(st.calls || {}).forEach(c => {
          if (!c) return;
          if (c.status === "ringing" && c.toId === st.me.id && !st.seenCallIds[c.id]) { st.seenCallIds[c.id] = true; if (!st.firstSync) incomingCall = c; }
          if (st.activeCall && st.activeCall.id === c.id) { st.activeCall = c; if (c.status !== "ringing") stopRingLoop(); }
        });
        st.firstSync = false;
        saveFastCache();

        if (incomingCall && !st.activeCall) { st.activeCall = incomingCall; startRingLoop(); openCallModal(incomingCall.id); }
        if (st.chatUid && !st.me.hideSeen) markRoomSeen(st.chatUid);

        const unread = st.notifs.filter(n => !n.read).length;
        const nb = document.getElementById("notifBadge");
        if (nb) { if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden"); }

        const activeNow = document.activeElement;
        const tag = activeNow ? activeNow.tagName : "";
        const isTypingMsg = activeNow && activeNow.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) { render(); if (st.chatUid) renderMsgs(); }
        else if (st.chatUid && !isTypingMsg) renderMsgs();
        else if (st.chatUid) renderTypingBanner();
      } catch (e) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-400";
        if (txt) txt.textContent = "ချိတ်ဆက်မှု ပြန်စမ်းနေသည်…";
      } finally {
        syncBusy = false;
      }
    }

    function notify(toId, text) {
      if (!toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function switchTab(t) {
      st.tab = t; playSong("notif");
      document.querySelectorAll(".nav-btn").forEach(b => { b.removeAttribute("aria-current"); b.classList.remove("text-emerald-400"); b.classList.add("text-slate-400"); });
      const a = document.getElementById("nav-" + t);
      if (a) { a.setAttribute("aria-current", "page"); a.classList.remove("text-slate-400"); a.classList.add("text-emerald-400"); }
      if (t === "notifications") {
        st.notifs.filter(n => !n.read).forEach(n => { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); });
        const nb = document.getElementById("notifBadge"); if (nb) nb.classList.add("hidden");
      }
      render();
    }

    function getFilteredPosts() {
      let list = [...st.posts];
      if (st.cat === "စိတ်ဝင်စားမှုများ") list.sort((a, b) => engagementScore(b) - engagementScore(a));
      else if (st.cat === "အသစ်ရောက်သူများ") list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      else if (st.cat !== "အားလုံး") list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      list.sort((a, b) => (isBoosted(b) ? 1 : 0) - (isBoosted(a) ? 1 : 0));
      return list;
    }

    // Facebook-style 6-grid friends display (3 columns x 2 rows)
    function renderFriendsGrid(uid, limit = 6) {
      const u = uInfo(uid);
      const allFri = Array.isArray(u.friends) ? u.friends : [];
      const shown = allFri.slice(0, limit);
      if (!shown.length) {
        return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center text-sm text-slate-400">မိတ်ဆွေစာရင်း မရှိသေးပါ</div>`;
      }
      return `
        <div class="grid grid-cols-3 gap-2.5">
          ${shown.map(fid => {
            const fu = uInfo(fid);
            const photoHtml = fu.photo
              ? `<img src="${fu.photo}" class="w-full aspect-square object-cover bg-slate-800"/>`
              : `<div class="w-full aspect-square bg-gradient-to-br ${fu.color || COLORS[0]} text-white text-2xl font-bold flex items-center justify-center">${esc((fu.name || "U").trim().charAt(0).toUpperCase())}</div>`;
            return `
              <div onclick="openUserModal('${fu.id}')" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer active:scale-95 transition shadow-sm">
                <div class="relative">
                  ${photoHtml}
                  ${isOnline(fu.id) ? `<span class="absolute bottom-1.5 right-1.5 w-3 h-3 rounded-full bg-emerald-400 border-2 border-slate-900"></span>` : ""}
                </div>
                <div class="p-2">
                  <div class="text-xs font-bold text-slate-100 truncate flex items-center gap-0.5">${esc(fu.name)} ${blueBadge(fu)}</div>
                </div>
              </div>`;
          }).join("")}
        </div>
        ${allFri.length > limit ? `<button onclick="switchTab('friends')" class="w-full mt-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">မိတ်ဆွေအားလုံး ကြည့်ရန် (${allFri.length} ဦး)</button>` : ""}`;
    }

    function renderMyDayStrip() {
      const activeDays = st.myday.filter(d => d && (d.createdAt || 0) >= Date.now() - 24 * 3600000);
      return `<div class="bg-[#0f172a] px-3.5 py-3 border-b border-slate-800"><div class="flex items-center gap-3 overflow-x-auto no-scrollbar"><button onclick="openMyDayModal()" class="flex flex-col items-center gap-1.5 shrink-0"><div class="w-14 h-14 rounded-full bg-emerald-500/20 border-2 border-dashed border-emerald-400 text-emerald-300 flex items-center justify-center text-xl font-bold">+</div><span class="text-xs font-bold text-emerald-300">MyDay</span></button>${activeDays.map(d => { const du = uInfo(d.authorId); const vCnt = Object.keys(d.viewers || {}).length; return `<button onclick="viewMyDay('${d.id}')" class="flex flex-col items-center gap-1 shrink-0 max-w-[72px] relative"><div class="p-0.5 rounded-full bg-gradient-to-tr from-emerald-400 to-sky-400">${avatar(du, "w-14 h-14 text-base", false)}</div>${vCnt > 0 ? `<span class="absolute top-0 right-0 px-1.5 rounded-full bg-black/80 text-[10px] text-emerald-300 font-bold border border-emerald-500/40">👁️${vCnt}</span>` : ""}<span class="text-xs font-semibold text-slate-200 truncate w-full text-center">${esc(du.name)}</span></button>`; }).join("")}</div></div>`;
    }

    function render() {
      const el = document.getElementById("mainContent");
      if (!el) return;
      if (st.tab === "home") {
        const list = getFilteredPosts();
        el.innerHTML = `
          ${renderMyDayStrip()}
          <div class="bg-[#0f172a] px-3.5 py-3 border-b border-slate-800 flex flex-col items-center gap-2">
            <div onclick="openComposerModal()" class="cursor-pointer">${avatar(st.me, "w-14 h-14 text-lg")}</div>
            <button onclick="openComposerModal()" class="w-full text-center bg-slate-800 hover:bg-slate-700/80 text-slate-300 text-sm px-4 py-2.5 rounded-full font-medium">အရောင်းပို့စ်တင်ရန် (Page / YouTube / TikTok)...</button>
          </div>
          <div class="bg-[#0f172a] px-3 py-2.5 border-b border-slate-800 flex items-center gap-2 overflow-x-auto no-scrollbar">
            ${FEED_FILTERS.map(c => `<button onclick="st.cat='${c}';render()" class="px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap ${st.cat === c ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300"}">${c}</button>`).join("")}
          </div>
          <div class="px-3.5 pt-2.5 flex items-center justify-between text-xs text-slate-400 font-medium">
            <span>🔥 စိတ်ဝင်စားမှုများလေ လူတွေဆီ ပိုရောက်လေ</span>
            <button onclick="openRulesModal()" class="text-emerald-400 font-bold underline">စည်းမျဉ်းများ</button>
          </div>
          <div class="p-3 space-y-3.5">${list.length ? list.map(postCard).join("") : `<div class="bg-[#0f172a] rounded-2xl p-8 text-center border border-slate-800 text-sm text-slate-400">ဤကဏ္ဍတွင် အရောင်းပို့စ် မရှိသေးပါ — ပထမဆုံး ပို့စ်တင်ကြည့်ပါ!</div>`}</div>`;
      } else if (st.tab === "explore") {
        const q = st.q.trim().toLowerCase();
        const res = st.posts.filter(p => !q || [p.text, p.category, p.price, uInfo(p.authorId).name].join(" ").toLowerCase().includes(q));
        el.innerHTML = `<div class="p-3.5 space-y-3">
          <input type="search" value="${esc(st.q)}" oninput="st.q=this.value;render()" placeholder="စာသား၊ #hashtag၊ ရောင်းသူနာမည် ရှာရန်..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3.5 py-2.5 text-sm"/>
          <div class="grid grid-cols-2 gap-2.5">${TRADE_CATS.map(c => `<button onclick="st.cat='${c}';switchTab('home')" class="bg-[#0f172a] p-3.5 rounded-2xl border border-slate-800 text-left"><div class="text-sm font-bold text-white">${c}</div><div class="text-xs text-slate-400 mt-0.5">ပို့စ် ${st.posts.filter(p => matchesCategoryOrTag(p, c)).length} ခု</div></button>`).join("")}</div>
          <div class="space-y-3">${res.map(postCard).join("")}</div>
        </div>`;
      } else if (st.tab === "chats") {
        const rooms = Object.entries(st.chats || {}).filter(([k]) => k.includes(st.me.id));
        const others = Object.values(st.users).filter(u => u && u.id !== st.me.id);

utton onclick="openChat('${u.id}')" class="bg-[#0f172a] p-3 rounded-2xl border border-slate-800 flex flex-col items-center gap-1.5 min-w-[90px] shrink-0">${avatar(u, "w-12 h-12 text-base")}<span class="text-xs font-bold text-white truncate w-full text-center">${esc(u.name)}</span><span class="text-xs text-emerald-400 font-bold">စာပို့မည်</span></button>`).join("")}</div></div>` : ""}</div>`;

    function setReaction(pid, rKey) {
      const p = st.posts.find(x => x.id === pid); if (!p) return;

      const prev = userReaction(p);
      REACTIONS.forEach(r => { if (p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (prev !== rKey) {
        p.reactions[rKey][st.me.id] = true; playSong(rKey);
        notify(p.authorId, "က သင့်ပို့စ်ကို Reaction ပေးလိုက်ပါသည်");
        fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {});
      }
      render();
    }

      p.comments[cid] = c; inp.value = ""; playSong("notif"); render();
      notify(p.authorId, "က မှတ်ချက်ရေးခဲ့သည်: " + text.slice(0, 20));

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), mw = 640; let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; } c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h); st.img = c.toDataURL("image/jpeg", 0.68); document.getElementById("imgPrev").src = st.img; document.getElementById("imgBox").classList.remove("hidden"); }; im.src = ev.target.result; };
      r.readAsDataURL(f);
    }

      const c = st.activeCall || st.calls[cid]; if (!c) return;
      const o = uInfo(c.fromId === st.me.id ? c.toId : c.fromId), isIn = c.toId === st.me.id && c.status === "ringing";
      document.getElementById("modalRoot").innerHTML = `<div class="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4"><div class="bg-[#0f172a] border border-slate-700 w-full max-w-sm rounded-3xl p-6 text-center space-y-5"><div class="flex justify-center">${avatar(o, "w-20 h-20 text-2xl")}</div><div><h3 class="text-base font-bold text-white flex items-center justify-center gap-1">${esc(o.name)} ${blueBadge(o)}</h3><p class="text-sm text-emerald-400 font-semibold mt-1">${c.status === "connected" ? "🎙️ ဖုန်းပြောနေပါသည်..." : (isIn ? "🔔 ဖုန်းဝင်လာပါသည်..." : "📞 ခေါ်ဆိုနေပါသည်...")}</p></div><div class="flex justify-center gap-4">${isIn ? `<button onclick="answerCall('${c.id}')" class="px-5 py-3 rounded-full bg-emerald-600 text-white text-xs font-bold">✓ လက်ခံ</button>` : ""}<button onclick="endCall('${c.id}')" class="px-5 py-3 rounded-full bg-rose-600 text-white text-xs font-bold">✕ ဖုန်းချ</button></div></div></div>`;
    }
    function answerCall(cid) { stopRingLoop(); if (st.activeCall && st.activeCall.id === cid) st.activeCall.status = "connected"; playSong("like"); fbPut(`calls/${cid}/status`, "connected").catch(() => {}); openCallModal(cid); }
    function endCall(cid) { stopRingLoop(); if (st.activeCall && st.activeCall.id === cid) st.activeCall.status = "ended"; playSong("angry"); fbPut(`calls/${cid}/status`, "ended").catch(() => {}); st.activeCall = null; document.getElementById("modalRoot").innerHTML = ""; }

    function toggleHideSeen() {
      st.me.hideSeen = !st.me.hideSeen; saveMe(); playSong("notif");
      toast(st.me.hideSeen ? "Seen ပိတ်ပြီး" : "Seen ဖွင့်ပြီး");
      if (!st.me.hideSeen && st.chatUid) markRoomSeen(st.chatUid);
      if (st.chatUid) openChat(st.chatUid);
    }
    function markRoomSeen(oid) {
      if (!oid || st.me.hideSeen) return;
      const rid = roomId(st.me.id, oid), room = st.chats[rid]; if (!room) return;
      Object.values(room).forEach(m => { if (m && m.senderId !== st.me.id && !m.seenAt) { m.seenAt = Date.now(); fbPut(`chats/${rid}/${m.id}/seenAt`, m.seenAt).catch(() => {}); } });
    }
    function openDeleteMsgMenu(mid) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      const bar = document.getElementById("msgActionBar"); if (!bar) return;
      bar.innerHTML = `<div class="px-3 py-2 bg-slate-900 border-t border-slate-700 flex items-center justify-between gap-2 text-xs"><span class="text-slate-300 font-bold">ဖျက်ရန်:</span><div class="flex gap-1.5"><button onclick="deleteForMe('${mid}')" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-200 font-bold">မိမိဘက်ဖျက်</button>${m.senderId === st.me.id ? `<button onclick="deleteForEveryone('${mid}')" class="px-2.5 py-1.5 rounded-xl bg-rose-600 text-white font-bold">Everyone ဖျက်</button>` : ""}<button onclick="document.getElementById('msgActionBar').innerHTML=''" class="px-2 text-slate-400">✕</button></div></div>`;
    }
    function deleteForMe(mid) {
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      if (!m.deletedFor) m.deletedFor = {}; m.deletedFor[st.me.id] = true;
      document.getElementById("msgActionBar").innerHTML = ""; renderMsgs();
      fbPut(`chats/${rid}/${mid}/deletedFor/${st.me.id}`, true).catch(() => {});
    }
    function deleteForEveryone(mid) {
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      m.deletedForAll = true; m.text = "ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ"; m.image = ""; m.audio = ""; m.video = "";
      document.getElementById("msgActionBar").innerHTML = ""; renderMsgs();
      fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }
    function sendTyping(oid) { const rid = roomId(st.me.id, oid); if (!st.typing[rid]) st.typing[rid] = {}; st.typing[rid][st.me.id] = Date.now(); fbPut(`typing/${rid}/${st.me.id}`, Date.now()).catch(() => {}); }
    function renderTypingBanner() {
      const tb = document.getElementById("typingBanner"); if (!tb || !st.chatUid) return;
      const tObj = st.typing[roomId(st.me.id, st.chatUid)] || {};
      const active = Object.entries(tObj).some(([uid, ts]) => uid !== st.me.id && (Date.now() - Number(ts || 0) < 4500));
      if (active) { tb.innerHTML = `<span class="inline-flex text-xs font-bold text-emerald-300 bg-emerald-500/15 px-3 py-1 rounded-full">${esc(uInfo(st.chatUid).name)} စာရိုက်နေပါသည်...</span>`; tb.classList.remove("hidden"); }
      else tb.classList.add("hidden");
    }
    function toggleStickerBar() { st.showStickers = !st.showStickers; const sb = document.getElementById("stickerBar"); if (sb) sb.classList.toggle("hidden", !st.showStickers); }
    function sendStickerIcon(ic) { if (!st.chatUid) return; playSong("love"); sendChatPayload({ text: ic, image: "", audio: "", video: "" }); st.showStickers = false; const sb = document.getElementById("stickerBar"); if (sb) sb.classList.add("hidden"); }
    function sendQuickChat(txt) { if (!st.chatUid) return; sendChatPayload({ text: txt, image: "", audio: "", video: "" }); }

    function openChat(oid) {
      st.chatUid = oid; st.chatImg = null; st.chatVideo = null; st.showStickers = false; const o = uInfo(oid);
      if (!st.me.hideSeen) markRoomSeen(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center">
          <div class="bg-[#0b1120] border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl flex flex-col h-[88vh] animate-slide-up overflow-hidden">
            <div class="p-3 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between gap-2">
              <div onclick="openUserModal('${o.id}')" class="flex items-center gap-2 cursor-pointer min-w-0">${avatar(o, "w-10 h-10 text-sm")}<div class="min-w-0"><div class="text-[15px] font-bold text-white truncate flex items-center gap-1">${esc(o.name)} ${blueBadge(o)}</div><div class="text-[11px] text-emerald-300 truncate">${esc(onlineText(o.id))}</div></div></div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="toggleHideSeen()" class="px-2 py-1.5 rounded-full text-[11px] font-bold bg-slate-800 text-slate-200">${st.me.hideSeen ? "Seen ပိတ်" : "Seen ပြ"}</button>
                <button onclick="startVoiceCall('${o.id}')" class="px-2.5 py-1.5 rounded-full bg-emerald-600 text-white text-xs font-bold">📞</button>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-white text-xs font-bold">✕</button>
              </div>
            </div>
            <div id="msgBox" class="flex-1 p-3 overflow-y-auto space-y-2.5 bg-[#05080f]"></div>
            <div id="typingBanner" class="hidden px-3 py-1 bg-[#05080f]"></div>
            <div id="msgActionBar"></div>
            <div class="px-2.5 py-1.5 bg-[#0b1120] border-t border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${QUICK_CHATS.map(q => `<button onclick="sendQuickChat('${q}')" class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 text-[11px] text-slate-200 whitespace-nowrap shrink-0">${q}</button>`).join("")}
            </div>
            <div id="stickerBar" class="hidden p-2 bg-[#0f172a] border-t border-slate-800 grid grid-cols-6 gap-1.5">${STICKER_ICONS.map(ic => `<button onclick="sendStickerIcon('${ic}')" class="bg-slate-900 border border-slate-700 rounded-xl py-2 text-2xl">${ic}</button>`).join("")}</div>
            <div id="chatAttachPreview" class="hidden px-3 py-2 bg-[#0f172a] border-t border-slate-800 flex items-center justify-between"><div id="chatAttachLabel" class="flex items-center gap-2 text-xs text-emerald-300 font-bold"></div><button onclick="clearChatAttach()" class="text-xs text-rose-400 font-bold">✕</button></div>
            <div class="p-2 bg-[#0f172a] border-t border-slate-800 flex items-center gap-1">
              <button onclick="toggleStickerBar()" class="w-8 h-8 rounded-full bg-slate-800 text-amber-300 text-sm shrink-0">😄</button>
              <label class="w-8 h-8 rounded-full bg-slate-800 text-slate-200 text-sm flex items-center justify-center cursor-pointer shrink-0">📷<input type="file" accept="image/*" onchange="onPickChatImg(event)" class="hidden"/></label>
              <label class="w-8 h-8 rounded-full bg-slate-800 text-sky-300 text-sm flex items-center justify-center cursor-pointer shrink-0">🎬<input type="file" accept="video/*" onchange="onPickShortVideo(event)" class="hidden"/></label>
              <button onclick="toggleVoiceRec()" id="voiceBtn" class="w-8 h-8 rounded-full bg-slate-800 text-emerald-300 text-sm shrink-0">🎙️</button>
              <input id="msgInp" type="text" placeholder="စာရိုက်ပါ..." oninput="sendTyping('${oid}')" onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 min-w-0 bg-slate-900 text-white border border-slate-700 rounded-full px-3 py-2 text-sm focus:outline-none"/>
              <button onclick="sendMsg()" class="px-3.5 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold shrink-0">ပို့</button>
            </div>
          </div>
        </div>`;
      renderMsgs();
    }

    function clearChatAttach() { st.chatImg = null; st.chatVideo = null; const p = document.getElementById("chatAttachPreview"); if (p) p.classList.add("hidden"); }
    function onPickChatImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return; st.chatVideo = null;
      const r = new FileReader();
      r.onload = ev => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), mw = 640; let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; } c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h); st.chatImg = c.toDataURL("image/jpeg", 0.72); document.getElementById("chatAttachLabel").innerHTML = `<img src="${st.chatImg}" class="w-9 h-9 rounded-lg object-cover"/><span>ဓာတ်ပုံ</span>`; document.getElementById("chatAttachPreview").classList.remove("hidden"); }; im.src = ev.target.result; };
      r.readAsDataURL(f);
    }
    function onPickShortVideo(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (f.size > 4.5 * 1024 * 1024) { e.target.value = ""; return toast("၁၅ စက္ကန့်အတွင်း Short Video သာ ပို့နိုင်ပါသည်"); }
      const url = URL.createObjectURL(f), vid = document.createElement("video");
      vid.preload = "metadata";
      vid.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        if (vid.duration > 15.5) { e.target.value = ""; return toast("Short Video ၁၅ စက္ကန့်စာပဲ လက်ခံပါသည်"); }
        const reader = new FileReader();
        reader.onload = ev => { st.chatImg = null; st.chatVideo = ev.target.result; document.getElementById("chatAttachLabel").innerHTML = `<span>🎬 Video (${Math.round(vid.duration)}s)</span>`; document.getElementById("chatAttachPreview").classList.remove("hidden"); };
        reader.readAsDataURL(f);
      };
      vid.src = url;
    }
    async function toggleVoiceRec() {
      const btn = document.getElementById("voiceBtn");
      if (st.recorder && st.recorder.state === "recording") { st.recorder.stop(); if (btn) btn.className = "w-8 h-8 rounded-full bg-slate-800 text-emerald-300 text-sm shrink-0"; return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("အသံသွင်းစနစ် မရနိုင်ပါ");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = []; const rec = new MediaRecorder(stream); st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); const r = new FileReader(); r.onloadend = () => { if (st.chatUid) sendChatPayload({ text: "", image: "", audio: r.result, video: "" }); }; r.readAsDataURL(new Blob(st.audioChunks, { type: "audio/webm" })); };
        rec.start(); toast("အသံသွင်းနေပါသည်... ပို့ရန် 🎙️ ကို ထပ်နှိပ်ပါ");
        if (btn) btn.className = "w-8 h-8 rounded-full bg-rose-600 text-white text-sm animate-pulse shrink-0";
      } catch (e) { toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်"); }
    }
    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).filter(m => m && !(m.deletedFor && m.deletedFor[st.me.id])).sort((a, b) => a.createdAt - b.createdAt);
      const otherHideSeen = !!(uInfo(st.chatUid) && uInfo(st.chatUid).hideSeen);
      box.innerHTML = ms.length ? ms.map((m, i) => {
        const me = m.senderId === st.me.id, isPureSticker = !m.deletedForAll && !m.image && !m.audio && !m.video && STICKER_ICONS.includes((m.text || "").trim());
        const tick = me ? (m.seenAt && !otherHideSeen ? `<span class="text-sky-300 font-bold">✓✓</span>` : `<span class="text-emerald-200 font-bold">✓</span>`) : "";
        return `<div class="flex items-end gap-1.5 ${me ? "justify-end" : "justify-start"}">${!me ? `<span class="w-5 h-5 rounded-full bg-slate-800 text-slate-300 text-[10px] font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}<div onclick="openDeleteMsgMenu('${m.id}')" class="cursor-pointer ${isPureSticker ? "text-5xl py-1 px-2" : `max-w-[78%] px-3.5 py-2 rounded-2xl text-sm space-y-1.5 ${me ? "bg-emerald-600 text-white" : "bg-[#0f172a] border border-slate-800 text-slate-100"}`}">${m.deletedForAll ? `<div class="italic text-xs opacity-75">🚫 ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ</div>` : `${m.image ? `<img onclick="event.stopPropagation();openImageViewer(this.src)" src="${m.image}" class="rounded-xl max-h-48 object-cover cursor-zoom-in"/>` : ""}${m.video ? `<video controls playsinline src="${m.video}" class="rounded-xl max-h-52 w-56 bg-black"></video>` : ""}${m.audio ? `<audio controls src="${m.audio}" class="w-48 h-8"></audio>` : ""}${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}`}${me ? `<div class="text-[10px] text-right">${tick}</div>` : ""}</div>${me ? `<span class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-bold flex items-center justify-center shrink-0">${i + 1}</span>` : ""}</div>`;
      }).join("") : `<p class="text-sm text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;
      renderTypingBanner();
    }
    function sendChatPayload({ text, image, audio, video }) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), mid = "M-" + Date.now();
      const m = { id: mid, senderId: st.me.id, text: text || "", image: image || "", audio: audio || "", video: video || "", seenAt: 0, deletedFor: {}, deletedForAll: false, createdAt: Date.now() };
      if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
      clearChatAttach(); fbPut(`typing/${rid}/${st.me.id}`, 0).catch(() => {}); renderMsgs();
      notify(st.chatUid, "က စာပို့လိုက်သည်"); fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }
    function sendMsg() {
      const inp = document.getElementById("msgInp"); if (!inp || !st.chatUid) return;
      const text = inp.value.trim(); if (!text && !st.chatImg && !st.chatVideo) return;
      sendChatPayload({ text, image: st.chatImg || "", audio: "", video: st.chatVideo || "" }); inp.value = "";
    }
    function closeModal() {
      stopRingLoop();
      if (st.chatUid) fbPut(`typing/${roomId(st.me.id, st.chatUid)}/${st.me.id}`, 0).catch(() => {});
      if (st.recorder && st.recorder.state === "recording") { try { st.recorder.stop(); } catch (e) {} }
      st.chatUid = null; st.activeCall = null; st.showStickers = false;
      document.getElementById("modalRoot").innerHTML = "";
    }

    render();
    sync(true);
    setInterval(() => sync(false), 3500);
  </script>
</body>
</html>
