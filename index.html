<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ဖြေးဖြေး ဝယ် - Phay Phay Wae</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#020617; color:#f1f5f9; font-family:system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    @keyframes pop { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
    .animate-pop { animation:pop .15s ease-out; }
  </style>
</head>
<body class="min-h-screen pb-20 select-none">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="hidden fixed inset-0 z-50 bg-[#020617] flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-[#0f172a] border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-600 flex items-center justify-center text-2xl font-bold">🛍️</div>
        <h1 class="text-xl font-bold text-white">ဖြေးဖြေး ဝယ်</h1>
        <p class="text-xs text-slate-400">Page / Account ရောင်းဝယ်ရေး စနစ်</p>
      </div>
      <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-2xl">
        <button id="btnModeLogin" onclick="setAuthMode('login')" class="py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white">အကောင့်ဝင်</button>
        <button id="btnModeReg" onclick="setAuthMode('reg')" class="py-2 rounded-xl text-sm font-bold text-slate-400">အသစ်ဖွင့်</button>
      </div>
      <div class="space-y-3">
        <input id="authName" type="text" placeholder="အမည် (ဥပမာ - ကိုပိုင်)" class="hidden w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white" />
        <input id="authPhone" type="text" placeholder="ဖုန်းနံပါတ် (သို့) User ID (PPW-...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white" />
        <input id="authPass" type="password" placeholder="Password (လျှို့ဝှက်နံပါတ်)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white" />
        <div id="authErr" class="hidden text-xs text-rose-300 bg-rose-950/60 border border-rose-500/40 rounded-xl px-3 py-2"></div>
        <button onclick="submitAuth()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm">ဝင်ရောက်မည်</button>
      </div>
    </div>
  </div>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-[#020617]/90 backdrop-blur border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div onclick="switchTab('home')" class="flex items-center gap-2 cursor-pointer">
      <span class="text-lg font-extrabold text-emerald-400">ဖြေးဖြေး ဝယ်</span>
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="switchTab('search')" class="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-sm">🔍</button>
      <button onclick="switchTab('notifications')" class="relative w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-sm">
        🔔<span id="notifBadge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-[10px] font-bold text-white flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="mainContent" class="max-w-lg mx-auto pb-6"></main>

  <!-- BOTTOM NAVIGATION (iPhone Style) -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-[#0f172a]/95 backdrop-blur border-t border-slate-800 px-3 py-2">
    <div class="max-w-lg mx-auto grid grid-cols-5 items-center text-center">
      <button data-tab="home" onclick="switchTab('home')" class="dock-btn flex flex-col items-center gap-0.5 text-emerald-400">
        <span class="text-xl">🏠</span><span class="text-[10px] font-bold">ပင်မ</span>
      </button>
      <button data-tab="search" onclick="switchTab('search')" class="dock-btn flex flex-col items-center gap-0.5 text-slate-400">
        <span class="text-xl">🔍</span><span class="text-[10px] font-bold">ရှာဖွေ</span>
      </button>
      <button onclick="openComposerModal()" class="flex flex-col items-center">
        <span class="w-11 h-11 rounded-2xl bg-emerald-600 text-white text-2xl font-bold flex items-center justify-center shadow-lg shadow-emerald-600/30">+</span>
      </button>
      <button data-tab="chat" onclick="switchTab('chat')" class="dock-btn relative flex flex-col items-center gap-0.5 text-slate-400">
        <span class="text-xl">💬</span><span class="text-[10px] font-bold">စာတို</span>
      </button>
      <button data-tab="profile" onclick="switchTab('profile')" class="dock-btn flex flex-col items-center gap-0.5 text-slate-400">
        <span class="text-xl">👤</span><span class="text-[10px] font-bold">Profile</span>
      </button>
    </div>
  </nav>

  <!-- MODAL ROOT & TOAST -->
  <div id="modalRoot"></div>
  <div id="toastBox" class="fixed top-16 inset-x-0 z-[90] flex justify-center pointer-events-none px-4"></div>

  <script>
    // =========================================================================
    // PHAY PHAY WAE - ALL-IN-ONE MASTER ENGINE (Fast, Clean, Data-Safe)
    // =========================================================================
    const DB = "https://phay-phay-wae-default-rtdb.asia-southeast1.firebasedatabase.app";
    const REACTIONS = [
      { key: "like", icon: "👍" },
      { key: "love", icon: "❤️" },
      { key: "haha", icon: "😂" },
      { key: "angry", icon: "😡" }
    ];
    const MSG_RX = ["❤️", "😂", "😮", "😢", "😡", "👍"];
    const WAVE_H = [35, 65, 45, 90, 55, 100, 75, 40, 85, 95, 60, 45, 80, 100, 70, 50, 85, 60, 40, 75, 50, 35];

    const st = {
      me: JSON.parse(localStorage.getItem("ppw_me") || "null"),
      tab: "home",
      authMode: "login",
      users: {},
      posts: [],
      chats: {},
      notifs: [],
      openCmt: {},
      cmtReply: {},
      postMentions: {},
      chatUid: null,
      replyTarget: null,
      viewProfileUid: null,
      soundOn: true,
      lastMsgHtmlSig: ""
    };

    let _roomTimer = null, _recorder = null, _recChunks = [], _recAt = 0;
    let _playingAudio = null, _playingMid = null, _actx = null;

    const saveMe = () => localStorage.setItem("ppw_me", JSON.stringify(st.me));
    const canonRid = (a, b) => [String(a), String(b)].sort().join("_");

    // FIREBASE REST HELPERS
    async function fbGet(path) {
      const r = await fetch(`${DB}/${path}.json`);
      return r.ok ? r.json() : null;
    }
    async function fbPut(path, data) {
      return fetch(`${DB}/${path}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    }
    async function fbDel(path) {
      return fetch(`${DB}/${path}.json`, { method: "DELETE" });
    }

    // UTILS
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
    function ago(ts) {
      const d = Math.max(1, Math.floor((Date.now() - (ts || Date.now())) / 1000));
      if (d < 60) return d + "s";
      if (d < 3600) return Math.floor(d / 60) + "m";
      if (d < 86400) return Math.floor(d / 3600) + "h";
      return Math.floor(d / 86400) + "d";
    }
    function fmtS(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }
    function toast(msg) {
      const b = document.getElementById("toastBox");
      if (!b) return;
      b.innerHTML = `<div class="bg-slate-800 border border-emerald-500/40 text-white text-xs font-bold px-4 py-2 rounded-full shadow-xl animate-pop">${esc(msg)}</div>`;
      setTimeout(() => { if (b) b.innerHTML = ""; }, 2400);
    }
    function uInfo(uid) {
      return (st.users && st.users[uid]) || { id: uid, name: uid || "User" };
    }
    function blueBadge(u) {
      return (u && u.blueMark) ? `<span class="text-sky-400 text-xs">☑️</span>` : "";
    }
    function avatar(u, cls = "w-10 h-10 text-sm") {
      if (u && u.avatar) return `<img src="${u.avatar}" class="${cls} rounded-full object-cover border border-slate-700 shrink-0" />`;
      const ch = ((u && u.name) || "U").trim().charAt(0).toUpperCase();
      return `<div class="${cls} rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center shrink-0">${esc(ch)}</div>`;
    }

    // DISTINCT UI SOUND EFFECTS (Message Pop vs Notification Chime vs Reaction Pop)
    function playSong(kind) {
      if (!st.soundOn) return;
      try {
        if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
        if (_actx.state === "suspended") _actx.resume().catch(() => {});
        const now = _actx.currentTime;
        if (kind === "message") {
          const o = _actx.createOscillator(), g = _actx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(520, now);
          o.frequency.exponentialRampToValueAtTime(920, now + 0.07);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(0.2, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
          o.connect(g); g.connect(_actx.destination);
          o.start(now); o.stop(now + 0.14);
        } else if (kind === "notif") {
          [1046.5, 1567.98].forEach((f, i) => {
            const o = _actx.createOscillator(), g = _actx.createGain();
            o.type = "triangle";
            o.frequency.setValueAtTime(f, now + i * 0.05);
            g.gain.setValueAtTime(0.001, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.15, now + i * 0.05 + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.35);
            o.connect(g); g.connect(_actx.destination);
            o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.38);
          });
        } else {
          const o = _actx.createOscillator(), g = _actx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(380, now);
          o.frequency.exponentialRampToValueAtTime(760, now + 0.07);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(0.15, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          o.connect(g); g.connect(_actx.destination);
          o.start(now); o.stop(now + 0.11);
        }
      } catch (e) {}
    }

    // AUTH (Phone OR User ID)
    function setAuthMode(m) {
      st.authMode = m;
      document.getElementById("authName").classList.toggle("hidden", m !== "reg");
      document.getElementById("btnModeLogin").className = m === "login" ? "py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white" : "py-2 rounded-xl text-sm font-bold text-slate-400";
      document.getElementById("btnModeReg").className = m === "reg" ? "py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white" : "py-2 rounded-xl text-sm font-bold text-slate-400";
      document.getElementById("authErr").classList.add("hidden");
    }
    async function submitAuth() {
      const raw = document.getElementById("authPhone").value.trim();
      const pass = document.getElementById("authPass").value.trim();
      const name = document.getElementById("authName").value.trim();
      const errEl = document.getElementById("authErr");
      const showErr = (t) => { errEl.textContent = t; errEl.classList.remove("hidden"); };
      if (!raw || !pass) return showErr("ဖုန်းနံပါတ်/ID နှင့် Password ထည့်ပါ");

      const us = (await fbGet("users").catch(() => null)) || {};
      st.users = us;
      const cleanP = raw.replace(/\D/g, "");

      if (st.authMode === "login") {
        const found = us[raw] || Object.values(us).find(u => u && (u.id === raw || (u.phone && u.phone.replace(/\D/g, "") === cleanP)));
        if (!found) return showErr("အကောင့်မတွေ့ပါ — User ID (သို့) ဖုန်းနံပါတ် ပြန်စစ်ပါ");
        if (String(found.password || "") !== pass) return showErr("Password မှားနေပါသည်");
        st.me = found;
      } else {
        if (!name) return showErr("အမည်ထည့်ပါ");
        const id = "PPW-" + Math.floor(100000 + Math.random() * 900000);
        st.me = { id, name, phone: raw, password: pass, friends: [], createdAt: Date.now() };
        await fbPut(`users/${id}`, st.me);
      }
      saveMe();
      document.getElementById("authScreen").classList.add("hidden");
      bootApp();
    }
    function logoutApp() {
      if (!confirm("အကောင့်ထွက်မလား?")) return;
      localStorage.removeItem("ppw_me");
      location.reload();
    }

    // NOTIFICATIONS
    function notify(toId, text, postId = "", kind = "") {
      if (!st.me || !toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, postId, kind, read: false, createdAt: Date.now() }).catch(() => {});
    }
    function updateNotifBadge() {
      const unread = st.notifs.filter(n => n && !n.read).length;
      const b = document.getElementById("notifBadge");
      if (!b) return;
      b.textContent = unread > 9 ? "9+" : unread;
      b.classList.toggle("hidden", !unread);
    }

    // NAVIGATION & DATA SYNC
    function switchTab(t) {
      st.tab = t;
      st.viewProfileUid = null;
      document.querySelectorAll(".dock-btn").forEach(b => {
        b.classList.toggle("text-emerald-400", b.dataset.tab === t);
        b.classList.toggle("text-slate-400", b.dataset.tab !== t);
      });
      render();
      if (t === "chat") pullAllChats();
      if (t === "notifications" && st.me) {
        st.notifs.forEach(n => { if (!n.read) { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); } });
        updateNotifBadge();
      }
    }
    function openUserProfile(uid) {
      st.viewProfileUid = uid;
      st.tab = "profile";
      render();
    }
    async function syncAll() {
      if (!st.me || !navigator.onLine) return;
      try {
        const [us, ps, ns] = await Promise.all([
          fbGet("users").catch(() => null),
          fbGet("posts").catch(() => null),
          fbGet(`notifications/${st.me.id}`).catch(() => null)
        ]);
        if (us && typeof us === "object") {
          st.users = { ...st.users, ...us };
          if (st.users[st.me.id]) { st.me = { ...st.me, ...st.users[st.me.id] }; saveMe(); }
        }
        if (ps && typeof ps === "object") {
          st.posts = Object.values(ps).filter(p => p && p.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }
        if (ns && typeof ns === "object") {
          st.notifs = Object.values(ns).filter(Boolean).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          updateNotifBadge();
        }
        if (!st.chatUid) render();
      } catch (e) {}
    }

    // POSTS, FRIENDS-ONLY @MENTION & THREADED COMMENTS
    function openComposerModal() {
      st.postMentions = {};
      document.getElementById("modalRoot").innerHTML = `
        <div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/80 flex items-end sm:items-center justify-center p-3">
          <div onclick="event.stopPropagation()" class="w-full max-w-md bg-[#0f172a] border border-slate-700 rounded-3xl p-4 space-y-3 animate-pop">
            <div class="flex justify-between items-center"><h3 class="font-bold text-white">ပို့စ်အသစ်တင်ရန်</h3><button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-xs">✕</button></div>
            <textarea id="postTxt" rows="4" placeholder="ဘာတွေမျှဝေမလဲ... (@ ရိုက်ပြီး Friend ခေါ်နိုင်သည်)" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3 text-sm text-white"></textarea>
            <button type="button" onclick="triggerAtMention()" class="px-3 py-1 rounded-full bg-sky-500/20 border border-sky-500/40 text-sky-300 text-xs font-bold">@ Mention (Friend ခေါ်ရန်)</button>
            <div id="mentionBox" class="hidden bg-slate-900 border border-sky-500/40 rounded-2xl p-2 space-y-1 max-h-36 overflow-y-auto"></div>
            <button onclick="submitPost()" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">တင်မည်</button>
          </div>
        </div>`;
      const ta = document.getElementById("postTxt");
      ta.addEventListener("input", checkMentionList);
    }
    function triggerAtMention() {
      const ta = document.getElementById("postTxt");
      if (!ta) return;
      const pos = ta.selectionStart || ta.value.length;
      const ins = (pos > 0 && !/\s$/.test(ta.value.slice(0, pos))) ? " @" : "@";
      ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(pos);
      ta.setSelectionRange(pos + ins.length, pos + ins.length);
      ta.focus();
      checkMentionList();
    }
    function checkMentionList() {
      const ta = document.getElementById("postTxt"), box = document.getElementById("mentionBox");
      if (!ta || !box) return;
      const m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/);
      if (!m) { box.classList.add("hidden"); return; }
      const kw = m[1].toLowerCase();
      const fri = (st.me.friends || []).map(id => uInfo(id)).filter(u => !kw || (u.name || "").toLowerCase().includes(kw));
      box.innerHTML = fri.length
        ? fri.map(u => `<button type="button" onclick="pickMention('${u.id}','${esc(u.name).replace(/'/g, "\\'")}')" class="w-full p-2 rounded-xl hover:bg-slate-800 flex items-center gap-2 text-left">${avatar(u, "w-7 h-7 text-xs")}<span class="text-sm font-bold text-white">${esc(u.name)}</span></button>`).join("")
        : `<div class="text-xs text-slate-400 p-1">👥 Friend ဖြစ်ပြီးသားသူသာ Mention ခေါ်နိုင်သည်</div>`;
      box.classList.remove("hidden");
    }
    function pickMention(uid, name) {
      const ta = document.getElementById("postTxt");
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, `@${name} `) + ta.value.slice(pos);
      st.postMentions[name] = uid;
      document.getElementById("mentionBox").classList.add("hidden");
      playSong("like");
      ta.focus();
    }
    async function submitPost() {
      const text = (document.getElementById("postTxt").value || "").trim();
      if (!text) return;
      const pid = "P-" + Date.now();
      const used = {};
      Object.entries(st.postMentions).forEach(([n, id]) => { if (text.includes("@" + n)) used[n] = id; });
      const p = { id: pid, authorId: st.me.id, text, mentions: used, reactions: {}, comments: {}, createdAt: Date.now() };
      st.posts.unshift(p);
      closeModal();
      render();
      await fbPut(`posts/${pid}`, p).catch(() => {});
      Object.values(used).forEach(uid => notify(uid, "က ပို့စ်ထဲတွင် သင့်ကို @Mention ခေါ်ထားပါသည်", pid, "mention"));
      playSong("notif");
      toast("ပို့စ်တင်ပြီးပါပြီ");
    }
    function setReaction(pid, rKey) {
      const p = st.posts.find(x => x.id === pid);
      if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const already = p.reactions[rKey][st.me.id];
      REACTIONS.forEach(r => { if (p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (!already) {
        p.reactions[rKey][st.me.id] = true;
        playSong("like");
        notify(p.authorId, `က သင့်ပို့စ်ကို ${REACTIONS.find(r => r.key === rKey).icon} Reaction ပေးလိုက်သည်`, pid, "reaction");
        fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {});
      }
      render();
    }
    function startCmtReply(pid, parentId, uid, name) {
      st.cmtReply[pid] = { parentId, replyToUid: uid, replyToName: name };
      render();
      setTimeout(() => { const i = document.getElementById("ci-" + pid); if (i) i.focus(); }, 40);
    }
    async function addCmt(pid) {
      const inp = document.getElementById("ci-" + pid);
      const text = (inp && inp.value.trim()) || "";
      if (!text) return;
      const p = st.posts.find(x => x.id === pid);
      if (!p) return;
      if (!p.comments) p.comments = {};
      const rep = st.cmtReply[pid] || null;
      const cid = "C-" + Date.now();
      const c = { id: cid, authorId: st.me.id, text, parentId: rep ? rep.parentId : "", replyToUid: rep ? rep.replyToUid : "", replyToName: rep ? rep.replyToName : "", createdAt: Date.now() };
      p.comments[cid] = c;
      delete st.cmtReply[pid];
      inp.value = "";
      render();
      if (rep && rep.replyToUid) notify(rep.replyToUid, "က သင့်မှတ်ချက်ကို Reply ပြန်သည်", pid, "comment");

    // ULTRA-FAST TWO-WAY CHAT & MESSENGER WAVEFORM VOICE
    async function pullAllChats() {

    async function sendPayload({ text = "", audio = "", audioDur = 0 }) {
      if (!st.chatUid || !st.me) return;
      const rid = canonRid(st.me.id, st.chatUid);
      const mid = `M-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      const m = {
        id: mid, senderId: st.me.id, text, audio, audioDur,
        replyTo: st.replyTarget ? { ...st.replyTarget } : null,
        createdAt: Date.now(), _status: "sending"
      };
      st.replyTarget = null;
      const rb = document.getElementById("replyBar");
      if (rb) rb.classList.add("hidden");

      if (!st.chats[rid]) st.chats[rid] = {};
      st.chats[rid][mid] = m;
      st.lastMsgHtmlSig = "";
      renderMsgs();

      try {
        const payload = { ...m }; delete payload._status;
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        const res = await fetch(`${DB}/chats/${rid}/${mid}.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload), signal: ctrl.signal
        });
        clearTimeout(t);
        if (!res.ok) throw new Error("HTTP");
        m._status = "sent";
        playSong("message");
        notify(st.chatUid, "က မက်ဆေ့ချ် ပို့လိုက်သည်", "", "message");
      } catch (e) {
        m._status = "failed";
      }
      st.lastMsgHtmlSig = "";
      renderMsgs();
    }
    function sendTextMsg() {
      const inp = document.getElementById("msgInp");
      const txt = (inp && inp.value.trim()) || "";
      if (!txt) return;
      inp.value = "";
      sendPayload({ text: txt });
    }
    async function toggleVoiceRec() {
      const btn = document.getElementById("micBtn");
      if (_recorder && _recorder.state === "recording") {
        _recorder.stop();
        if (btn) { btn.textContent = "🎙️"; btn.classList.remove("bg-rose-600"); }
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        _recChunks = [];
        _recAt = Date.now();
        _recorder = new MediaRecorder(stream);
        _recorder.ondataavailable = e => { if (e.data.size > 0) _recChunks.push(e.data); };
        _recorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const dur = Math.max(1, Math.round((Date.now() - _recAt) / 1000));
          const reader = new FileReader();
          reader.onloadend = () => sendPayload({ audio: reader.result, audioDur: dur });
          reader.readAsDataURL(new Blob(_recChunks, { type: "audio/webm" }));
        };
        _recorder.start();
        if (btn) { btn.textContent = "⏹️"; btn.classList.add("bg-rose-600"); }
      } catch (e) {
        toast("Microphone ခွင့်ပြုချက် လိုအပ်ပါသည်");
      }
    }
    function toggleVoicePlay(mid, rid) {
      const m = st.chats[rid] && st.chats[rid][mid];
      if (!m || !m.audio) return;
      if (_playingMid === mid && _playingAudio) {
        if (!_playingAudio.paused) { _playingAudio.pause(); document.getElementById("aud-btn-" + mid).textContent = "▶"; }
        else { _playingAudio.play(); document.getElementById("aud-btn-" + mid).textContent = "⏸"; }
        return;
      }
      if (_playingAudio) { _playingAudio.pause(); const ob = document.getElementById("aud-btn-" + _playingMid); if (ob) ob.textContent = "▶"; }
      const aud = new Audio(m.audio);
      _playingAudio = aud; _playingMid = mid;
      document.getElementById("aud-btn-" + mid).textContent = "⏸";
      aud.onended = () => { document.getElementById("aud-btn-" + mid).textContent = "▶"; _playingMid = null; };
      aud.play().catch(() => {});
    }
    function openMsgMenu(mid) {

        <div class="flex justify-between items-center"><h3 class="font-bold text-sky-300">↪️ Forward ပို့ရန်</h3><button onclick="document.getElementById('fwdOv').remove()" class="w-8 h-8 rounded-full bg-slate-800 text-xs">✕</button></div>
        <div class="flex-1 overflow-y-auto space-y-2">${targets.map(u => `<div class="p-2.5 rounded-2xl bg-slate-900 flex items-center justify-between gap-2"><div class="flex items-center gap-2 min-w-0">${avatar(u, "w-8 h-8 text-xs")}<span class="text-sm font-bold text-white truncate">${esc(u.name)}</span></div><button onclick="sendForward('${srcRid}','${mid}','${u.id}',this)" class="px-3.5 py-1.5 rounded-xl bg-sky-600 text-xs font-bold text-white">ပို့</button></div>`).join("")}</div>

    async function sendForward(srcRid, mid, toUid, btn) {
      const src = st.chats[srcRid] && st.chats[srcRid][mid];
      if (!src) return;
      if (btn) { btn.disabled = true; btn.textContent = "✓"; }
      const tRid = canonRid(st.me.id, toUid);
      const nMid = `M-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      const fwd = { id: nMid, senderId: st.me.id, text: src.text || "", audio: src.audio || "", audioDur: Number(src.audioDur || 0), forwarded: true, createdAt: Date.now() };
      if (!st.chats[tRid]) st.chats[tRid] = {};
      st.chats[tRid][nMid] = { ...fwd, _status: "sent" };
      await fbPut(`chats/${tRid}/${nMid}`, fwd).catch(() => {});
      notify(toUid, "က မက်ဆေ့ချ် Forward ပို့လိုက်သည် ↪️", "", "message");
      toast("✓ Forward ပို့ပြီးပါပြီ");

    function setReply(rid, mid) {

    function bindSwipeReply() {
      const box = document.getElementById("msgBox");
      let sx = 0, mid = "";
      box.addEventListener("touchstart", e => { const b = e.target.closest("[data-mid]"); if (b) { sx = e.touches[0].clientX; mid = b.dataset.mid; } }, { passive: true });
      box.addEventListener("touchend", e => { if (mid && e.changedTouches[0].clientX - sx > 50) setReply(canonRid(st.me.id, st.chatUid), mid); mid = ""; }, { passive: true });

    function renderMsgs() {
      const box = document.getElementById("msgBox");

      const rid = canonRid(st.me.id, st.chatUid);
      const ms = Object.values(st.chats[rid] || {}).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const sig = ms.map(m => `${m.id}_${m._status || "s"}_${m.reactions ? Object.values(m.reactions).join("") : ""}`).join("|");
      if (sig === st.lastMsgHtmlSig) return;
      st.lastMsgHtmlSig = sig;
      box.innerHTML = ms.map(m => {
        const me = m.senderId === st.me.id;

        </div>`;
      } else if (st.tab === "notifications") {
        el.innerHTML = `<div class="p-3.5 space-y-2.5"><h2 class="font-bold text-base">🔔 အသိပေးချက်များ</h2>${st.notifs.length ? st.notifs.map((n, i) => `<div onclick="openNotifTarget(${i})" class="p-3 rounded-2xl bg-[#0f172a] border border-slate-800 flex items-center gap-3 cursor-pointer">${avatar(uInfo(n.fromId), "w-9 h-9 text-xs")}<div class="flex-1 min-w-0"><div class="text-xs text-slate-100"><b>${esc(n.fromName || uInfo(n.fromId).name)}</b> ${esc(n.text)}</div><div class="text-[10px] text-slate-500">${ago(n.createdAt)}</div></div></div>`).join("") : `<div class="text-center text-slate-400 py-10 text-sm">အသိပေးချက် မရှိသေးပါ</div>`}</div>`;
      } else if (st.tab === "search") {
        const us = Object.values(st.users).filter(u => u && u.id !== st.me.id);
        el.innerHTML = `<div class="p-3.5 space-y-2.5"><h2 class="font-bold text-base">🔍 အသုံးပြုသူများ</h2>${us.map(u => `<div class="p-3 rounded-2xl bg-[#0f172a] border border-slate-800 flex items-center justify-between"><div onclick="openUserProfile('${u.id}')" class="flex items-center gap-2.5 cursor-pointer">${avatar(u)}<div><div class="text-sm font-bold text-white">${esc(u.name)} ${blueBadge(u)}</div><div class="text-[11px] text-slate-400">${esc(u.id)}</div></div></div><button onclick="openChat('${u.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-xs font-bold text-white">စာပို့</button></div>`).join("")}</div>`;
      } else if (st.tab === "profile") {
        const u = uInfo(st.viewProfileUid || st.me.id);
        const isMe = u.id === st.me.id;
        el.innerHTML = `<div class="p-4"><div class="bg-[#0f172a] border border-slate-800 rounded-3xl p-5 text-center space-y-2">
          <div class="flex justify-center">${avatar(u, "w-20 h-20 text-2xl")}</div>
          <h2 class="text-lg font-bold text-white">${esc(u.name)} ${blueBadge(u)}</h2>
          <div class="text-xs text-slate-400 font-mono">${esc(u.id)}</div>
          <div class="pt-2 flex justify-center gap-2">
            ${isMe ? `<button onclick="logoutApp()" class="px-4 py-2 rounded-xl bg-rose-600/20 border border-rose-500/40 text-rose-300 text-xs font-bold">အကောင့်ထွက်မည်</button>` : `<button onclick="openChat('${u.id}')" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">💬 စာပို့မည်</button>`}
          </div>
        </div></div>`;
      }
    }

    function closeModal() {
      closeChatRoom();
      document.getElementById("modalRoot").innerHTML = "";
    }
    function bootApp() {
      render();
      syncAll();
      pullAllChats();
    }

    if (!st.me) {
      document.getElementById("authScreen").classList.remove("hidden");
      setAuthMode("login");
    } else {
      bootApp();
    }
    setInterval(() => { if (st.me && !document.hidden && navigator.onLine) syncAll(); }, 12000);
  </script>
</body>
</html>
