      if (!s || !s.id) return null;
      const isOwner = s.id === OWNER_ID;

        coverPhoto: s.coverPhoto || "",
        note: s.note || "",
        noteAt: s.noteAt || 0,
        city: s.city || "",
        gender: s.gender || "",
        age: s.age || "",

    async function submitAuth() {
      const rawInput = (document.getElementById("authPhone").value || "").trim();
      const phone = cleanPhone(rawInput);
      const upperId = rawInput.toUpperCase();
      const pass = (document.getElementById("authPass").value || "").trim();
      const name = (document.getElementById("authName").value || "").trim();
      const btn = document.getElementById("authSubmitBtn");

      const isIdLogin = st.authMode === "login" && upperId.startsWith("PPW-");
      if (!isIdLogin && phone.length < 7) return showAuthErr("ဖုန်းနံပါတ် (သို့) User ID မှန်ကန်စွာ ထည့်ပေးပါ");
      if (pass.length < 4) return showAuthErr("Password အနည်းဆုံး ၄ လုံး ထည့်ပေးပါ");
      if (st.authMode === "register" && !name) return showAuthErr("သင့်နာမည်အရင်း ထည့်ပေးပါ");

      btn.disabled = true;
      btn.textContent = "စစ်ဆေးနေသည်...";
      document.getElementById("authErr").classList.add("hidden");

      try {
        const allUsers = (await fbGet("users")) || {};
        st.users = allUsers;
        const userList = Object.values(allUsers).filter(Boolean);

        if (st.authMode === "register") {
          const exists = userList.find(u => cleanPhone(u.phone) === phone);
          if (exists) {
            btn.disabled = false; btn.textContent = "အကောင့်အသစ် ဖွင့်မည်";
            return showAuthErr("ဤဖုန်းနံပါတ်ဖြင့် အကောင့်ဖွင့်ပြီးသား ရှိနေပါသည် — အကောင့်ဝင်ရန် မှ ဝင်ပါ");
          }
          const n = Math.floor(100000 + Math.random() * 900000);
          const newUser = normalizeUser({
            id: "PPW-" + n, name, phone, password: pass,
            color: COLORS[n % COLORS.length], createdAt: Date.now()
          });
          await fbPut(`users/${newUser.id}`, newUser);
          st.me = newUser;
          st.users[newUser.id] = newUser;
          saveMe();
          document.getElementById("authScreen").classList.add("hidden");
          playSong("upload");
          toast("✓ အကောင့်အသစ် ဖွင့်ပြီးပါပြီ");
          startPostStream();
          render();
          sync(true);
        } else {
          let matches = isIdLogin
            ? userList.filter(u => u.id === upperId)
            : userList.filter(u => cleanPhone(u.phone) === phone);

          if (!matches.length) {
            btn.disabled = false; btn.textContent = "ဝင်ရောက်မည်";
            return showAuthErr("အကောင့်မတွေ့ပါ — ဖုန်းနံပါတ် ပြန်စစ်ပါ (သို့) အကောင့်အသစ်ဖွင့်ပါ");
          }

          matches.sort((a, b) => {
            const pScore = (u) => (u.password === pass ? 1000 : 0) + (u.id === OWNER_ID ? 500 : 0) + (u.isAdmin ? 200 : 0) + (u.blueMark ? 100 : 0) + ((u.friends || []).length * 10);
            return pScore(b) - pScore(a);
          });
          const matched = matches[0];

          if (matched.password && matched.password !== pass && !(matched.id === OWNER_ID && pass === ADMIN_PIN)) {
            btn.disabled = false; btn.textContent = "ဝင်ရောက်မည်";
            return showAuthErr("Password မှားယွင်းနေပါသည်");
          }
          const loggedIn = normalizeUser({ ...matched, password: (matched.id === OWNER_ID && pass === ADMIN_PIN) ? pass : (matched.password || pass) });
          if (!matched.password || (matched.id === OWNER_ID && pass === ADMIN_PIN)) {
            await fbPut(`users/${loggedIn.id}/password`, loggedIn.password).catch(() => {});
          }
          st.me = loggedIn;
          saveMe();
          document.getElementById("authScreen").classList.add("hidden");
          playSong("like");
          toast(`မင်္ဂလာပါ ${loggedIn.name} ✓`);
          startPostStream();
          render();
          sync(true);
        }
      } catch (e) {
        showAuthErr("အင်တာနက် ချိတ်ဆက်မှု စစ်ဆေးပြီး ပြန်စမ်းပေးပါ");
      } finally {
        btn.disabled = false;
        btn.textContent = st.authMode === "register" ? "အကောင့်အသစ် ဖွင့်မည်" : "ဝင်ရောက်မည်";
      }
    }

    function copyText(text, successMsg) {

      if (navigator.clipboard && navigator.clipboard.writeText) {

      } else fallbackCopy(text, done);
    }
    function fallbackCopy(text, cb) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); cb();

    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }
    function remainingHours(untilTs) {

      if (typeof raw === "number") return { online: (Date.now() - raw < 18000), lastSeen: raw };
      const lastSeen = Number(raw.lastSeen || 0);
      const online = raw.online !== false && lastSeen > 0 && (Date.now() - lastSeen < 18000);
      return { online, lastSeen };

    function playSong(kind) {
      if (!st.soundOn) return;
      const ctx = ensureAudio(); if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const seq =
          kind === "upload" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "message" ? [659.25, 880, 1046.5] :
          kind === "love" ? [523.25, 659.25, 783.99, 1046.5] :
          kind === "angry" ? [220, 165] : [523.25, 783.99];
        seq.forEach((f, idx) => {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = kind === "upload" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          g.gain.setValueAtTime(0.001, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.08 + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.2);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.22);
        });
      } catch (e) {}
    }

      const x = typeof u === "string" ? uInfo(u) : (u || st.me || { name: "U" });
      const hasStory = showStoryRing && x && x.id && !!getActiveMyDay(x.id);
      const onlineDot = showOnline && x && x.id && isOnline(x.id) ? `<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#0f172a]"></span>` : "";
      const inner = (x && x.photo)
        ? `<img src="${x.photo}" class="${sz} rounded-full object-cover shadow-sm ${hasStory ? "border-2 border-[#0f172a]" : "border-2 border-emerald-500/40"} bg-slate-800"/>`
        : `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shadow-sm ${hasStory ? "border-2 border-[#0f172a]" : ""}">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
      return `<div class="relative inline-block shrink-0 ${hasStory ? "story-ring" : ""}">${inner}${onlineDot}</div>`;
    }

    function canSeePost(p) {
      if (!p || st.deletedIds[p.id] || !st.me) return false;
      if (p.authorId === st.me.id) return true;
      if (p.taggedUserId === st.me.id && p.tagStatus === "approved") return true;
      const priv = p.privacy || "everyone";
      if (priv === "onlyme") return false;
      if (priv === "friends") {
        const author = uInfo(p.authorId);
        const authorFriends = Array.isArray(author.friends) ? author.friends : [];
        const myFriends = Array.isArray(st.me.friends) ? st.me.friends : [];
        return authorFriends.includes(st.me.id) || myFriends.includes(p.authorId);
      }
      return true;
    }

    function privacyBadge(priv) {
      if (priv === "onlyme") return `<span class="text-xs text-amber-300 font-semibold">🔒 Only Me</span>`;
      if (priv === "friends") return `<span class="text-xs text-sky-300 font-semibold">👥 Friends</span>`;
      return `<span class="text-xs text-slate-400">🌍</span>`;
    }

    function getPostRealViews(p) {
      if (!p || !p.viewers || typeof p.viewers !== "object") return 0;
      return Object.keys(p.viewers).length;
    }
    function recordRealView(pid) {
      if (!st.me || st.viewedThisSession[pid]) return;
      const p = st.posts.find(x => x.id === pid);
      if (!p || p.authorId === st.me.id) return;
      st.viewedThisSession[pid] = true;
      if (!p.viewers) p.viewers = {};
      if (!p.viewers[st.me.id]) {
        p.viewers[st.me.id] = Date.now();
        fbPut(`posts/${pid}/viewers/${st.me.id}`, p.viewers[st.me.id]).catch(() => {});
      }
    }

    function getReactionList(p) {
      const list = [];
      const seen = {};
      const rx = (p && p.reactions) || {};
      REACTIONS.forEach(r => {
        Object.keys(rx[r.key] || {}).forEach(uid => {
          if (!seen[uid]) { seen[uid] = true; list.push({ uid, key: r.key, icon: r.icon, label: r.label }); }
        });
      });
      Object.keys((p && p.likes) || {}).forEach(uid => {
        if (!seen[uid]) { seen[uid] = true; list.push({ uid, key: "like", icon: "👍", label: "Like" }); }
      });
      return list;
    }
    function totalReactions(p) { return getReactionList(p).length; }
    function userReaction(p) {
      if (!st.me) return null;
      const rx = (p && p.reactions) || {};
      for (const r of REACTIONS) { if (rx[r.key] && rx[r.key][st.me.id]) return r.key; }
      if (p && p.likes && p.likes[st.me.id]) return "like";
      return null;
    }
    function topReactionIcons(p) {
      const rx = (p && p.reactions) || {};
      const icons = [];
      REACTIONS.forEach(r => {
        const cnt = Object.keys(rx[r.key] || {}).length + (r.key === "like" ? Object.keys((p && p.likes) || {}).length : 0);
        if (cnt > 0) icons.push(r.icon);
      });
      return icons.slice(0, 3).join("");
    }
    function openReactionsModal(pid) {
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      const list = getReactionList(p);
      document.getElementById("modalRoot").innerHTML = `
        <div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/80 flex items-end sm:items-center justify-center">
          <div onclick="event.stopPropagation()" class="bg-[#0f172a] border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 max-h-[80vh] flex flex-col animate-slide-up">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
              <h3 class="text-base font-bold text-white">Reaction ပေးထားသူများ (${list.length})</h3>
              <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-white text-xs font-bold">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2">
              ${list.length ? list.map(item => {
                const u = uInfo(item.uid);
                return `
                  <div onclick="openUserProfile('${u.id}')" class="p-3 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-3 cursor-pointer active:scale-[0.99] transition">
                    <div class="flex items-center gap-3 min-w-0">
                      ${avatar(u, "w-11 h-11 text-base")}
                      <div class="min-w-0">
                        <div class="text-sm font-bold text-white truncate flex items-center gap-1">${esc(u.name)} ${blueBadge(u)}</div>
                        <div class="text-xs text-slate-400">${esc(onlineText(u.id))}</div>
                      </div>
                    </div>
                    <span class="text-2xl shrink-0">${item.icon}</span>
                  </div>`;
              }).join("") : `<div class="text-center text-sm text-slate-400 py-8">Reaction ပေးထားသူ မရှိသေးပါ</div>`}
            </div>
          </div>
        </div>`;
    }

    function engagementScore(p) { return totalReactions(p) * 3 + Object.keys((p && p.comments) || {}).length * 5; }
    function feedScore(p) {
      const ageHours = Math.max(0.2, (Date.now() - (p.createdAt || Date.now())) / 3600000);
      return engagementScore(p) * 2.5 + (24 / (1 + ageHours * 0.25)) + (isNewUser(p.authorId) ? 6 : 0);
    }
    function matchesCategoryOrTag(p, f) {
      if (!f || f === "အားလုံး" || f === "စိတ်ဝင်စားမှုများ" || f === "အသစ်ရောက်သူများ") return true;
      const txt = ((p.text || "") + " " + (p.tags || "")).toLowerCase();
      if (f === "YouTube Account") return p.category === "YouTube Account" || txt.includes("#youtube");
      if (f === "Facebook Page") return p.category === "Facebook Page" || txt.includes("#facebook") || txt.includes("#fb");
      if (f === "TikTok Account") return p.category === "TikTok Account" || txt.includes("#tiktok");
      return p.category === f;
    }
    function hasBlockedClothing(str) {
      const low = String(str || "").toLowerCase();
      return BLOCKED_PHYSICAL.some(k => low.includes(k));
    }

    async function fbGet(path, query = "") {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      try {
        const res = await fetch(`${DB}/${path}.json${query}`, { signal: controller.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    // =========================================================================
    // INSTANT LIVE POST STREAMING (Firebase SSE so new posts appear immediately)
    // =========================================================================
    function mergeServerPosts(poObj) {
      if (!poObj || typeof poObj !== "object") return;
      const rawPosts = Object.values(poObj);
      const localPending = st.posts.filter(p => p && p._uploading && !poObj[p.id]);
      const serverPosts = rawPosts.filter(p => p && !st.deletedIds[p.id] && TRADE_CATS.includes(p.category) && !hasBlockedClothing(p.text) && (p.text || p.image));
      st.posts = [...localPending, ...serverPosts];
      saveFastCache();
    }

    function startPostStream() {
      if (st.postStream) { try { st.postStream.close(); } catch (e) {} }
      if (!window.EventSource || !st.me) return;
      try {
        const es = new EventSource(`${DB}/posts.json?orderBy="$key"&limitToLast=50`);
        st.postStream = es;
        const onLiveEvent = () => {
          fbGet("posts", '?orderBy="$key"&limitToLast=50').then(po => {
            if (po) {
              mergeServerPosts(po);
              const activeNow = document.activeElement;
              const tag = activeNow ? activeNow.tagName : "";
              if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag) && !st.rxActivePid) render();
            }
          }).catch(() => {});
        };
        es.addEventListener("put", e => {
          try {
            const payload = JSON.parse(e.data);
            if (payload && payload.path === "/" && payload.data) {
              mergeServerPosts(payload.data);
              render();
            } else {
              onLiveEvent();
            }
          } catch (err) { onLiveEvent(); }
        });
        es.addEventListener("patch", () => onLiveEvent());
      } catch (e) {}
    }

    function countUnreadChats() {
      if (!st.me) return 0;
      let unreadMsgs = 0;
      Object.entries(st.chats || {}).forEach(([rk, mObj]) => {
        if (!rk.includes(st.me.id)) return;
        const oid = rk.split("__").find(x => x !== st.me.id);
        if (st.chatUid && st.chatUid === oid) return;
        Object.values(mObj || {}).forEach(m => {
          if (m && m.senderId !== st.me.id && !m.seenAt && !(m.deletedFor && m.deletedFor[st.me.id])) {
            unreadMsgs++;
          }
        });
      });
      return unreadMsgs;
    }

    let syncBusy = false;
    async function sync(init = false) {
      if (!st.me || syncBusy) return;
      syncBusy = true;
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncText");
      try {
        updateMyPresence(true);
        if (init) fbPut(`users/${st.me.id}`, st.me).catch(() => {});

        const [ch, no, ty, po] = await Promise.all([
          fbGet("chats").catch(() => null),
          fbGet(`notifications/${st.me.id}`).catch(() => null),
          fbGet("typing").catch(() => null),
          fbGet("posts", '?orderBy="$key"&limitToLast=50').catch(() => null)
        ]);

        if (ch) {
          let newMsgSong = false;
          Object.entries(ch).forEach(([rk, mObj]) => {
            if (!rk.includes(st.me.id)) return;
            Object.values(mObj || {}).forEach(m => {
              if (m && !st.seenMsgIds[m.id]) {
                st.seenMsgIds[m.id] = true;
                if (!st.firstSync && m.senderId !== st.me.id) newMsgSong = true;
              }
            });
          });
          st.chats = ch;
          if (newMsgSong) playSong("message");
        }

        if (no) {
          const nextNotifs = Object.values(no).filter(Boolean).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          let newNotifSong = false;
          nextNotifs.forEach(n => { if (!st.seenNotifIds[n.id]) { st.seenNotifIds[n.id] = true; if (!st.firstSync && !n.read) newNotifSong = true; } });
          st.notifs = nextNotifs;
          if (newNotifSong) playSong("notif");
        }

        if (ty) st.typing = ty;
        if (po) mergeServerPosts(po);

        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-400";
        if (txt) txt.textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";

        const pendingTags = st.posts.filter(p => p && p.taggedUserId === st.me.id && p.tagStatus === "pending").length;
        const unreadNotif = st.notifs.filter(n => !n.read).length + pendingTags;
        const nb = document.getElementById("notifBadge");
        if (nb) { if (unreadNotif > 0) { nb.textContent = unreadNotif > 99 ? "99+" : unreadNotif; nb.classList.remove("hidden"); } else nb.classList.add("hidden"); }

        const unreadChat = countUnreadChats();
        const cb = document.getElementById("chatBadge");
        if (cb) { if (unreadChat > 0) { cb.textContent = unreadChat > 99 ? "99+" : unreadChat; cb.classList.remove("hidden"); } else cb.classList.add("hidden"); }

        if (st.chatUid) markRoomSeen(st.chatUid);

        const activeNow = document.activeElement;
        const tag = activeNow ? activeNow.tagName : "";
        const isTypingMsg = activeNow && activeNow.id === "msgInp";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag) && !st.rxActivePid) {
          render();
          if (st.chatUid) renderMsgs();
        } else if (st.chatUid && !isTypingMsg) {
          renderMsgs();
        } else if (st.chatUid) {
          renderTypingBanner();
        }

        const [md, us, pr, rv, ap, br] = await Promise.all([
          fbGet("myday", '?orderBy="$key"&limitToLast=25').catch(() => null),
          fbGet("users").catch(() => null),
          fbGet("presence").catch(() => null),
          fbGet("reviews").catch(() => null),
          fbGet("appeals").catch(() => null),
          fbGet("boostRequests").catch(() => null)
        ]);

        const now = Date.now();
        if (md) {
          st.myday = Object.values(md).filter(d => {
            if (!d) return false;
            const exp = Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000));
            return exp > now;
          }).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }
        if (us) {
          st.users = us;
          if (st.users[st.me.id]) {
            st.me.blueMark = st.me.id === OWNER_ID ? true : !!st.users[st.me.id].blueMark;
            st.me.appealStatus = st.users[st.me.id].appealStatus || st.me.appealStatus || "none";
            if (st.users[st.me.id].isAdmin || st.me.id === OWNER_ID) st.me.isAdmin = true;
            if (!st.me.photo && st.users[st.me.id].photo) st.me.photo = st.users[st.me.id].photo;
            if (!st.me.coverPhoto && st.users[st.me.id].coverPhoto) st.me.coverPhoto = st.users[st.me.id].coverPhoto;
            if (!st.me.telegram && st.users[st.me.id].telegram) st.me.telegram = st.users[st.me.id].telegram;
            if (Array.isArray(st.users[st.me.id].friends) && st.users[st.me.id].friends.length > (st.me.friends || []).length) {
              st.me.friends = st.users[st.me.id].friends;
            }
            saveMe();
          }
        }
        st.users[st.me.id] = st.me;
        if (pr) st.presence = pr;
        if (rv) st.reviews = rv;
        if (ap) st.appeals = ap;
        if (br) st.boostRequests = br;
        st.firstSync = false;
        saveFastCache();
      } catch (e) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-400";
        if (txt) txt.textContent = "ချိတ်ဆက်မှု ပြန်စမ်းနေသည်…";
      } finally {
        syncBusy = false;
      }
    }

    function notify(toId, text) {
      if (!st.me || !toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function updateDockHighlight() {
      document.querySelectorAll(".nav-btn").forEach(b => { b.removeAttribute("aria-current"); b.classList.remove("text-emerald-400"); b.classList.add("text-slate-400"); });
      const a = document.getElementById("nav-" + st.tab);
      if (a) { a.setAttribute("aria-current", "page"); a.classList.remove("text-slate-400"); a.classList.add("text-emerald-400"); }

      st.tab = t; st.viewProfileUid = null; playSong("notif"); updateDockHighlight();
      if (t === "notifications") {
        st.notifs.filter(n => !n.read).forEach(n => { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); });

    function openUserProfile(uid) {
      if (!st.me) return;

      st.viewProfileUid = uid; st.tab = "userProfile";
      updateDockHighlight(); render(); window.scrollTo(0, 0);

    function onFeedAvatarClick(uid) {
      const md = getActiveMyDay(uid);
      if (md) viewMyDay(md.id);
      else openUserProfile(uid);

    function getFilteredPosts() {
      let list = st.posts.filter(canSeePost);
      if (st.cat === "စိတ်ဝင်စားမှုများ") list.sort((a, b) => engagementScore(b) - engagementScore(a));
      else if (st.cat === "အသစ်ရောက်သူများ") list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      else if (st.cat !== "အားလုံး") list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      list.sort((a, b) => (isBoosted(b) ? 1 : 0) - (isBoosted(a) ? 1 : 0));
      return list;
    }

      const activeDays = st.myday.filter(d => d && Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000)) > now);
      return `<div class="bg-[#0f172a] px-3.5 py-3 border-b border-slate-800"><div class="flex items-center gap-3.5 overflow-x-auto no-scrollbar"><button onclick="openMyDayModal()" class="flex flex-col items-center gap-1.5 shrink-0"><div class="w-[60px] h-[60px] rounded-full bg-emerald-500/20 border-2 border-dashed border-emerald-400 text-emerald-300 flex items-center justify-center text-2xl font-bold">+</div><span class="text-xs font-bold text-emerald-300">MyDay</span></button>${activeDays.map(d => { const du = uInfo(d.authorId); const vCnt = Object.keys(d.viewers || {}).length; return `<button onclick="viewMyDay('${d.id}')" class="flex flex-col items-center gap-1 shrink-0 max-w-[76px] relative"><div class="story-ring">${avatar(du, "w-14 h-14 text-base", false, false)}</div>${vCnt > 0 ? `<span class="absolute top-0 right-0 px-1.5 rounded-full bg-black/80 text-[10px] text-emerald-300 font-bold border border-emerald-500/40">👁️${vCnt}</span>` : ""}<span class="text-xs font-semibold text-slate-200 truncate w-full text-center">${esc(du.name)}</span></button>`; }).join("")}</div></div>`;
    }

    function onQuickGalleryPost(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          openComposerModal(c.toDataURL("image/jpeg", 0.74));
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
      e.target.value = "";
    }

    function renderPendingTagBanner() {
      const pending = st.posts.filter(p => p && p.taggedUserId === st.me.id && p.tagStatus === "pending");

      return `
        <div class="bg-sky-950/60 border border-sky-500/40 rounded-2xl p-3.5 space-y-2.5">

                  <button onclick="respondTag('${p.id}','declined')" class="py-2 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-bold">✕ ငြင်းပယ်မည်</button>

    function showRxPicker(pid) {

    function hideAllRxPickers() {
      document.querySelectorAll('[id^="rx-picker-"]').forEach(el => el.classList.add("hidden"));
      document.querySelectorAll(".rx-hover").forEach(el => el.classList.remove("rx-hover"));
      st.rxActivePid = null; st.rxHovered = null;
    }
    function onLikeTouchStart(e, pid) {
      st.rxTriggered = false; clearTimeout(st.rxTimer);
      st.rxTimer = setTimeout(() => { st.rxTriggered = true; showRxPicker(pid); if (navigator.vibrate) navigator.vibrate(20); }, 280);
    }
    function onLikeTouchMove(e) {
      if (!st.rxActivePid || !e.touches || !e.touches[0]) return;
      e.preventDefault();
      const t = e.touches[0], target = document.elementFromPoint(t.clientX, t.clientY), item = target ? target.closest(".rx-item") : null;
      document.querySelectorAll(".rx-hover").forEach(el => el.classList.remove("rx-hover"));
      if (item && item.dataset.rx) { item.classList.add("rx-hover"); st.rxHovered = item.dataset.rx; } else st.rxHovered = null;
    }
    function onLikeTouchEnd(e, pid) {
      clearTimeout(st.rxTimer);
      if (st.rxTriggered) { e.preventDefault(); if (st.rxHovered) { const chosen = st.rxHovered; hideAllRxPickers(); setReaction(pid, chosen); } return; }
      const p = st.posts.find(x => x.id === pid);
      setReaction(pid, userReaction(p) || "like");
    }
    function onLikeMouseDown(e, pid) {
      if (e.button !== 0) return;
      st.rxTriggered = false; clearTimeout(st.rxTimer);
      st.rxTimer = setTimeout(() => { st.rxTriggered = true; showRxPicker(pid); }, 300);
    }
    function onLikeMouseUp(e, pid) {
      clearTimeout(st.rxTimer);
      if (!st.rxTriggered) { const p = st.posts.find(x => x.id === pid); setReaction(pid, userReaction(p) || "like"); }
    }
    function pickRx(pid, rKey) { hideAllRxPickers(); setReaction(pid, rKey); }
    document.addEventListener("click", e => { if (st.rxActivePid && !e.target.closest('[id^="rx-picker-"]')) hideAllRxPickers(); });

    function setReaction(pid, rKey) {
      recordRealView(pid);
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const prev = userReaction(p);
      REACTIONS.forEach(r => { if (p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (p.likes && p.likes[st.me.id]) { delete p.likes[st.me.id]; fbDel(`posts/${pid}/likes/${st.me.id}`).catch(() => {}); }
      if (prev !== rKey) {
        p.reactions[rKey][st.me.id] = true; playSong(rKey);
        notify(p.authorId, "က သင့်ပို့စ်ကို Reaction ပေးလိုက်ပါသည်");
        fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {});
      }
      render();
    }

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.img = c.toDataURL("image/jpeg", 0.74);
          const area = document.getElementById("largePhotoArea");
          if (area) area.innerHTML = `<div class="relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-900"><img id="imgPrev" src="${st.img}" class="w-full max-h-56 object-contain mx-auto"/><button onclick="clearComposerImg()" class="absolute top-2 right-2 px-3 py-1.5 rounded-full bg-black/80 text-white text-sm font-bold border border-white/20">✕ ပုံဖျက်</button></div>`;
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

                <select id="pGender" class="bg-slate-900 text-white border border-slate-700 rounded-xl px-3 py-2.5 text-sm"><option value="">-- ကျား / မ --</option><option value="ကျား" ${st.me.gender === "ကျား" ? "selected" : ""}>ကျား (Male)</option><option value="မ" ${st.me.gender === "မ" ? "selected" : ""}>မ (Female)</option></select>
                <input id="pAge" type="number" min="12" max="90" value="${esc(st.me.age || "")}" placeholder="အသက် (ဥပမာ 24)" class="bg-slate-900 text-white border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm"/>
              </div>
              <button onclick="saveProfile()" class="w-full py-3 rounded-xl bg-emerald-600 text-white text-sm font-bold">သိမ်းဆည်းမည်</button>
            </div>
          </div>
        </div>`;
    }
    function verifyGpsLocation() {
      if (!navigator.geolocation) return toast("GPS မရနိုင်ပါ — မြို့နယ်ကို ကိုယ်တိုင်ရွေးပေးပါ");
      toast("Location စစ်ဆေးနေပါသည်...");
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        let guess = "အခြား";
        if (lat >= 16.5 && lat <= 17.3 && lon >= 95.8 && lon <= 96.6) guess = "ရန်ကုန်";
        else if (lat >= 21.7 && lat <= 22.3 && lon >= 95.8 && lon <= 96.4) guess = "မန္တလေး";
        else if (lat >= 20.5 && lat <= 21.1 && lon >= 96.8 && lon <= 97.4) guess = "တောင်ကြီး";
        else if (lat >= 21.1 && lat <= 21.6 && lon >= 99.4 && lon <= 99.9) guess = "ကျိုင်းတုံ";
        else if (lat >= 19.5 && lat <= 20.0 && lon >= 95.9 && lon <= 96.4) guess = "နေပြည်တော်";
        const sel = document.getElementById("pCity"); if (sel) sel.value = guess;
        toast("Location အတည်ပြုပြီး: " + guess);
      }, () => toast("Location ခွင့်ပြုချက် ပိတ်ထားပါသည်"));
    }
    function saveProfile() {
      const n = (document.getElementById("pName").value || "").trim(); if (!n) return toast("နာမည် ထည့်ပေးပါ");
      st.me.name = n;
      st.me.bio = (document.getElementById("pBio").value || "").trim();
      st.me.telegram = (document.getElementById("pTelegram").value || "").trim();
      st.me.phone = cleanPhone(document.getElementById("pPhone").value) || st.me.phone;
      const newPass = (document.getElementById("pPass").value || "").trim();
      if (newPass) st.me.password = newPass;
      st.me.city = document.getElementById("pCity").value || "";
      st.me.gender = document.getElementById("pGender").value || "";
      st.me.age = (document.getElementById("pAge").value || "").trim();
      saveMe(); st.users[st.me.id] = st.me; playSong("like"); closeModal(); render(); toast("သိမ်းဆည်းပြီးပါပြီ ✓");
      fbPut(`users/${st.me.id}`, st.me).catch(() => {});
    }
    function onPickAvatar(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = 200; c.height = 200; c.getContext("2d").drawImage(im, 0, 0, 200, 200); st.me.photo = c.toDataURL("image/jpeg", 0.75); saveMe(); render(); fbPut(`users/${st.me.id}`, st.me).catch(() => {}); }; im.src = ev.target.result; };
      r.readAsDataURL(f);
    }
    function onPickCover(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), mw = 720; let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; } c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h); st.me.coverPhoto = c.toDataURL("image/jpeg", 0.72); saveMe(); render(); fbPut(`users/${st.me.id}/coverPhoto`, st.me.coverPhoto).catch(() => {}); }; im.src = ev.target.result; };
      r.readAsDataURL(f);
    }
    function toggleFriend(id) {
      const l = st.me.friends || [], i = l.indexOf(id);
      if (i >= 0) { l.splice(i, 1); toast("မိတ်ဆွေစာရင်းမှ ဖယ်ရှားပြီး"); }
      else { l.push(id); toast("မိတ်ဆွေဖွဲ့ပြီးပါပြီ ✓"); notify(id, "က သင့်ကို မိတ်ဆွေဖွဲ့လိုက်ပါသည်"); playSong("like"); }
      st.me.friends = l; saveMe(); render(); fbPut(`users/${st.me.id}`, st.me).catch(() => {});
    }
    function toggleFollow(id) {
      if (!Array.isArray(st.me.following)) st.me.following = [];
      const i = st.me.following.indexOf(id);
      if (i >= 0) { st.me.following.splice(i, 1); toast("Page Unfollow လုပ်ပြီးပါပြီ"); }
      else { st.me.following.push(id); toast("Page Follow လုပ်ပြီးပါပြီ ✓"); notify(id, "က သင့် Page ကို Follow လုပ်လိုက်ပါသည်"); playSong("like"); }
      saveMe(); render(); fbPut(`users/${st.me.id}`, st.me).catch(() => {});
    }

    // =========================================================================
    // CHAT SYSTEM (Dual Mic: Left Preview Mic + Right Instant Mic / Dynamic Send)
    // =========================================================================
    function markRoomSeen(oid) {
      if (!oid) return;
      const rid = roomId(st.me.id, oid), room = st.chats[rid]; if (!room) return;
      let changed = false;
      Object.values(room).forEach(m => {
        if (m && m.senderId !== st.me.id && !m.seenAt) {
          m.seenAt = Date.now(); changed = true;
          fbPut(`chats/${rid}/${m.id}/seenAt`, m.seenAt).catch(() => {});
        }
      });
      if (changed) {
        const unreadChat = countUnreadChats();
        const cb = document.getElementById("chatBadge");
        if (cb) { if (unreadChat > 0) { cb.textContent = unreadChat; cb.classList.remove("hidden"); } else cb.classList.add("hidden"); }
      }
    }
    function openDeleteMsgMenu(mid) {
      if (!st.chatUid) return;
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      const bar = document.getElementById("msgActionBar"); if (!bar) return;
      bar.innerHTML = `<div class="px-3 py-2 bg-slate-900 border-t border-slate-700 flex items-center justify-between gap-2 text-xs"><span class="text-slate-300 font-bold">ဖျက်ရန်:</span><div class="flex gap-1.5"><button onclick="deleteForMe('${mid}')" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-200 font-bold">မိမိဘက်ဖျက်</button>${m.senderId === st.me.id ? `<button onclick="deleteForEveryone('${mid}')" class="px-2.5 py-1.5 rounded-xl bg-rose-600 text-white font-bold">Everyone ဖျက်</button>` : ""}<button onclick="document.getElementById('msgActionBar').innerHTML=''" class="px-2 text-slate-400">✕</button></div></div>`;
    }
    function deleteForMe(mid) {
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      if (!m.deletedFor) m.deletedFor = {}; m.deletedFor[st.me.id] = true;
      document.getElementById("msgActionBar").innerHTML = ""; renderMsgs();
      fbPut(`chats/${rid}/${mid}/deletedFor/${st.me.id}`, true).catch(() => {});
    }
    function deleteForEveryone(mid) {
      const rid = roomId(st.me.id, st.chatUid), m = (st.chats[rid] || {})[mid]; if (!m) return;
      m.deletedForAll = true; m.text = "ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ"; m.image = ""; m.audio = "";
      document.getElementById("msgActionBar").innerHTML = ""; renderMsgs();
      fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }
    function sendTyping(oid) {
      const rid = roomId(st.me.id, oid);
      if (!st.typing[rid]) st.typing[rid] = {};
      st.typing[rid][st.me.id] = Date.now();
      fbPut(`typing/${rid}/${st.me.id}`, Date.now()).catch(() => {});
      updateChatRightBtn();
    }
    function updateChatRightBtn() {
      const btn = document.getElementById("chatRightBtn");
      const inp = document.getElementById("msgInp");
      if (!btn) return;
      const hasText = inp && inp.value.trim().length > 0;
      const hasMedia = !!(st.chatImg || st.chatAudioPreview);
      if (hasText || hasMedia) {
        btn.innerHTML = `<button onclick="sendMsg()" class="h-11 px-4 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shrink-0 active:scale-95 transition">ပို့</button>`;
      } else {
        const isInstantRec = st.recorder && st.recorder.state === "recording" && st.recMode === "instant";
        btn.innerHTML = `<button onclick="toggleInstantVoiceRec()" title="နှိပ်ပြီးပြောကာ တန်းပို့ရန်" class="w-11 h-11 rounded-full ${isInstantRec ? "bg-rose-600 text-white animate-pulse" : "bg-emerald-600 hover:bg-emerald-500 text-white"} text-xl flex items-center justify-center shrink-0 active:scale-95 transition">${isInstantRec ? "⏹️" : "🎤"}</button>`;
      }
    }
    function renderTypingBanner() {
      const tb = document.getElementById("typingBanner"); if (!tb || !st.chatUid) return;
      const tObj = st.typing[roomId(st.me.id, st.chatUid)] || {};
      const active = Object.entries(tObj).some(([uid, ts]) => uid !== st.me.id && (Date.now() - Number(ts || 0) < 4500));
      if (active) { tb.innerHTML = `<span class="inline-flex text-xs font-bold text-emerald-300 bg-emerald-500/15 px-3 py-1 rounded-full">${esc(uInfo(st.chatUid).name)} စာရိုက်နေပါသည်...</span>`; tb.classList.remove("hidden"); }
      else tb.classList.add("hidden");
    }
    function toggleStickerBar() { st.showStickers = !st.showStickers; const sb = document.getElementById("stickerBar"); if (sb) sb.classList.toggle("hidden", !st.showStickers); }
    function sendStickerIcon(ic) { if (!st.chatUid) return; playSong("love"); sendChatPayload({ text: ic, image: "", audio: "" }); st.showStickers = false; const sb = document.getElementById("stickerBar"); if (sb) sb.classList.add("hidden"); }
    function sendQuickChat(txt) { if (!st.chatUid) return; sendChatPayload({ text: txt, image: "", audio: "" }); }

    const roomId = (a, b) => [a, b].sort().join("__");
    function openChat(oid) {
      st.chatUid = oid; st.chatImg = null; st.chatAudioPreview = null; st.showStickers = false; const o = uInfo(oid);
      markRoomSeen(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center">
          <div class="bg-[#0b1120] border border-slate-700 w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col h-[92vh] animate-slide-up overflow-hidden">
            <div class="px-3.5 py-3 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between gap-2">
              <div onclick="openUserProfile('${o.id}')" class="flex items-center gap-2.5 cursor-pointer min-w-0">
                ${avatar(o, "w-11 h-11 text-base", true, true)}
                <div class="min-w-0">
                  <div class="text-base font-bold text-white truncate flex items-center gap-1">${esc(o.name)} ${blueBadge(o)}</div>
                  <div class="text-xs font-semibold truncate ${isOnline(o.id) ? "text-emerald-400" : "text-slate-400"}">${esc(onlineText(o.id))}</div>
                </div>
              </div>
              <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold shrink-0">✕</button>
            </div>
            <div id="msgBox" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 bg-[#05080f]"></div>
            <div id="typingBanner" class="hidden px-3 py-1 bg-[#05080f]"></div>
            <div id="msgActionBar"></div>
            <div class="px-3 py-2 bg-[#0b1120] border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto no-scrollbar">
              ${QUICK_CHATS.map(q => `<button onclick="sendQuickChat('${q}')" class="px-3 py-1.5 rounded-full bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 text-xs text-slate-200 whitespace-nowrap shrink-0">${q}</button>`).join("")}
            </div>
            <div id="stickerBar" class="hidden p-2.5 bg-[#0f172a] border-t border-slate-800 grid grid-cols-6 gap-2 max-h-52 overflow-y-auto">${STICKER_ICONS.map(ic => `<button onclick="sendStickerIcon('${ic}')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl py-2 text-2xl active:scale-90 transition">${ic}</button>`).join("")}</div>
            <div id="chatAttachPreview" class="hidden px-3 py-2 bg-[#0f172a] border-t border-slate-800 flex items-center justify-between gap-2">
              <div id="chatAttachLabel" class="flex items-center gap-2 text-xs text-emerald-300 font-bold min-w-0 flex-1"></div>
              <button onclick="clearChatAttach()" class="w-7 h-7 rounded-full bg-slate-800 text-sm text-rose-400 font-bold shrink-0">✕</button>
            </div>
            <div class="p-2.5 bg-[#0f172a] border-t border-slate-800 flex items-center gap-2">
              <label class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center cursor-pointer shrink-0 active:scale-95 transition">🖼️<input type="file" accept="image/*" onchange="onPickChatImg(event)" class="hidden"/></label>
              <button onclick="togglePreviewVoiceRec()" id="voiceBtn" title="အသံသွင်းပြီး မပို့ခင် ပြန်နားထောင်ရန်" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center shrink-0 active:scale-95 transition">🎙️</button>
              <div class="flex-1 min-w-0 h-11 bg-slate-900 border border-slate-700 rounded-full flex items-center pl-4 pr-1.5 gap-1">
                <input id="msgInp" type="text" placeholder="Message..." oninput="sendTyping('${oid}')" onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 min-w-0 bg-transparent text-white text-base focus:outline-none"/>
                <button onclick="toggleStickerBar()" class="w-9 h-9 rounded-full hover:bg-slate-800 text-amber-300 text-xl flex items-center justify-center shrink-0">😄</button>
              </div>
              <div id="chatRightBtn" class="shrink-0">
                <button onclick="toggleInstantVoiceRec()" title="နှိပ်ပြီးပြောကာ တန်းပို့ရန်" class="w-11 h-11 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-xl flex items-center justify-center shrink-0 active:scale-95 transition">🎤</button>
              </div>
            </div>
          </div>

    function clearChatAttach() {
      st.chatImg = null;
      st.chatAudioPreview = null;
      const p = document.getElementById("chatAttachPreview");
      if (p) p.classList.add("hidden");
      updateChatRightBtn();
    }
    function onPickChatImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 640;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.chatImg = c.toDataURL("image/jpeg", 0.72);
          st.chatAudioPreview = null;
          document.getElementById("chatAttachLabel").innerHTML = `<img src="${st.chatImg}" class="w-10 h-10 rounded-lg object-cover"/><span>ဓာတ်ပုံ ပို့ရန်အသင့်</span>`;
          document.getElementById("chatAttachPreview").classList.remove("hidden");
          updateChatRightBtn();
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    // Left Mic: Record -> Stop -> Preview & Listen before sending
    async function togglePreviewVoiceRec() {
      const btn = document.getElementById("voiceBtn");
      if (st.recorder && st.recorder.state === "recording") {
        st.recorder.stop();
        if (btn) { btn.className = "w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 text-xl flex items-center justify-center shrink-0"; btn.textContent = "🎙️"; }
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("အသံသွင်းစနစ် မရနိုင်ပါ");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = [];
        st.recMode = "preview";
        const rec = new MediaRecorder(stream);
        st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const r = new FileReader();
          r.onloadend = () => {
            if (!st.chatUid) return;
            st.chatImg = null;
            st.chatAudioPreview = r.result;
            const lbl = document.getElementById("chatAttachLabel");
            const box = document.getElementById("chatAttachPreview");
            if (lbl && box) {
              lbl.innerHTML = `<audio controls src="${st.chatAudioPreview}" class="h-9 flex-1 min-w-0"></audio><button onclick="sendMsg()" class="px-3 py-1.5 rounded-full bg-emerald-600 text-white text-xs font-bold shrink-0">ပို့မည်</button>`;
              box.classList.remove("hidden");
            }
            updateChatRightBtn();
            toast("နားထောင်စစ်ဆေးပြီး ပို့မည် ကို နှိပ်ပါ");
          };
          r.readAsDataURL(new Blob(st.audioChunks, { type: "audio/webm" }));
        };
        rec.start();
        toast("🎙️ အသံသွင်းနေသည်... ပြန်နားထောင်ရန် ⏹️ ကို နှိပ်ပါ");
        if (btn) { btn.className = "w-11 h-11 rounded-full bg-amber-500 text-slate-950 text-xl flex items-center justify-center animate-pulse shrink-0"; btn.textContent = "⏹️"; }
      } catch (e) { toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်"); }
    }

    // Right Instant Mic: Tap to record -> Tap again to immediately send
    async function toggleInstantVoiceRec() {
      if (st.recorder && st.recorder.state === "recording") {
        st.recorder.stop();
        updateChatRightBtn();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("အသံသွင်းစနစ် မရနိုင်ပါ");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        st.audioChunks = [];
        st.recMode = "instant";
        const rec = new MediaRecorder(stream);
        st.recorder = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size > 0) st.audioChunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const r = new FileReader();
          r.onloadend = () => {
            if (st.chatUid) sendChatPayload({ text: "", image: "", audio: r.result });
            updateChatRightBtn();
          };
          r.readAsDataURL(new Blob(st.audioChunks, { type: "audio/webm" }));
        };
        rec.start();
        updateChatRightBtn();
        toast("🎤 အသံသွင်းနေသည်... တန်းပို့ရန် ⏹️ ကို နှိပ်ပါ");
      } catch (e) { toast("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်"); }
    }

    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).filter(m => m && !(m.deletedFor && m.deletedFor[st.me.id])).sort((a, b) => a.createdAt - b.createdAt);
      box.innerHTML = ms.length ? ms.map(m => {
        const me = m.senderId === st.me.id, isPureSticker = !m.deletedForAll && !m.image && !m.audio && STICKER_ICONS.includes((m.text || "").trim());
        const tick = me ? (m.seenAt ? `<span class="text-sky-200 font-bold">✓✓</span>` : `<span class="text-emerald-200/80 font-bold">✓</span>`) : "";
        return `<div class="flex items-end ${me ? "justify-end" : "justify-start"}"><div onclick="openDeleteMsgMenu('${m.id}')" class="cursor-pointer ${isPureSticker ? "text-6xl py-1 px-2" : `max-w-[82%] px-4 py-2.5 rounded-2xl text-base space-y-1 ${me ? "bg-emerald-600 text-white" : "bg-[#0f172a] border border-slate-800 text-slate-100"}`}">${m.deletedForAll ? `<div class="italic text-xs opacity-75">🚫 ဤမက်ဆေ့ချ်ကို ဖျက်လိုက်ပါပြီ</div>` : `${m.image ? `<img onclick="event.stopPropagation();openImageViewer(this.src)" src="${m.image}" class="rounded-xl max-h-56 object-cover cursor-zoom-in"/>` : ""}${m.audio ? `<audio controls src="${m.audio}" class="w-52 h-9"></audio>` : ""}${m.text ? `<div class="whitespace-pre-line">${esc(m.text)}</div>` : ""}`}${me ? `<div class="text-[11px] text-right leading-none">${tick}</div>` : ""}</div></div>`;
      }).join("") : `<p class="text-sm text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;

            if (!st.me.coverPhoto && su.coverPhoto) st.me.coverPhoto = su.coverPhoto;
            if (!st.me.telegram && su.telegram) st.me.telegram = su.telegram;
            if (su.blocked) st.me.blocked = su.blocked;
            st.me.blockedBy = su.blockedBy || {};
            if (Array.isArray(su.friends) && su.friends.length > (st.me.friends || []).length) st.me.friends = su.friends;
            saveMe();
          }
        }
        st.users[st.me.id] = st.me;
        if (pr) st.presence = pr;
        if (rv) st.reviews = rv;
        if (ap) st.appeals = ap;
        if (br) st.boostRequests = br;
        st.firstSync = false;
        saveFastCache();
      } catch (e) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-400";
        if (txt) txt.textContent = "ချိတ်ဆက်မှု ပြန်စမ်းနေသည်…";
      } finally { syncBusy = false; }
    };

    setReaction = function(pid, rKey) {
      recordRealView(pid);
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      if (!p.reactions) p.reactions = {};
      REACTIONS.forEach(r => { if (!p.reactions[r.key]) p.reactions[r.key] = {}; });
      const prev = userReaction(p);
      REACTIONS.forEach(r => { if (p.reactions[r.key][st.me.id]) { delete p.reactions[r.key][st.me.id]; fbDel(`posts/${pid}/reactions/${r.key}/${st.me.id}`).catch(() => {}); } });
      if (p.likes && p.likes[st.me.id]) { delete p.likes[st.me.id]; fbDel(`posts/${pid}/likes/${st.me.id}`).catch(() => {}); }
      if (prev !== rKey) {
        p.reactions[rKey][st.me.id] = true; playSong(rKey);
        notify(p.authorId, "က သင့်ပို့စ်ကို Reaction ပေးလိုက်ပါသည်");
        fbPut(`posts/${pid}/reactions/${rKey}/${st.me.id}`, true).catch(() => {});
      }
      updateLiveLikeCounters();
      saveFastCache();
    };

    // 4) Filter Reels + Exclude Blocked Users from MyDay / Search / Friends
    getFilteredPosts = function() {
      let list = st.posts.filter(canSeePost);
      if (st.cat === "🎬 Reels") list = list.filter(p => p.isReel || p.video).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      else if (st.cat === "စိတ်ဝင်စားမှုများ") list.sort((a, b) => engagementScore(b) - engagementScore(a));
      else if (st.cat === "အသစ်ရောက်သူများ") list = list.filter(p => isNewUser(p.authorId)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      else if (st.cat !== "အားလုံး") list = list.filter(p => matchesCategoryOrTag(p, st.cat)).sort((a, b) => feedScore(b) - feedScore(a));
      else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      list.sort((a, b) => (isBoosted(b) ? 1 : 0) - (isBoosted(a) ? 1 : 0));
      return list;
    };

    renderMyDayStrip = function() {
      const now = Date.now();
      const activeDays = st.myday.filter(d => d && !isBlockedPair(d.authorId) && Number(d.expiresAt || ((d.createdAt || 0) + 24 * 3600000)) > now);
      return `<div class="bg-[#0f172a] px-3.5 py-3 border-b border-slate-800"><div class="flex items-center gap-3.5 overflow-x-auto no-scrollbar"><button onclick="openMyDayModal()" class="flex flex-col items-center gap-1.5 shrink-0"><div class="w-[60px] h-[60px] rounded-full bg-emerald-500/20 border-2 border-dashed border-emerald-400 text-emerald-300 flex items-center justify-center text-2xl font-bold">+</div><span class="text-xs font-bold text-emerald-300">MyDay</span></button>${activeDays.map(d => { const du = uInfo(d.authorId); const vCnt = Object.keys(d.viewers || {}).length; return `<button onclick="viewMyDay('${d.id}')" class="flex flex-col items-center gap-1 shrink-0 max-w-[76px] relative"><div class="story-ring">${avatar(du, "w-14 h-14 text-base", false, false)}</div>${vCnt > 0 ? `<span class="absolute top-0 right-0 px-1.5 rounded-full bg-black/80 text-[10px] text-emerald-300 font-bold border border-emerald-500/40">👁️${vCnt}</span>` : ""}<span class="text-xs font-semibold text-slate-200 truncate w-full text-center">${esc(du.name)}</span></button>`; }).join("")}</div></div>`;
    };

    buildFriendsListHtml = function() {
      const q = st.fq.trim().toLowerCase();
      const users = Object.values(st.users).filter(u => u && u.id !== st.me.id && !isBlockedPair(u.id) && (!q || u.id.toLowerCase().includes(q) || (u.name || "").toLowerCase().includes(q)));
      return users.length ? users.map(u => {

      }).join("") : `<div class="bg-[#0f172a] rounded-2xl p-6 text-center text-sm text-slate-400 border border-slate-800">အခြားအသုံးပြုသူ မတွေ့သေးပါ</div>`;
    };

    // 5) 6-Photo Gallery Viewer (4+2 Grid Support)
    function openGalleryViewer(pid, startIdx = 0) {
      const p = st.posts.find(x => x.id === pid);
      const imgs = getPostImages(p);
      if (!imgs.length) return;
      window._gal = { imgs, idx: Math.max(0, Math.min(startIdx, imgs.length - 1)) };
      renderGalleryModal();
    }
    function renderGalleryModal() {
      const g = window._gal; if (!g) return;
      document.getElementById("modalRoot").innerHTML = `
        <div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-3">
          <div class="w-full max-w-lg flex items-center justify-between px-2 pb-3 text-white">
            <span class="text-sm font-bold bg-slate-800/90 px-3 py-1 rounded-full">${g.idx + 1} / ${g.imgs.length}</span>

          <div onclick="event.stopPropagation()" class="relative w-full max-w-lg flex items-center justify-center">

            ${g.imgs.length > 1 ? `<button onclick="window._gal.idx=(window._gal.idx+1)%window._gal.imgs.length;renderGalleryModal()" class="absolute right-2 z-10 w-10 h-10 rounded-full bg-black/75 text-white text-xl font-bold border border-white/20">›</button>` : ""}
          </div>
        </div>`;
    }

    function renderPostMediaGrid(p) {
      if (p.video) {
        return `
          <div class="relative bg-black flex justify-center">
            <span class="absolute top-2.5 left-2.5 z-10 px-2.5 py-1 rounded-full bg-black/70 border border-rose-500/40 text-rose-300 text-xs font-bold">🎬 Reel (10s)</span>
            <video controls playsinline preload="metadata" onplay="recordRealView('${p.id}')" src="${p.video}" class="w-full max-h-[480px] object-contain bg-black"></video>
          </div>`;
      }
      const imgs = getPostImages(p);
      if (!imgs.length) return "";
      if (imgs.length === 1) {
        return `<img onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',0)" src="${imgs[0]}" class="w-full max-h-[420px] object-cover bg-slate-900 cursor-zoom-in" loading="lazy"/>`;
      }
      if (imgs.length === 2) {
        return `<div class="grid grid-cols-2 gap-1 bg-slate-950">${imgs.map((src, i) => `<img onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',${i})" src="${src}" class="w-full aspect-square object-cover cursor-zoom-in" loading="lazy"/>`).join("")}</div>`;
      }
      if (imgs.length === 3) {
        return `<div class="grid grid-cols-2 gap-1 bg-slate-950"><img onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',0)" src="${imgs[0]}" class="col-span-2 w-full max-h-64 object-cover cursor-zoom-in" loading="lazy"/><img onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',1)" src="${imgs[1]}" class="w-full aspect-square object-cover cursor-zoom-in" loading="lazy"/><img onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',2)" src="${imgs[2]}" class="w-full aspect-square object-cover cursor-zoom-in" loading="lazy"/></div>`;
      }
      // 4, 5, or 6 photos -> 2x2 Grid (4 photos + "+1"/" +2" overlay on 4th photo!)
      const extra = imgs.length - 4;
      return `
        <div class="grid grid-cols-2 gap-1 bg-slate-950">
          ${imgs.slice(0, 4).map((src, i) => `
            <div onclick="recordRealView('${p.id}');openGalleryViewer('${p.id}',${i})" class="relative aspect-square overflow-hidden cursor-zoom-in bg-slate-900">
              <img src="${src}" class="w-full h-full object-cover" loading="lazy"/>
              ${(i === 3 && extra > 0) ? `<div class="absolute inset-0 bg-black/65 flex flex-col items-center justify-center text-white"><span class="text-3xl font-extrabold">+${extra}</span><span class="text-xs font-bold text-emerald-300 mt-0.5">ပုံ ${imgs.length} ပုံလုံးကြည့်</span></div>` : ""}
            </div>`).join("")}
        </div>`;
    }

    async function saveEditedPost(pid) {
      const p = st.posts.find(x => x.id === pid); if (!p) return;
      const text = (document.getElementById("epTxt").value || "").trim();
      if (hasBlockedClothing(text)) return toast("အဝတ်အစားစသည့် ရုပ်ပစ္စည်းများ ခွင့်မပြုပါ");
      p.text = text;
      p.privacy = document.getElementById("epPriv").value || "everyone";

        p.category = document.getElementById("epCat").value;

      toast("✓ ပို့စ်ပြင်ဆင်ပြီးပါပြီ");

      }
      area.innerHTML = `

            ${st.imgs.map((src, i) => `<div class="relative aspect-square rounded-xl overflow-hidden border border-slate-700 bg-slate-900"><img src="${src}" class="w-full h-full object-cover"/><button type="button" onclick="st.imgs.splice(${i},1);renderComposerPhotosPreview()" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/80 text-white text-xs font-bold">✕</button></div>`).join("")}
            ${st.imgs.length < 6 ? `<label class="aspect-square rounded-xl border-2 border-dashed border-emerald-500/40 bg-slate-900 flex flex-col items-center justify-center text-emerald-300 cursor-pointer"><span class="text-2xl font-bold">+</span><span class="text-[11px] font-bold">${st.imgs.length}/6</span><input type="file" accept="image/*" multiple onchange="onPickMultiImgs(event)" class="hidden"/></label>` : ""}
          </div>
        </div>`;
    }

    function onPickMultiImgs(e) {
      const files = Array.from((e.target && e.target.files) || []);
      if (!files.length) return;
      const room = Math.max(0, 6 - st.imgs.length);
      if (room === 0) return toast("အများဆုံး ဓာတ်ပုံ ၆ ပုံအထိသာ တင်နိုင်ပါသည်");
      const chosen = files.slice(0, room);
      if (files.length > room) toast("အများဆုံး ၆ ပုံအထိသာ ရွေးချယ်ပေးထားပါသည်");
      chosen.forEach(f => {
        const r = new FileReader();
        r.onload = ev => {
          const im = new Image();
          im.onload = () => {
            const c = document.createElement("canvas"), mw = 600;
            let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
            c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
            if (st.imgs.length < 6) { st.imgs.push(c.toDataURL("image/jpeg", 0.68)); renderComposerPhotosPreview(); }
          };
          im.src = ev.target.result;
        };
        r.readAsDataURL(f);
      });
      e.target.value = "";
    }

    function onPickReelVideo(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (f.size > 5 * 1024 * 1024) { e.target.value = ""; return toast("Reel ဗီဒီယိုဖိုင်ဆိုဒ် 5MB အောက်သာ တင်နိုင်ပါသည်"); }
      const url = URL.createObjectURL(f), vid = document.createElement("video");
      vid.preload = "metadata";
      vid.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        if (vid.duration > 10.8) { e.target.value = ""; return toast("Reel ဗီဒီယိုသည် ၁၀ စက္ကန့်အတွင်းသာ တင်ခွင့်ရှိပါသည်"); }
        toast("Reel ဗီဒီယို ပြင်ဆင်နေပါသည်...");
        const reader = new FileReader();
        reader.onload = ev => {
          st.reelVideo = ev.target.result;
          const area = document.getElementById("reelVideoArea");
          if (area) area.innerHTML = `<div class="relative rounded-2xl overflow-hidden border border-rose-500/40 bg-black"><video controls playsinline src="${st.reelVideo}" class="w-full max-h-60 object-contain"></video><button type="button" onclick="st.reelVideo=null;openComposerModal(null,'reel')" class="absolute top-2 right-2 px-3 py-1 rounded-full bg-black/80 text-white text-xs font-bold">✕ ဖျက်</button></div>`;
          toast(`✓ Reel ဗီဒီယို (${Math.round(vid.duration)}s) အသင့်ဖြစ်ပါပြီ`);
        };
        reader.readAsDataURL(f);
      };
      vid.src = url;
    }

    async function sendGmailOtp() {
      const email = (document.getElementById("gEmail").value || "").trim().toLowerCase();
      if (!email.includes("@") || !email.includes(".")) return showAuthErr("Gmail လိပ်စာ မှန်ကန်စွာ ထည့်ပေးပါ");
      if (!EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID || !EMAILJS_PUBLIC_KEY) {
        return showAuthErr("Gmail Code ပို့ရန် EmailJS Key ၃ ခု ချိတ်ဆက်ရန် လိုအပ်ပါသည် — လောလောဆယ် ဖုန်းနံပါတ် / ID ဖြင့် ဝင်နိုင်ပါသည်");
      }
      const btn = document.getElementById("sendCodeBtn");
      const code = String(Math.floor(100000 + Math.random() * 900000));
      btn.disabled = true; btn.textContent = "ပို့နေသည်...";
      document.getElementById("authErr").classList.add("hidden");
      try {
        const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id: EMAILJS_SERVICE_ID,
            template_id: EMAILJS_TEMPLATE_ID,
            user_id: EMAILJS_PUBLIC_KEY,
            template_params: { to_email: email, email: email, otp_code: code, passcode: code, app_name: "ဖြေးဖြေး ဝယ်" }
          })
        });
        if (!res.ok) throw new Error("EmailJS error");
        st.gmailOtp = { email, code, exp: Date.now() + 5 * 60000 };
        toast("✓ Gmail ထဲသို့ ဂဏန်း ၆ လုံး Code ပို့ပြီးပါပြီ (Spam ဖိုင်တွဲပါ စစ်ပါ)");
      } catch (e) {
        showAuthErr("Gmail Code ပို့ရာတွင် အမှားဖြစ်နေပါသည် — EmailJS ချိတ်ဆက်မှု ပြန်စစ်ပါ");
      } finally { btn.disabled = false; btn.textContent = "Code ပြန်ပို့"; }
    }

    async function submitGmailAuth() {
      const email = (document.getElementById("gEmail").value || "").trim().toLowerCase();
      const code = (document.getElementById("gCode").value || "").trim();
      const name = (document.getElementById("gName").value || "").trim();
      if (!st.gmailOtp.code || st.gmailOtp.email !== email) return showAuthErr("အရင်ဆုံး Code ပို့မည် ခလုတ်ကို နှိပ်ပါ");
      if (Date.now() > st.gmailOtp.exp) return showAuthErr("Code သက်တမ်းကုန်သွားပါပြီ — အသစ်ပြန်ပို့ပါ");
      if (code !== st.gmailOtp.code) return showAuthErr("ဂဏန်း ၆ လုံး Code မှားယွင်းနေပါသည်");
      try {
        const allUsers = (await fbGet("users")) || {};
        st.users = allUsers;
        const matched = Object.values(allUsers).find(u => u && String(u.email || "").toLowerCase() === email);
        if (matched) {
          st.me = normalizeUser(matched);
        } else {
          const n = Math.floor(100000 + Math.random() * 900000);
          const nu = normalizeUser({ id: "PPW-" + n, name: name || email.split("@")[0], email, phone: "", password: "", color: COLORS[n % COLORS.length], createdAt: Date.now() });
          nu.email = email;
          await fbPut(`users/${nu.id}`, nu);
          st.me = nu;
          st.users[nu.id] = nu;
        }
        st.gmailOtp = { email: "", code: "", exp: 0 };
        saveMe();
        document.getElementById("authScreen").classList.add("hidden");
        playSong("upload");
        toast(`မင်္ဂလာပါ ${st.me.name} ✓`);
        startPostStream(); render(); sync(true);
      } catch (e) { showAuthErr("အင်တာနက် စစ်ဆေးပြီး ပြန်စမ်းပေးပါ"); }
    }

    // 2) Block System Helpers
    function isIBlocked(uid) {
      return !!(st.me && st.me.blocked && st.me.blocked[uid]);
    }
    function isBlockedPair(uid) {
      if (!st.me || !uid || uid === st.me.id) return false;
      if (st.me.blocked && st.me.blocked[uid]) return true;
      if (st.me.blockedBy && st.me.blockedBy[uid]) return true;
      const other = st.users[uid];
      if (other && other.blocked && other.blocked[st.me.id]) return true;
      if (other && other.blockedBy && other.blockedBy[st.me.id]) return true;
      return false;
    }

    async function blockUser(uid) {
      if (!st.me || !uid || uid === st.me.id) return;
      if (!confirm(`${uInfo(uid).name} ကို Block မှာ သေချာပါသလား?\nBlock လိုက်ပါက သူ့ဘက်မှ သင့် Profile၊ ပို့စ်နှင့် စာတိုများ မမြင်ရတော့ပါ။`)) return;
      if (!st.me.blocked) st.me.blocked = {};
      st.me.blocked[uid] = true;
      st.me.friends = (st.me.friends || []).filter(f => f !== uid);
      st.me.following = (st.me.following || []).filter(f => f !== uid);
      saveMe();
      if (st.users[uid]) {
        if (!st.users[uid].blockedBy) st.users[uid].blockedBy = {};
        st.users[uid].blockedBy[st.me.id] = true;
      }
      await Promise.all([
        fbPut(`users/${st.me.id}/blocked/${uid}`, true),
        fbPut(`users/${st.me.id}/friends`, st.me.friends),
        fbPut(`users/${st.me.id}/following`, st.me.following),
        fbPut(`users/${uid}/blockedBy/${st.me.id}`, true)
      ]).catch(() => {});
      closeModal();
      playSong("angry");
      toast("🚫 Block လုပ်ပြီးပါပြီ — သူ့ဘက်မှ သင့်ကို မမြင်ရတော့ပါ");
      switchTab("home");
    }

    async function unblockUser(uid) {
      if (!st.me || !uid) return;
      if (st.me.blocked) delete st.me.blocked[uid];
      saveMe();
      if (st.users[uid] && st.users[uid].blockedBy) delete st.users[uid].blockedBy[st.me.id];
      await Promise.all([
        fbDel(`users/${st.me.id}/blocked/${uid}`),
        fbDel(`users/${uid}/blockedBy/${st.me.id}`)
      ]).catch(() => {});
      toast("✓ Unblock (ပြန်ဖွင့်) ပြီးပါပြီ");
      closeModal();
      safeRender(true);
    }
