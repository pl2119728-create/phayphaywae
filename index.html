<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#059669" />
  <title>ဖြေးဖြေး ဝယ် - Phay Phay Wae</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Myanmar', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp .2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl flex flex-col relative pb-20">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">ဖြေးဖြေး ဝယ်</h1>
          <div class="flex items-center gap-1.5">
            <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="syncText" class="text-[11px] text-slate-500 font-medium">ချိတ်ဆက်ပြီး</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openChatListModal()" class="relative p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700" title="စာတိုများ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </button>
        <button onclick="switchTab('notifications')" class="relative p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700" title="အကြောင်းကြားစာ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-2 py-1.5 flex items-center justify-around z-30">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-emerald-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[11px] font-semibold">ပင်မ</span>
      </button>
      <button onclick="switchTab('explore')" id="nav-explore" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="text-[11px] font-medium">ရှာဖွေရန်</span>
      </button>
      <button onclick="openComposerModal()" class="flex items-center justify-center w-11 h-11 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md shadow-emerald-200 active:scale-95 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
      <button onclick="switchTab('friends')" id="nav-friends" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[11px] font-medium">သူငယ်ချင်း</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[11px] font-medium">ပရိုဖိုင်</span>
      </button>
    </nav>

    <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap"></div>
    <div id="modalRoot"></div>
  </div>

  <script>
    const DB = "https://phay-phay-wae-default-rtdb.asia-southeast1.firebasedatabase.app";
    const CATS = ["အားလုံး", "ဖုန်းနှင့်အီလက်ထရောနစ်", "ဖက်ရှင်နှင့်အလှကုန်", "အိမ်သုံးပစ္စည်း", "အစားအသောက်", "ကား/ဆိုင်ကယ်", "အထွေထွေ"];
    const COLORS = ["from-emerald-500 to-teal-600", "from-blue-500 to-indigo-600", "from-amber-500 to-orange-600", "from-rose-500 to-pink-600", "from-purple-500 to-violet-600"];

    function getUser() {
      try {
        const s = JSON.parse(localStorage.getItem("ppw_user_v1"));
        if (s && s.id) return s;
      } catch (e) {}
      const n = Math.floor(100000 + Math.random() * 900000);
      const u = { id: "PPW-" + n, name: "အသုံးပြုသူ #" + String(n).slice(-4), bio: "ဖြေးဖြေး ဝယ် မှာ စိတ်ချလက်ချ ရောင်းဝယ်နေပါတယ်။", phone: "", color: COLORS[n % COLORS.length], friends: [], createdAt: Date.now() };
      try { localStorage.setItem("ppw_user_v1", JSON.stringify(u)); } catch (e) {}
      return u;
    }

    let st = {
      tab: "home", me: getUser(), posts: [], users: {}, reviews: {}, notifs: [], chats: {},
      cat: "အားလုံး", q: "", fq: "", openCmt: {}, img: null, chatUid: null
    };

    const saveMe = () => { try { localStorage.setItem("ppw_user_v1", JSON.stringify(st.me)); } catch (e) {} };
    const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function toast(m) {
      const el = document.getElementById("toast"); el.textContent = m; el.classList.remove("hidden");
      clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.add("hidden"), 2400);
    }
    function ago(ts) {
      const d = Math.floor((Date.now() - (ts || Date.now())) / 1000);
      if (d < 60) return "ယခုလေးတင်";
      if (d < 3600) return Math.floor(d / 60) + " မိနစ်ခန့်က";
      if (d < 86400) return Math.floor(d / 3600) + " နာရီခန့်က";
      return Math.floor(d / 86400) + " ရက်ခန့်က";
    }
    const uInfo = id => id === st.me.id ? st.me : (st.users[id] || { id, name: id, bio: "", color: "from-slate-500 to-slate-600" });
    function uRating(id) {
      const l = Object.values(st.reviews || {}).filter(r => r.targetId === id);
      if (!l.length) return { avg: 0, count: 0, list: [] };
      return { avg: (l.reduce((a, b) => a + (Number(b.rating) || 5), 0) / l.length).toFixed(1), count: l.length, list: l };
    }
    function avatar(u, sz = "w-10 h-10 text-sm") {
      const x = typeof u === "string" ? uInfo(u) : u;
      return `<div class="${sz} rounded-full bg-gradient-to-br ${x.color || COLORS[0]} text-white font-bold flex items-center justify-center shrink-0 shadow-sm">${esc((x.name || "U").trim().charAt(0).toUpperCase())}</div>`;
    }

    const fbGet = p => fetch(`${DB}/${p}.json`).then(r => r.json());
    const fbPut = (p, d) => fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const fbDel = p => fetch(`${DB}/${p}.json`, { method: "DELETE" });

    async function sync(init = false) {
      try {
        if (init) await fbPut(`users/${st.me.id}`, st.me);
        const [po, us, rv, no, ch] = await Promise.all([fbGet("posts"), fbGet("users"), fbGet("reviews"), fbGet(`notifications/${st.me.id}`), fbGet("chats")]);
        st.posts = po ? Object.values(po).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        st.users = us || {}; st.users[st.me.id] = st.me;
        st.reviews = rv || {};
        st.notifs = no ? Object.values(no).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        st.chats = ch || {};
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-emerald-500";
        document.getElementById("syncText").textContent = "တိုက်ရိုက်ချိတ်ဆက်ပြီး";
        const unread = st.notifs.filter(n => !n.read).length;
        const nb = document.getElementById("notifBadge");
        if (unread > 0) { nb.textContent = unread > 9 ? "9+" : unread; nb.classList.remove("hidden"); } else nb.classList.add("hidden");
        const tag = document.activeElement ? document.activeElement.tagName : "";
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) { render(); if (st.chatUid) renderMsgs(); }
      } catch (e) {
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-amber-500";
        document.getElementById("syncText").textContent = "ချိတ်ဆက်နေဆဲ...";
      }
    }

    function notify(toId, text) {
      if (!toId || toId === st.me.id) return;
      const id = "N-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      fbPut(`notifications/${toId}/${id}`, { id, fromId: st.me.id, fromName: st.me.name, text, read: false, createdAt: Date.now() }).catch(() => {});
    }

    function switchTab(t) {
      st.tab = t;
      document.querySelectorAll(".nav-btn").forEach(b => { b.classList.remove("text-emerald-600"); b.classList.add("text-slate-500"); });
      const a = document.getElementById("nav-" + t);
      if (a) { a.classList.remove("text-slate-500"); a.classList.add("text-emerald-600"); }
      if (t === "notifications") {
        st.notifs.filter(n => !n.read).forEach(n => { n.read = true; fbPut(`notifications/${st.me.id}/${n.id}/read`, true).catch(() => {}); });
        document.getElementById("notifBadge").classList.add("hidden");
      }
      render();
    }

    function render() {
      const el = document.getElementById("mainContent");
      if (st.tab === "home") {
        const list = st.posts.filter(p => st.cat === "အားလုံး" || p.category === st.cat);
        el.innerHTML = `
          <div class="bg-white p-3.5 border-b border-slate-200 flex items-center gap-3">
            <div onclick="switchTab('profile')" class="cursor-pointer">${avatar(st.me)}</div>
            <button onclick="openComposerModal()" class="flex-1 text-left bg-slate-100 hover:bg-slate-200/70 text-slate-500 text-sm px-4 py-2.5 rounded-full">ဘာတွေ ရောင်းချင် / ဝယ်ချင်လဲ...</button>
            <button onclick="openComposerModal()" class="p-2.5 rounded-full bg-emerald-50 text-emerald-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></button>
          </div>
          <div class="bg-white px-3 py-2.5 border-b border-slate-200 flex items-center gap-2 overflow-x-auto no-scrollbar">
            ${CATS.map(c => `<button onclick="st.cat='${c}';render()" class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${st.cat === c ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-600"}">${c}</button>`).join("")}
          </div>
          <div class="p-3 space-y-3">${list.length ? list.map(postCard).join("") : `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-xs text-slate-500">ပို့စ်မရှိသေးပါ — ပထမဆုံး ပို့စ်တစ်ခု တင်ကြည့်လိုက်ပါ!</div>`}</div>`;
      } else if (st.tab === "explore") {
        const q = st.q.trim().toLowerCase();
        const res = st.posts.filter(p => !q || (p.text || "").toLowerCase().includes(q) || (p.category || "").toLowerCase().includes(q) || (p.price || "").toLowerCase().includes(q) || (uInfo(p.authorId).name || "").toLowerCase().includes(q));
        el.innerHTML = `
          <div class="p-3.5 space-y-3">
            <input type="text" value="${esc(st.q)}" oninput="st.q=this.value;render()" placeholder="ပစ္စည်းအမည်၊ ရောင်းသူ သို့မဟုတ် အမျိုးအစား ရှာရန်..." class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500"/>
            <div class="grid grid-cols-2 gap-2">${CATS.slice(1).map(c => `<button onclick="st.cat='${c}';switchTab('home')" class="bg-white p-3 rounded-2xl border border-slate-200 text-left"><div class="text-xs font-bold">${c}</div><div class="text-[11px] text-slate-500">ပို့စ် ${st.posts.filter(p => p.category === c).length} ခု</div></button>`).join("")}</div>
            <div class="space-y-3">${res.map(postCard).join("")}</div>
          </div>`;
      } else if (st.tab === "friends") {
        const q = st.fq.trim().toLowerCase();
        const users = Object.values(st.users).filter(u => u && u.id !== st.me.id && (!q || u.id.toLowerCase().includes(q) || (u.name || "").toLowerCase().includes(q)));
        el.innerHTML = `
          <div class="p-3.5 space-y-4">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-2xl p-4 text-white">
              <div class="text-xs text-emerald-100">သင့် User ID</div>
              <div class="flex items-center justify-between mt-1"><span class="text-lg font-bold">${esc(st.me.id)}</span><button onclick="copyId('${st.me.id}')" class="px-3 py-1.5 rounded-xl bg-white/20 text-xs font-semibold">ID ကူးမည်</button></div>
            </div>
            <input type="text" value="${esc(st.fq)}" oninput="st.fq=this.value;render()" placeholder="User ID (ဥပမာ PPW-123456) ဖြင့် ရှာရန်..." class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-2.5 text-sm"/>
            <div class="space-y-2">${users.length ? users.map(u => {
              const isF = (st.me.friends || []).includes(u.id);
              return `<div class="bg-white p-3 rounded-2xl border border-slate-200 flex items-center justify-between gap-2">
                <div onclick="openUserModal('${u.id}')" class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0">${avatar(u)}<div class="min-w-0"><div class="text-sm font-bold truncate">${esc(u.name)}</div><div class="text-[11px] text-slate-500 font-mono">${esc(u.id)}</div></div></div>
                <button onclick="openChat('${u.id}')" class="px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-semibold">စာပို့</button>
                <button onclick="toggleFriend('${u.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${isF ? "bg-slate-100 text-slate-700" : "bg-emerald-600 text-white"}">${isF ? "သူငယ်ချင်း ✓" : "+ အပ်မည်"}</button>
              </div>`;
            }).join("") : `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-500 border border-slate-200">အခြားအသုံးပြုသူ မတွေ့သေးပါ</div>`}</div>
          </div>`;
      } else if (st.tab === "notifications") {
        el.innerHTML = `<div class="p-3.5 space-y-2"><h2 class="text-sm font-bold px-1">အကြောင်းကြားစာများ</h2>${st.notifs.length ? st.notifs.map(n => `<div onclick="openUserModal('${n.fromId}')" class="bg-white p-3 rounded-2xl border border-slate-200 flex items-center gap-3 cursor-pointer">${avatar(n.fromId)}<div><p class="text-xs"><span class="font-bold">${esc(n.fromName)}</span> ${esc(n.text)}</p><span class="text-[10px] text-slate-400">${ago(n.createdAt)}</span></div></div>`).join("") : `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-500 border border-slate-200">အကြောင်းကြားစာ မရှိသေးပါ</div>`}</div>`;
      } else if (st.tab === "profile") {
        const r = uRating(st.me.id);
        const mine = st.posts.filter(p => p.authorId === st.me.id);
        el.innerHTML = `
          <div class="p-3.5 space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
              <div class="flex items-center gap-3">${avatar(st.me, "w-14 h-14 text-lg")}<div><h2 class="text-base font-bold">${esc(st.me.name)}</h2><div class="text-xs font-mono text-slate-500">${esc(st.me.id)} <button onclick="copyId('${st.me.id}')" class="text-emerald-600 font-sans font-semibold ml-1">ကူးမည်</button></div><div class="text-xs text-amber-600 font-semibold">★ ${r.count ? `${r.avg} (${r.count} ခု)` : "သုံးသပ်ချက် မရှိသေးပါ"}</div></div></div>
              <input id="pName" type="text" value="${esc(st.me.name)}" placeholder="နာမည်" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"/>
              <input id="pBio" type="text" value="${esc(st.me.bio || "")}" placeholder="မိတ်ဆက်စာ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"/>
              <input id="pPhone" type="text" value="${esc(st.me.phone || "")}" placeholder="ဖုန်းနံပါတ် (Optional)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"/>
              <button onclick="saveProfile()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">ပရိုဖိုင် သိမ်းဆည်းမည်</button>
            </div>
            <div class="space-y-2.5"><h3 class="text-xs font-bold text-slate-500 px-1">ကျွန်ုပ်၏ ပို့စ်များ (${mine.length})</h3>${mine.map(postCard).join("")}</div>
          </div>`;
      }
    }

    function postCard(p) {
      const au = uInfo(p.authorId), rt = uRating(p.authorId), lk = p.likes || {}, lCnt = Object.keys(lk).length, isLk = !!lk[st.me.id];
      const cmts = p.comments ? Object.values(p.comments).sort((a, b) => a.createdAt - b.createdAt) : [], exp = !!st.openCmt[p.id], own = p.authorId === st.me.id;
      return `
        <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-3.5 pb-2 flex items-center justify-between">
            <div onclick="openUserModal('${p.authorId}')" class="flex items-center gap-2.5 cursor-pointer">
              ${avatar(au)}
              <div>
                <div class="flex items-center gap-1.5"><span class="text-sm font-bold">${esc(au.name)}</span>${rt.count ? `<span class="text-[11px] font-semibold text-amber-600 bg-amber-50 px-1.5 rounded">★ ${rt.avg}</span>` : ""}</div>
                <div class="text-[11px] text-slate-500">${ago(p.createdAt)} ${p.category && p.category !== "အားလုံး" ? `• <span class="text-emerald-700 font-medium">${esc(p.category)}</span>` : ""}</div>
              </div>
            </div>
            ${own ? `<button onclick="delPost('${p.id}')" class="text-xs text-rose-500 font-semibold px-2 py-1">ဖျက်</button>` : `<button onclick="openChat('${p.authorId}')" class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold">စာပို့မည်</button>`}
          </div>
          ${p.price ? `<div class="px-3.5 pb-1.5"><span class="inline-block px-2.5 py-0.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold">${esc(p.price)}</span></div>` : ""}
          ${p.text ? `<div class="px-3.5 pb-3 text-sm text-slate-800 whitespace-pre-line">${esc(p.text)}</div>` : ""}
          ${p.image ? `<img src="${p.image}" class="w-full max-h-96 object-cover bg-slate-100" loading="lazy"/>` : ""}
          <div class="px-3 py-2 border-t border-slate-100 flex text-xs">
            <button onclick="likePost('${p.id}')" class="flex-1 py-1.5 rounded-xl font-semibold ${isLk ? "text-rose-600 bg-rose-50" : "text-slate-600"}">♥ ကြိုက်တယ် ${lCnt ? `(${lCnt})` : ""}</button>
            <button onclick="st.openCmt['${p.id}']=!st.openCmt['${p.id}'];render()" class="flex-1 py-1.5 rounded-xl font-semibold text-slate-600">💬 မှတ်ချက် ${cmts.length ? `(${cmts.length})` : ""}</button>
          </div>
          ${exp ? `<div class="bg-slate-50 px-3.5 py-3 border-t border-slate-100 space-y-2">
            ${cmts.map(c => `<div class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs"><span class="font-bold">${esc(uInfo(c.authorId).name)}:</span> ${esc(c.text)}</div>`).join("")}
            <div class="flex gap-2"><input id="ci-${p.id}" type="text" placeholder="မှတ်ချက်ရေးရန်..." onkeydown="if(event.key==='Enter')addCmt('${p.id}')" class="flex-1 bg-white border border-slate-200 rounded-full px-3 py-1.5 text-xs"/><button onclick="addCmt('${p.id}')" class="px-3 py-1.5 rounded-full bg-emerald-600 text-white text-xs font-semibold">ပို့</button></div>
          </div>` : ""}
        </article>`;
    }

    function copyId(id) { if (navigator.clipboard) navigator.clipboard.writeText(id); toast("ID (" + id + ") ကူးပြီးပါပြီ"); }

    async function saveProfile() {
      const n = document.getElementById("pName").value.trim();
      if (!n) return toast("နာမည် ထည့်ပေးပါ");
      st.me.name = n; st.me.bio = document.getElementById("pBio").value.trim(); st.me.phone = document.getElementById("pPhone").value.trim();
      saveMe(); st.users[st.me.id] = st.me; render(); toast("သိမ်းဆည်းပြီးပါပြီ");
      fbPut(`users/${st.me.id}`, st.me).catch(() => {});
    }

    async function toggleFriend(id) {
      const l = st.me.friends || [], i = l.indexOf(id);
      if (i >= 0) { l.splice(i, 1); toast("သူငယ်ချင်းမှ ဖယ်ရှားပြီးပါပြီ"); }
      else { l.push(id); toast("သူငယ်ချင်း အပ်လိုက်ပါပြီ"); notify(id, "က သင့်ကို သူငယ်ချင်းအဖြစ် ထည့်လိုက်ပါသည်"); }
      st.me.friends = l; saveMe(); render(); fbPut(`users/${st.me.id}`, st.me).catch(() => {});
    }

    function openComposerModal() {
      st.img = null;
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 animate-slide-up max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
              <button onclick="closeModal()" class="text-xs font-semibold text-slate-500">ပိတ်မည်</button>
              <h3 class="text-sm font-bold">ပို့စ်အသစ်တင်ရန်</h3>
              <button onclick="submitPost()" id="pubBtn" class="px-4 py-1.5 rounded-full bg-emerald-600 text-white text-xs font-bold">တင်မည်</button>
            </div>
            <textarea id="postTxt" rows="4" placeholder="ဘာတွေ ရောင်းချင် / ဝယ်ချင်လဲ ရေးပါ..." class="w-full text-sm focus:outline-none resize-none"></textarea>
            <div id="imgBox" class="hidden relative rounded-2xl overflow-hidden border border-slate-200">
              <img id="imgPrev" src="" class="w-full max-h-60 object-cover"/>
              <button onclick="st.img=null;document.getElementById('imgBox').classList.add('hidden')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 text-white text-xs">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input id="postPrice" type="text" placeholder="ဈေးနှုန်း (မထည့်လည်းရ)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs"/>
              <select id="postCat" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">${CATS.map(c => `<option value="${c}">${c === "အားလုံး" ? "အမျိုးအစား (မရွေးလည်းရ)" : c}</option>`).join("")}</select>
            </div>
            <label class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold cursor-pointer">
              <span>📷 ဓာတ်ပုံရွေးမည်</span>
              <input type="file" accept="image/*" onchange="onPickImg(event)" class="hidden"/>
            </label>
          </div>
        </div>`;
    }

    function onPickImg(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas"), mw = 720;
          let w = im.width, h = im.height; if (w > mw) { h = Math.round(h * mw / w); w = mw; }
          c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
          st.img = c.toDataURL("image/jpeg", 0.72);
          document.getElementById("imgPrev").src = st.img;
          document.getElementById("imgBox").classList.remove("hidden");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    }

    async function submitPost() {
      const text = document.getElementById("postTxt").value.trim(), price = document.getElementById("postPrice").value.trim(), category = document.getElementById("postCat").value;
      if (!text && !st.img) return toast("စာသား သို့မဟုတ် ဓာတ်ပုံ တစ်ခုခု ထည့်ပေးပါ");
      const id = "P-" + Date.now() + "-" + Math.floor(Math.random() * 999);
      const p = { id, authorId: st.me.id, text, image: st.img || "", price, category, likes: {}, comments: {}, createdAt: Date.now() };
      st.posts.unshift(p); closeModal(); render(); toast("ပို့စ်တင်ပြီးပါပြီ");
      fbPut(`users/${st.me.id}`, st.me).catch(() => {});
      fbPut(`posts/${id}`, p).catch(() => toast("အင်တာနက် စစ်ဆေးပေးပါ"));
    }

    function delPost(id) { st.posts = st.posts.filter(p => p.id !== id); render(); toast("ပို့စ်ဖျက်ပြီးပါပြီ"); fbDel(`posts/${id}`).catch(() => {}); }

    function likePost(id) {
      const p = st.posts.find(x => x.id === id); if (!p) return; if (!p.likes) p.likes = {};
      if (p.likes[st.me.id]) { delete p.likes[st.me.id]; fbDel(`posts/${id}/likes/${st.me.id}`).catch(() => {}); }
      else { p.likes[st.me.id] = true; notify(p.authorId, "က သင့်ပို့စ်ကို နှစ်သက်ပါသည်"); fbPut(`posts/${id}/likes/${st.me.id}`, true).catch(() => {}); }
      render();
    }

    function addCmt(id) {
      const inp = document.getElementById("ci-" + id); if (!inp) return;
      const text = inp.value.trim(); if (!text) return;
      const p = st.posts.find(x => x.id === id); if (!p) return; if (!p.comments) p.comments = {};
      const cid = "C-" + Date.now(); const c = { id: cid, authorId: st.me.id, text, createdAt: Date.now() };
      p.comments[cid] = c; inp.value = ""; render();
      notify(p.authorId, "က မှတ်ချက်ရေးခဲ့သည်: " + text.slice(0, 20));
      fbPut(`posts/${id}/comments/${cid}`, c).catch(() => {});
    }

    function openUserModal(uid) {
      const u = uInfo(uid), r = uRating(uid), isF = (st.me.friends || []).includes(uid), own = uid === st.me.id;
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3.5 animate-slide-up max-h-[88vh] overflow-y-auto">
            <div class="flex justify-between"><span class="text-xs font-mono text-slate-500">${esc(u.id)}</span><button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button></div>
            <div class="flex items-center gap-3">${avatar(u, "w-14 h-14 text-lg")}<div><h3 class="text-base font-bold">${esc(u.name)}</h3><p class="text-xs text-slate-500">${esc(u.bio || "")}</p>${u.phone ? `<p class="text-xs text-emerald-700 font-semibold">📞 ${esc(u.phone)}</p>` : ""}</div></div>
            ${!own ? `<div class="grid grid-cols-2 gap-2">
              <button onclick="toggleFriend('${u.id}');openUserModal('${u.id}')" class="py-2 rounded-xl text-xs font-bold ${isF ? "bg-slate-100 text-slate-700" : "bg-emerald-600 text-white"}">${isF ? "သူငယ်ချင်း ✓" : "+ သူငယ်ချင်းအပ်"}</button>
              <button onclick="openChat('${u.id}')" class="py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">စာပို့မည်</button>
            </div>` : ""}
            <div class="pt-2 border-t border-slate-100 space-y-2">
              <div class="text-xs font-bold">သုံးသပ်ချက်များ (★ ${r.avg || "0.0"} • ${r.count} ခု)</div>
              ${!own ? `<div class="flex gap-1.5">
                <select id="rvStar" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-amber-600"><option value="5">5★</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option><option value="1">1★</option></select>
                <input id="rvTxt" type="text" placeholder="သုံးသပ်ချက်ရေးရန်..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs"/>
                <button onclick="addReview('${u.id}')" class="px-3 py-1.5 rounded-xl bg-amber-500 text-white text-xs font-bold">ပို့</button>
              </div>` : ""}
              <div class="space-y-1.5 max-h-36 overflow-y-auto">${r.list.map(x => `<div class="bg-slate-50 p-2 rounded-xl text-xs"><span class="font-bold">${esc(uInfo(x.authorId).name)}</span> <span class="text-amber-500">${"★".repeat(x.rating || 5)}</span><div class="text-slate-600">${esc(x.text)}</div></div>`).join("")}</div>
            </div>
          </div>
        </div>`;
    }

    function addReview(tid) {
      const rating = Number(document.getElementById("rvStar").value) || 5, text = document.getElementById("rvTxt").value.trim() || "ယုံကြည်စိတ်ချရပါတယ်";
      const id = "R-" + Date.now(), rv = { id, targetId: tid, authorId: st.me.id, rating, text, createdAt: Date.now() };
      st.reviews[id] = rv; openUserModal(tid); toast("သုံးသပ်ချက် ပေးပို့ပြီးပါပြီ"); notify(tid, `က သင့်ကို ${rating}★ သုံးသပ်ချက် ပေးခဲ့သည်`);
      fbPut(`reviews/${id}`, rv).catch(() => {});
    }

    const roomId = (a, b) => [a, b].sort().join("__");

    function openChatListModal() {
      const rooms = Object.entries(st.chats || {}).filter(([k]) => k.includes(st.me.id));
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 animate-slide-up max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between pb-2 border-b border-slate-100"><h3 class="text-sm font-bold">တိုက်ရိုက်စာတိုများ</h3><button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button></div>
            ${rooms.length ? rooms.map(([k, mObj]) => {
              const oid = k.split("__").find(x => x !== st.me.id) || st.me.id, o = uInfo(oid);
              const ms = Object.values(mObj || {}).sort((a, b) => a.createdAt - b.createdAt), last = ms[ms.length - 1];
              return `<div onclick="openChat('${oid}')" class="p-3 rounded-2xl bg-slate-50 flex items-center gap-3 cursor-pointer">${avatar(o)}<div class="min-w-0 flex-1"><div class="text-xs font-bold">${esc(o.name)}</div><div class="text-[11px] text-slate-500 truncate">${last ? esc(last.text) : ""}</div></div></div>`;
            }).join("") : `<p class="text-xs text-slate-400 text-center py-6">စာပို့ထားသူ မရှိသေးပါ</p>`}
          </div>
        </div>`;
    }

    function openChat(oid) {
      st.chatUid = oid; const o = uInfo(oid);
      document.getElementById("modalRoot").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl flex flex-col h-[80vh] animate-slide-up overflow-hidden">
            <div class="p-3.5 border-b border-slate-200 flex items-center justify-between">
              <div class="flex items-center gap-2.5">${avatar(o, "w-9 h-9 text-xs")}<div><div class="text-xs font-bold">${esc(o.name)}</div><div class="text-[10px] text-slate-400 font-mono">${esc(o.id)}</div></div></div>
              <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button>
            </div>
            <div id="msgBox" class="flex-1 p-3.5 overflow-y-auto space-y-2 bg-slate-50"></div>
            <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
              <input id="msgInp" type="text" placeholder="စာရိုက်ပါ..." onkeydown="if(event.key==='Enter')sendMsg()" class="flex-1 bg-slate-100 rounded-full px-4 py-2 text-xs focus:outline-none"/>
              <button onclick="sendMsg()" class="px-4 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold">ပို့</button>
            </div>
          </div>
        </div>`;
      renderMsgs();
    }

    function renderMsgs() {
      const box = document.getElementById("msgBox"); if (!box || !st.chatUid) return;
      const ms = Object.values(st.chats[roomId(st.me.id, st.chatUid)] || {}).sort((a, b) => a.createdAt - b.createdAt);
      box.innerHTML = ms.length ? ms.map(m => {
        const me = m.senderId === st.me.id;
        return `<div class="flex ${me ? "justify-end" : "justify-start"}"><div class="max-w-[78%] px-3.5 py-2 rounded-2xl text-xs ${me ? "bg-emerald-600 text-white" : "bg-white border border-slate-200"}">${esc(m.text)}</div></div>`;
      }).join("") : `<p class="text-xs text-slate-400 text-center py-8">မင်္ဂလာပါ! စကားစပြောလိုက်ပါ 👋</p>`;
      box.scrollTop = box.scrollHeight;
    }

    function sendMsg() {
      const inp = document.getElementById("msgInp"); if (!inp || !st.chatUid) return;
      const text = inp.value.trim(); if (!text) return;
      const rid = roomId(st.me.id, st.chatUid), mid = "M-" + Date.now();
      const m = { id: mid, senderId: st.me.id, text, createdAt: Date.now() };
      if (!st.chats[rid]) st.chats[rid] = {}; st.chats[rid][mid] = m;
      inp.value = ""; renderMsgs(); notify(st.chatUid, "က စာပို့လိုက်သည်: " + text.slice(0, 20));
      fbPut(`chats/${rid}/${mid}`, m).catch(() => {});
    }

    function closeModal() { st.chatUid = null; document.getElementById("modalRoot").innerHTML = ""; }

    render();
    sync(true);
    setInterval(() => sync(false), 3500);
  </script>
</body>
</html>
